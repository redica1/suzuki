<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>학부모 신청 · 스즈키 겨울 음악제</title><script>if(/[?&]test\b/i.test(location.search)&&document.title.indexOf('[STG]')<0)document.title='[STG] '+document.title</script>
<!--
  학부모 신청 (2026-11-15) — 학원 다니는 학생의 보호자가 회원가입 없이 「간다 / 안 간다」 · 같이 가는 가족 이름을 학원 선생님께 보냄
  · https://app.suzukimusickorea.org/camp/parent.html       → 메인 앱 ?page=parent
  · https://app.suzukimusickorea.org/camp/parent.html?test  → STG
-->
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta property="og:title" content="스즈키 겨울 음악제 · 학부모 신청">
<meta property="og:description" content="학생이 캠프에 가는지와 같이 가는 가족 이름만 학원 선생님께 알려 주세요. 회원가입 없이 이름 · 휴대전화로.">
<meta name="theme-color" content="#0f9d9a">
<style>
  html, body { margin: 0; height: 100%; background: #eef0f4; }
  [hidden] { display: none !important; }
  body { font: 600 17px/1.55 "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; color: #18203a; }
  #app { position: fixed; inset: 0; width: 100%; height: 100%; height: 100dvh; border: 0; display: block; }
  .msg { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 24px; color: #5d6680; }
  .msg b { color: #18203a; font-size: 21px; }
  .msg a.btn { display: inline-block; background: #2c46c9; color: #fff; text-decoration: none; border-radius: 12px; padding: 14px 22px; font-size: 18px; font-weight: 700; }
  .msg a.sub { color: #5d6680; font-size: 15px; }
  .spin { width: 26px; height: 26px; border-radius: 50%; border: 3px solid #2c46c9; border-right-color: transparent; animation: s .8s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="msg" id="wait" hidden><span class="spin"></span>학부모 신청 화면을 여는 중이에요…<small id="slow" hidden>오래 걸리면 <a id="direct" target="_top">여기를 눌러 바로 열어 주세요</a></small></div>
<div class="msg" id="inapp" hidden>
  <b>크롬이나 사파리에서 열어 주세요</b>
  <span>카카오톡 같은 앱 안에서는 열리지 않아요.</span>
  <a class="btn" id="openOut">브라우저로 열기</a>
  <a class="sub" id="copyUrl" href="#">주소 복사</a>
</div>
<iframe id="app" title="학부모 신청" allow="camera; clipboard-write; clipboard-read; screen-wake-lock" hidden></iframe>
<script>
(function () {
  var PROD = 'https://script.google.com/macros/s/AKfycbzrzYgEsPnHVcBIjobN9xB6nGBcZ7nPYMX7hDtx3OoI7WYokszGDLhcO0lHWYz9rWAt7w/exec';   // 메인 (실제 접수)
  var STG  = 'https://script.google.com/macros/s/AKfycby2WK6m-LkmOgUM3V2P_yA0f2kobvlfJw7qmNE36Tzxg6xvj6dQPKJuVFmT68zP7_55/exec';   // 테스트 (STG)
  var APP = (/[?&]test\b/i.test(location.search) ? STG : PROD) + '?page=parent';
  var ua = navigator.userAgent || '', here = location.href.split('#')[0];
  var android = /Android/i.test(ua);
  var kakao = /KAKAOTALK/i.test(ua), line = / Line\//i.test(ua);
  var otherApp = /NAVER\(inapp|Instagram|FBAN|FBAV|BAND\/|DaumApps|everytimeApp|; wv\)/i.test(ua);
  var out = '';
  if (kakao) out = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(here);
  else if (line) out = here + (here.indexOf('?') < 0 ? '?' : '&') + 'openExternalBrowser=1';
  else if (otherApp && android) out = 'intent://' + here.replace(/^https?:\/\//, '') + '#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=' + encodeURIComponent(here) + ';end';

  if (kakao || line || otherApp) {
    document.getElementById('inapp').hidden = false;
    var b = document.getElementById('openOut');
    if (out) { b.href = out; setTimeout(function () { location.href = out; }, 50); }
    else b.style.display = 'none';
    document.getElementById('copyUrl').onclick = function (e) {
      e.preventDefault();
      var done = function () { alert('복사했어요. 크롬이나 사파리 주소창에 붙여 넣어 주세요.'); };
      try { navigator.clipboard.writeText(here).then(done, function () { prompt('이 주소를 브라우저에 붙여 넣어 주세요', here); }); }
      catch (x) { prompt('이 주소를 브라우저에 붙여 넣어 주세요', here); }
    };
    return;
  }
  var app = document.getElementById('app');
  document.getElementById('wait').hidden = false;
  document.getElementById('direct').href = APP;
  app.src = APP; app.hidden = false;
  setTimeout(function () { document.getElementById('slow').hidden = false; }, 10000);
})();
</script>
</body>
</html>
