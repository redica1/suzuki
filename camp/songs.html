<style>

*{box-sizing:border-box}

<body>
<header class="band"><div class="in"><small id="camp">스즈키 겨울 음악제</small><h1 id="h1">오후 음악회 신청 가능한 곡</h1><p class="h1en">Repertoire List for Concerts</p>
  <div class="go2"><a class="gob" id="goJoin" href="https://app.suzukimusickorea.org/member/index.html">회원가입</a><a class="gob pri" id="goCamp" href="https://app.suzukimusickorea.org/camp/new.html">겨울캠프 접수 · 음원 먼저 내기</a></div></div></header>
<main class="wrap">
  <div class="bar">
    <div class="row"><div class="seg" id="inst" role="tablist" aria-label="악기"></div><div class="seg" id="lang" aria-label="언어"><button type="button" data-l="ko" aria-pressed="true">한국어</button><button type="button" data-l="en" aria-pressed="false">English</button></div></div>
  </div>
  <div class="rule"><p id="ruleKo">10권 이하 레벨 신청자는 스즈키 교재 수록곡 중 아래 지정곡만 신청 가능합니다.</p><p id="ruleEn" hidden>Applicants at Suzuki Book Level 10 or below may select only the designated pieces listed below from the Suzuki repertoire.</p></div>
  <div id="list"><p class="msg">곡 목록을 불러오고 있어요…</p></div>
  <p class="note" id="free"></p>
</main>
<footer id="foot">한국스즈키음악협회</footer>
<script>
(function(){
  var PROD='https:\/\/script.google.com/macros/s/AKfycbzrzYgEsPnHVcBIjobN9xB6nGBcZ7nPYMX7hDtx3OoI7WYokszGDLhcO0lHWYz9rWAt7w/exec';
  var STGU='https:\/\/script.google.com/macros/s/AKfycby2WK6m-LkmOgUM3V2P_yA0f2kobvlfJw7qmNE36Tzxg6xvj6dQPKJuVFmT68zP7_55/exec';
  var URL0=(/[?&]test\b/i.test(location.search)?STGU:PROD)+'?page=songs';
  var EN={'바이올린':'Violin','첼로':'Cello','비올라':'Viola','플루트':'Flute'};
  /* 11-27 사용자: 언어 한국어 / English / 한국어+English · 처음 = 한국어 · 고른 악기 · 언어가 주소에 붙음(?i= · lang=) → 그 주소로 안내 */
  var QS=new URLSearchParams(location.search),L0=QS.get('lang');
  if(/[?&]test\b/i.test(location.search)){document.getElementById('goJoin').href+='?test';document.getElementById('goCamp').href+='?test'}   /* 11-27 위 버튼 2개: 회원가입 · 겨울캠프 = 새 접수 화면 camp/new.html (음원 먼저 내기 상자 있음) */
  var S={d:null,inst:QS.get('i')||'',lang:L0==='en'?'en':'ko',q:''};   /* 11-27 사용자: 언어 탭 한국어 / English (외국인용 · 주소 lang=en) */   /* 11-27 사용자: 지금은 한글만 · 찾기 · 언어 · 링크 복사 없이 악기만 */
  function urlNow(){var p=new URLSearchParams();if(/[?&]test\b/i.test(location.search))p.set('test','');if(S.inst&&S.inst!=='바이올린')p.set('i',S.inst);if(S.lang!=='ko')p.set('lang',S.lang);var q=p.toString().replace(/^test=&?/,'test&').replace(/&$/,'');return location.origin+location.pathname+(q?'?'+q:'')}
  function syncUrl(){try{history.replaceState(null,'',urlNow())}catch(e){}}
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function T(ko,en){return S.lang==='en'?en:ko}
  function one(x,en){var c=en?(x.ec||''):x.comp,   /* 11-27 영어 화면에 한글 작곡가를 쓰지 않음 (영어 작곡가 없으면 비움) */
    t=en?x.en:x.t;return esc(t)+(c?' <span class="c">('+esc(c)+')</span>':'')}
  function draw(){
    var d=S.d;if(!d)return;var ORD=['바이올린','첼로'],keys=Object.keys(d.songs||{}).filter(function(k){return (d.songs[k]||[]).length}).sort(function(a,b){var x=ORD.indexOf(a),y=ORD.indexOf(b);return (x<0?99:x)-(y<0?99:y)});   /* 11-27 사용자: 탭 순서 바이올린 · 첼로 · 처음 고른 탭 = 바이올린 (?i=첼로 면 첼로) */
    if(!S.inst||keys.indexOf(S.inst)<0)S.inst=keys.indexOf('바이올린')>=0?'바이올린':keys[0]||'';
    document.documentElement.lang=S.lang;
    document.getElementById('camp').textContent=d.camp||'스즈키 겨울 음악제';
    
        document.getElementById('inst').innerHTML=keys.map(function(k){return '<button type="button" role="tab" data-i="'+esc(k)+'" aria-pressed="'+(k===S.inst)+'">'+esc(k==='전체'?T('전체','All'):T(k,EN[k]||k))+'</button>'}).join('');
        var q=S.q.trim().toLowerCase(),INS=S.inst==='전체'?keys:[S.inst],tot=0;
    var html=INS.map(function(ik){var L=(d.songs[ik]||[]).filter(function(x){return !q||(x.code+' '+x.t+' '+x.comp+' '+x.en+' '+(x.ec||'')).toLowerCase().indexOf(q)>=0}),B={},order=[];tot+=L.length;
      L.forEach(function(x){var k=x.bk||0;if(!B[k]){B[k]=[];order.push(k)}B[k].push(x)});order.sort(function(a,b){return (a||99)-(b||99)});
      return (INS.length>1?'<h2 class="ihd">'+esc(T(ik,EN[ik]||ik))+'</h2>':'')+order.map(function(k){return '<section class="bk"><h2>'+(k?T(k+'권','Book '+k):T('기타','Other'))+'<small>'+T(B[k].length+'곡',B[k].length+(B[k].length>1?' pieces':' piece'))+'</small></h2>'+B[k].map(function(x){
        var main=S.lang==='en'&&x.en?one(x,true):one(x,false),sub=S.lang==='both'&&x.en?one(x,true):'';
        return '<div class="it"><span class="code">'+esc(x.code||'')+'</span><span class="t">'+main+'</span>'+(sub?'<span class="sub">'+sub+'</span>':'')+'</div>'}).join('')+'</section>'}).join('')}).join('');
        document.getElementById('list').innerHTML=tot?html:'<p class="msg">'+T(keys.length?'이 악기는 아직 곡이 없어요.':'곡 목록을 준비하고 있어요. 조금 뒤에 다시 열어 주세요.','The list is being prepared. Please check back soon.')+'</p>';   /* 11-27 곡목록이 비어 있을 때 */
    [].forEach.call(document.querySelectorAll('#lang button'),function(b){b.setAttribute('aria-pressed',String(b.dataset.l===S.lang))});document.getElementById('ruleKo').hidden=S.lang==='en';document.getElementById('ruleEn').hidden=S.lang!=='en';   /* 11-27 안내 문구도 언어 탭 따라 */
    syncUrl();
    document.getElementById('free').textContent=T('10권 이상 레벨은 자유곡으로 신청할 수 있어요.','Students at level Book 10 and above may apply with a piece of their choice.');
    document.getElementById('foot').textContent=T('한국스즈키음악협회 · 곡 목록은 협회가 바꾸면 여기에도 바로 바뀌어요','Suzuki Music Association of Korea · This list updates automatically.')}
    document.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('button');if(!b)return;if(b.dataset.i){S.inst=b.dataset.i;draw()}if(b.dataset.l){S.lang=b.dataset.l;draw()}
});
  
  fetch(URL0,{redirect:'follow'}).then(function(r){return r.json()}).then(function(d){if(!d||!d.ok)throw new Error((d&&d.msg)||'error');S.d=d;draw()}).catch(function(){document.getElementById('list').innerHTML='<p class="msg">곡 목록을 불러오지 못했어요. 잠시 뒤 새로 고침해 주세요.<br>Could not load the list. Please refresh later.</p>'});
})();
</script>
