<script>

const kday=d=>{if(!d)return '';const [y,m,dd]=String(d).slice(0,10).split('-');return `${+m}월 ${+dd}일`};

/* 접속이 몰리면(BUSY) 자동으로 다시 보냄 · 로그인이 끝났으면 로그인 화면으로 */
function call(fn,args,ok,msg,tries){tries=tries||0;busy(true,msg);google.script.run.withSuccessHandler(r=>{busy(false);ok&&ok(r)}).withFailureHandler(e=>{const m=(e&&e.message)||String(e);
  if(/BUSY|lock|timed out|timeout|network|네트워크|시간 초과/i.test(m)&&tries<4){busy(true,'접속이 많아 다시 보내고 있어요… ('+(tries+1)+'/4)');setTimeout(()=>call(fn,args,ok,msg,tries+1),1500*(tries+1));return}
  busy(false);if(/로그인이 끝났/.test(m)){try{sessionStorage.removeItem('campAdmTok')}catch(x){}S.tok='';S.D=null;render();toast('로그인 시간이 끝났어요. 다시 로그인해 주세요.');return}
  toast('안 됐어요 · '+(/BUSY/.test(m)?'지금 접속이 많아요. 잠시 뒤 다시 해 주세요.':m))})[fn](S.tok,...args)}

  document.body.appendChild(bg);bg.addEventListener('click',e=>{if(e.target===bg||e.target.dataset.x!==undefined)bg.remove();else if(e.target.dataset.ok!==undefined){const v=input?document.getElementById('askIn').value.trim():'';bg.remove();ok(v)}});}

function people(){const L=[];(S.D?S.D.subs:[]).forEach(sb=>sb.ppl.forEach(p=>L.push({sb,p})));return L}
function stats(){const P=people(),live=P.filter(x=>x.p.status==='정상');
  const bill=live.reduce((t,x)=>t+pAmt(x.p),0),paid=P.reduce((t,x)=>t+(+x.p.paidAmt||0),0);
  return {subs:(S.D?S.D.subs:[]).length,n:live.length,bill,paid,left:Math.max(0,bill-paid),rp:live.filter(x=>x.p.pay==='신고').length,
    cx:(S.D?S.D.cx:[]).filter(c=>c.state==='요청'||c.state==='환불 예정').length,cxW:(S.D?S.D.cx:[]).filter(c=>c.state==='요청').length,cxP:(S.D?S.D.cx:[]).filter(c=>c.state==='환불 예정').length,q:(S.D&&S.D.issues||[]).filter(x=>x.state!=='해결').length,acads:[...new Set(live.map(x=>x.sb.acad))].length,unpaid:live.filter(x=>pAmt(x.p)-(+x.p.paidAmt||0)>0).length,over:live.filter(x=>(+x.p.paidAmt||0)>pAmt(x.p)),overAmt:live.reduce((t,x)=>t+Math.max(0,(+x.p.paidAmt||0)-pAmt(x.p)),0)}}
function payPill(p){if(p.status!=='정상')return p.status==='취소요청'?'<span class="pill due">취소 요청</span>':`<span class="pill">취소${p.refund?(p.refund.date?' · 환불 '+kday(p.refund.date):' · 환불 예정 '+won(p.refund.amt)):p.cxAt?' · 입금 전 '+kday(String(p.cxAt).slice(0,10)):''}</span>`;
  const d=pAmt(p)-(+p.paidAmt||0);if(p.pay==='신고')return `<span class="pill new">${+p.paidAmt?'차액 신고 · 확인 전':'신고 · 확인 전'}</span>`;
  return !(+p.paidAmt)?'<span class="pill due">입금 전</span>':d>0?`<span class="pill due">차액 ${won(d)}</span>`:d<0?`<span class="pill new">${won(-d)} 더 냄${p.ovReq?' · 돌려받기 요청':''}</span>`:'<span class="pill ok">입금 확인</span>'}

const sigOf=t=>(S.sv||'acad')+'|'+[...t.querySelectorAll('thead th')].map(x=>x.textContent.replace(/\s*[▲▼]$/,'')).join('/');
const cellVal=td=>{const s=(td?td.textContent:'').trim();if(s===''||s==='-')return 0;return /^-?[\d,.\s]+(원|명|건|%|회)?$/.test(s)?+s.replace(/[^\d.-]/g,'')||0:s};
function sortTbl(t,c,d){const tb=t.tBodies[0];if(!tb)return;const foot=[...tb.rows].filter(r=>r.classList.contains('foot'));const R=[...tb.rows].filter(r=>!r.classList.contains('foot'));
  R.sort((x,y)=>{const a=cellVal(x.cells[c]),b=cellVal(y.cells[c]);const v=typeof a==='number'&&typeof b==='number'?a-b:String(a).localeCompare(String(b),'ko',{numeric:true});return d==='asc'?v:-v});
  R.concat(foot).forEach(r=>tb.appendChild(r));t.querySelectorAll('thead th').forEach((th,i)=>{const s=th.querySelector('.sarr');if(s)s.textContent=i===c?(d==='asc'?' ▲':' ▼'):'';th.setAttribute('aria-sort',i===c?(d==='asc'?'ascending':'descending'):'none')})}

  S.statSort=S.statSort||{};const cur=S.statSort[k];const d=cur&&cur.c===c?(cur.d==='desc'?'asc':'desc'):(c===0?'asc':'desc');S.statSort[k]={c,d};sortTbl(t,c,d)});

function vSubs(){

/* 학원 → 차수 → 접수. 학원·차수는 눌러야 펼쳐짐 (찾기·걸러 보기 중이면 맞는 곳은 펼침) */
function acadGroups(subs,keep,q){const hit=sb=>S.f==='all'||sb.ppl.some(keep);const auto=!!q||S.f!=='all';
  const A={};subs.filter(hit).forEach(sb=>(A[sb.acad]=A[sb.acad]||[]).push(sb));
  const sum=L=>{const live=L.flatMap(sb=>sb.ppl.filter(p=>p.status==='정상'));const bill=live.reduce((t,p)=>t+pAmt(p),0),paid=L.reduce((t,sb)=>t+sb.ppl.reduce((u,p)=>u+(+p.paidAmt||0),0),0),rp=live.filter(p=>p.pay==='신고').length;
    return `<span class="hint">${L.length}건 · ${live.length}명</span><span class="num">청구 ${won(bill)}</span><span class="num">입금 ${won(paid)}</span>${rp?`<span class="pill new">신고 ${rp}</span>`:''}${bill-paid>0?`<span class="pill due">남음 ${won(bill-paid)}</span>`:'<span class="pill ok">완납</span>'}`};
  const keys=Object.keys(A).sort((a,b)=>a.localeCompare(b,'ko'));

      ${oa?Object.keys(R).sort().map(rd=>{const k=ac+'|'+rd,or=S.openR[k]!==undefined?S.openR[k]:auto;
        return `<details class="rnd" data-rnd="${esc(k)}" ${or?'open':''}><summary class="spread"><b>${esc(rd)}</b><div class="row">${sum(R[rd])}</div></summary>${or?R[rd].map(sb=>subBlock(sb,keep,q,subs)).join(''):''}</details>`}).join(''):''}

function subBlock(sb,keep,q,subs){const live=sb.ppl.filter(p=>p.status==='정상'),bill=live.reduce((t,p)=>t+pAmt(p),0),paid=sb.ppl.reduce((t,p)=>t+(+p.paidAmt||0),0);const L=sb.ppl.filter(keep);if(!L.length&&S.f!=='all')return '';

function save(){CHG++;DIRTY=true;clearTimeout(TIMER);TIMER=setTimeout(()=>flush(),1500);stat()}
function flush(after){if(SAVING){setTimeout(()=>flush(after),500);return}if(!DIRTY){after&&after();return}
  SAVING=true;clearTimeout(TIMER);const body=payload();const sent=body.log.length,sentChg=CHG;stat();
  run('schedSave',[body],r=>{SAVING=false;
    if(r&&r.conflict){toast(r.msg||'다른 화면에서 먼저 고쳤어요. 최신 내용으로 다시 불러왔어요.');applyData(r);render();return}
    REV=r.rev;PEND.splice(0,sent);DIRTY=CHG!==sentChg;if(DIRTY){clearTimeout(TIMER);TIMER=setTimeout(()=>flush(),800)}LASTSAVE=new Date().toTimeString().slice(0,5);stat();after&&after()},
    m=>{SAVING=false;stat('저장 못 함 · '+m);toast('교사 일정을 저장하지 못했어요 · '+m)})}
function stat(m){const el=document.getElementById('a_stat');if(!el)return;el.className='pill '+(m?'bad':SAVING||DIRTY?'due':'ok');el.textContent=m||(SAVING?'저장하고 있어요…':DIRTY?'고친 내용 저장 대기':LASTSAVE?'저장됨 '+LASTSAVE:'시트와 같음')}
window.addEventListener('beforeunload',e=>{if(DIRTY||SAVING){e.preventDefault();e.returnValue=''}});
const P=()=>D.people; const pBy=id=>D.people.find(p=>p.id===id);
/* 사람은 고유번호(T001…)로 연결. 화면에는 이름, 같은 이름이 또 있으면 소속을 붙임 */
const NAME=id=>(pBy(id)||{n:id}).n;
const dupOf=id=>{const p=pBy(id);return p&&D.people.some(q=>q.id!==id&&q.n===p.n)};
const TAG=id=>{const p=pBy(id);if(!p||!dupOf(id))return '';return (p.kind==='연수생'?'연수생':(p.acad||'').split(' · ')[0].replace(/스즈키$/,''))||p.inst||p.id};
const LB=id=>NAME(id)+(TAG(id)?' · '+TAG(id):'');
const LBH=id=>esc(NAME(id))+(TAG(id)?` <small class="dtag">${esc(TAG(id))}</small>`:'');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mins=t=>{const [h,m]=t.split(':').map(Number);return h*60+m};
const hhmm=n=>`${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`;
/* 시·분 입력: 시는 고르고 분은 0~59 직접 입력 */
function hmIn(id,v,label){const [h,m]=(v||'09:00').split(':');
  return `<span class="hm" style="display:inline-flex;gap:3px;align-items:center"><select id="${id}_h" aria-label="${label} 시">${Array.from({length:17},(_,i)=>String(i+6).padStart(2,'0')).map(x=>`<option ${x===h?'selected':''}>${x}</option>`).join('')}</select><span>:</span><input type="number" id="${id}_m" value="${m}" min="0" max="59" step="1" inputmode="numeric" aria-label="${label} 분" style="width:58px"></span>`}
function hmVal(id){const h=document.getElementById(id+'_h'),m=document.getElementById(id+'_m');if(!h||!m)return '';const mm=Math.max(0,Math.min(59,parseInt(m.value,10)||0));return `${h.value}:${String(mm).padStart(2,'0')}`}
const TIMES10=[];for(let t=7*60;t<=22*60;t+=10)TIMES10.push(hhmm(t));
const locOf=(d,room)=>((D.rooms[d]||[]).find(r=>r[0]===room)||[])[1]||'';
const evById=id=>D.events.find(e=>e.id===id);
const short=n=>n.length>14?n.split(/[ ,]+/).filter(Boolean).slice(-1)[0]:n;
function logIt(t){A.log.unshift({at:new Date().toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}),t});A.log=A.log.slice(0,300);PEND.push(t);save()}

/* ---------- 계산: 횟수 · 겹침 · 못 오는 날 ---------- */
function stats(){
  const st={};const get=n=>st[n]||(st[n]={n,days:[0,0,0,0],roles:{},total:0,items:[]});
  D.events.forEach(e=>e.ppl.forEach(p=>{const x=get(p.n);x.days[e.d]++;x.roles[p.r]=(x.roles[p.r]||0)+1;x.total++;x.items.push({e,r:p.r})}));
  const clash=new Set(); // `${eid}|${name}`
  Object.values(st).forEach(x=>{for(let i=0;i<x.items.length;i++)for(let j=i+1;j<x.items.length;j++){const a=x.items[i].e,b=x.items[j].e;
    if(a.d===b.d&&mins(a.s)<mins(b.e)&&mins(b.s)<mins(a.e)){clash.add(a.id+'|'+x.n);clash.add(b.id+'|'+x.n);x.clash=(x.clash||0)+1}}});
  const off=new Set(); Object.values(st).forEach(x=>x.items.forEach(({e})=>{if((A.unav[x.n]||[]).includes(e.d)){off.add(e.id+'|'+x.n);x.off=(x.off||0)+1}}));
  return {st,clash,off};
}
let ST={st:{},clash:new Set(),off:new Set()};
function refresh(){ST=stats();save();render()}

/* ---------- 프로그램표 (장소 × 시간) ---------- */
const TCLS={레슨:'t-les',오케스트라:'t-orc',오후음악회:'t-con',음악회:'t-con',리허설:'t-reh',특별수업:'t-spe',교사연수:'t-tt',대기:'t-reh'};
function chip(e,p,i){const k=e.id+'|'+p.n;const bad=ST.clash.has(k)?'겹침':ST.off.has(k)?'못 오는 날':'';
  const sw=A.swap&&A.swap.eid===e.id&&A.swap.i===i;
  return `<button type="button" class="pchip ${bad?'bad':''} ${sw?'swapping':''} r-${p.r}" data-achip="${e.id}|${i}" title="${esc(LB(p.n))} · ${p.r}${bad?' · '+bad:''}"><span class="rl">${p.r}</span>${esc(short(NAME(p.n)))}${TAG(p.n)?`<small class="dtag">${esc(TAG(p.n))}</small>`:''}</button>`}
function cellEv(e){const first=e.desc.slice(0,2).map(esc).join('<br>');
  return `<div class="ev ${TCLS[e.type]||''} ${A.sel===e.id?'on':''}" data-aev="${e.id}"><div class="evh"><b>${esc(e.title)}</b><span class="num tm">${e.s}~${e.e}</span></div>${first?`<small>${first}</small>`:''}<div class="chips2">${e.ppl.map((p,i)=>chip(e,p,i)).join('')}</div></div>`}
function vGrid(){
  const d=A.day, rooms=D.rooms[d]||[], evs=D.events.filter(e=>e.d===d), meals=D.meals.filter(m=>m.d===d);
  const extra=((D.rows||{})[d]||[]);
  const starts=[...new Set([...evs.map(e=>e.s),...meals.map(m=>m.s),...extra])].sort((a,b)=>mins(a)-mins(b));
  const nLes=evs.filter(e=>e.type==='레슨').length, nP=new Set(evs.flatMap(e=>e.ppl.map(p=>p.n))).size;
  const bad=evs.flatMap(e=>e.ppl.filter(p=>ST.clash.has(e.id+'|'+p.n)||ST.off.has(e.id+'|'+p.n)).map(p=>p.n));
  return `<div class="sec-h"><div><h2>프로그램표</h2><p>장소 × 시간. 칸을 누르면 고치고, 빈 칸을 누르면 새 일정을 넣어요. 사람 칩의 「바꾸기」로 두 사람을 맞바꿔요.</p></div>
    <div class="row"><button class="btn small" type="button" id="a_reload">새로 불러오기</button></div></div>
  <div class="row"><div class="seg" role="group" aria-label="날짜">${D.days.map((x,i)=>`<button type="button" data-aday="${i}" aria-pressed="${d===i}">${x}</button>`).join('')}</div>
    <span class="pill info">일정 ${evs.length} · 레슨 ${nLes}</span><span class="pill mute">이날 나오는 사람 ${nP}명</span>${bad.length?`<span class="pill bad">겹침·못 오는 날 ${new Set(bad).size}명</span>`:'<span class="pill ok">겹침 없음</span>'}</div>
  ${A.swap?`<div class="note"><b>바꾸기</b> · ${esc(LB(evById(A.swap.eid).ppl[A.swap.i].n))} 선생님과 바꿀 사람 칩을 아무 날짜에서나 누르세요. <button class="btn small" type="button" id="a_swapX">취소</button></div>`:''}
  ${editor()}
  <div class="row"><span class="cap" style="margin:0">시간 줄 추가</span>${hmIn('a_rowT',A.rowT||'09:00','추가할 시간')}<button class="btn small" type="button" id="a_rowAdd">+ 이 시간 줄 넣기</button><span class="cap" style="margin:0">줄을 넣으면 그 시간에 장소마다 빈 칸(+)이 생겨요</span></div>
  <div class="tt pgrid"><table><thead><tr><th class="tcol">시간</th>${rooms.map(([r,l])=>`<th>${esc(r)}<small>${esc(l)}</small></th>`).join('')}</tr></thead><tbody>
  ${starts.map(t=>{const ml=meals.filter(m=>m.s===t).map(m=>`<tr class="meal"><th class="tcol num">${t}</th><td colspan="${rooms.length}">${esc(m.t)} <span class="cap" style="margin:0">${m.s}~${m.e}</span></td></tr>`).join('');
    if(!evs.some(e=>e.s===t)&&!extra.includes(t)) return ml;
    return ml+`<tr><th class="tcol num">${t}${extra.includes(t)&&!evs.some(e=>e.s===t)?`<br><button type="button" class="btn small ghost" data-arowdel="${t}" aria-label="${t} 줄 빼기" style="padding:0 6px;font-size:11px">줄 빼기</button>`:''}</th>${rooms.map(([r])=>{const xs=evs.filter(e=>e.room===r&&e.s===t);
      const cont=!xs.length&&evs.some(e=>e.room===r&&mins(e.s)<mins(t)&&mins(t)<mins(e.e));
      return `<td class="${cont?'cont':''}">${xs.map(cellEv).join('')}${!xs.length?(cont?'<span class="cap">↑ 이어짐</span>':`<button type="button" class="addev" data-anew="${d}|${esc(r)}|${t}" aria-label="${esc(r)} ${t} 일정 넣기">+</button>`):''}</td>`}).join('')}</tr>`}).join('')}
  </tbody></table></div>`;
}
/* 고치는 칸 */
function personList(e){
  const q=A.pq.trim(); if(!q&&!A.pqOpen) return '';
  const used=new Set(e.ppl.map(p=>p.n));
  const L=P().filter(p=>!used.has(p.id)&&(!q||p.n.includes(q)||(p.acad||'').includes(q)||(p.inst||'').includes(q)))
    .map(p=>{const x=ST.st[p.id]||{total:0,roles:{},days:[0,0,0,0]};const busy=D.events.some(o=>o.id!==e.id&&o.d===e.d&&o.ppl.some(z=>z.n===p.id)&&mins(o.s)<mins(e.e)&&mins(e.s)<mins(o.e));const off=(A.unav[p.id]||[]).includes(e.d);return {p,x,busy,off}})
    .sort((a,b)=>(a.busy||a.off)-(b.busy||b.off)||a.x.total-b.x.total||a.p.n.localeCompare(b.p.n,'ko')).slice(0,40);
  return `<ul class="cands">${L.map(({p,x,busy,off})=>`<li><button type="button" data-aaddp="${p.id}" ${busy||off?'class="warn"':''}><span><b>${LBH(p.id)}</b> <small>${esc(p.inst||'')} · ${esc(p.acad||'')}${p.kind!=='교사'?' · '+p.kind:''}</small></span>
    <span class="row" style="gap:4px;flex-wrap:nowrap">${busy?'<span class="pill bad">이 시간 다른 일정</span>':''}${off?'<span class="pill bad">못 오는 날</span>':''}<span class="pill ${x.total?'mute':'due'}">${x.total?`수업 ${x.roles['수업']||0} · 보조 ${x.roles['보조']||0} · 사회 ${x.roles['사회']||0}`:'아직 0회'}</span></span></button></li>`).join('')||'<li class="cap" style="padding:8px">찾는 사람이 없어요.</li>'}</ul>`}
function editor(){
  const e=A.sel&&evById(A.sel); if(!e) return '';
  const rooms=D.rooms[e.d]||[];
  const tsel=(id,v)=>hmIn(id,v,id==='a_edS'?'시작':'끝');
  return `<div class="picker edit"><div class="sec-h"><div><b>${D.days[e.d]} ${e.s}~${e.e} · ${esc(e.room)}</b> <span class="cap" style="margin:0">${esc(locOf(e.d,e.room))}</span></div>
      <div class="row"><button class="btn small" type="button" id="a_edDel">이 일정 지우기</button><button class="btn small" type="button" id="a_edClose">닫기</button></div></div>
    <div class="g3"><label class="f" for="a_edT">이름 (반·행사)<input type="text" id="a_edT" value="${esc(e.title)}"></label>
      <label class="f" for="a_edY">종류<select id="a_edY">${TYPES.map(t=>`<option ${t===e.type?'selected':''}>${t}</option>`).join('')}</select></label>
      <div class="f"><span>시간 <span class="cap" style="margin:0">시 · 분</span></span><div class="row" style="flex-wrap:nowrap">${tsel('a_edS',e.s)}<span>~</span>${tsel('a_edE',e.e)}</div></div></div>
    <div class="g2"><label class="f" for="a_edR">장소<select id="a_edR">${rooms.map(([r,l])=>`<option value="${esc(r)}" ${r===e.room?'selected':''}>${esc(r)} · ${esc(l)}</option>`).join('')}</select></label>
      <label class="f" for="a_edD">설명 (한 줄에 하나 · 진도 범위 한/영 등)<textarea id="a_edD" rows="2">${esc(e.desc.join('\n'))}</textarea></label></div>
    <div class="f" style="display:grid;gap:6px"><span>사람</span>
      ${e.ppl.map((p,i)=>{const x=ST.st[p.n]||{roles:{}};const k=e.id+'|'+p.n;return `<div class="prow ${ST.clash.has(k)||ST.off.has(k)?'bad':''}"><select data-aprole="${i}" aria-label="역할">${ROLES.map(r=>`<option ${r===p.r?'selected':''}>${r}</option>`).join('')}</select>
        <b>${LBH(p.n)}</b><span class="cap" style="margin:0">${esc((pBy(p.n)||{}).acad||'')} · 수업 ${x.roles['수업']||0} · 보조 ${x.roles['보조']||0} · 사회 ${x.roles['사회']||0}</span>
        ${ST.clash.has(k)?'<span class="pill bad">같은 시간 다른 일정</span>':''}${ST.off.has(k)?'<span class="pill bad">못 오는 날</span>':''}
        <span class="row" style="gap:4px;margin-left:auto"><button class="btn small" type="button" data-aswap="${e.id}|${i}">바꾸기</button><button class="btn small ghost" type="button" data-aprm="${i}">빼기</button></span></div>`}).join('')||'<p class="cap" style="margin:0">아직 사람이 없어요.</p>'}
      <input type="search" id="a_pq" value="${esc(A.pq)}" placeholder="사람 넣기: 이름·학원·악기로 찾기 (적게 나온 사람이 위에)" autocomplete="off">
      ${personList(e)}</div>
    <div class="row"><button class="btn small" type="button" id="a_cpOther">다른 날 같은 시간·장소에 복사 (사람 빼고)</button><button class="btn small primary" type="button" id="a_edSave">고친 내용 저장</button></div></div>`}

/* ---------- 교사별 횟수 ---------- */
function vCount(){
  const t=A.target, q=A.q.trim();
  const rows=P().map(p=>({p,x:ST.st[p.id]||{days:[0,0,0,0],roles:{},total:0}}))
    .filter(({p})=>A.trainee||p.kind!=='연수생').filter(({p})=>!q||p.n.includes(q)||(p.acad||'').includes(q));
  const main=x=>(x.roles['수업']||0)+(x.roles['보조']||0)+(x.roles['사회']||0);
  const flag=({p,x})=>x.clash?'clash':x.off?'off':main(x)===0?'zero':main(x)<t.min?'low':main(x)>t.max?'high':'';
  const F={all:()=>true,zero:r=>main(r.x)===0,low:r=>main(r.x)>0&&main(r.x)<t.min,high:r=>main(r.x)>t.max,clash:r=>r.x.clash,off:r=>r.x.off,noles:r=>!(r.x.roles['수업'])};
  const n=k=>rows.filter(F[k]).length;
  const L=rows.filter(F[A.filter]||F.all).sort((a,b)=>main(a.x)-main(b.x)||a.p.n.localeCompare(b.p.n,'ko'));
  return `<div class="sec-h"><div><h2>교사별 횟수</h2><p>수업·보조·사회 횟수를 자동으로 세요. 손으로 세던 메모를 대신해요. 못 오는 날을 체크하면 그날 들어간 칸이 빨갛게 보여요.</p></div></div>
  <div class="row"><span class="cap" style="margin:0">목표 (수업+보조+사회)</span><input type="number" id="a_tMin" value="${t.min}" min="0" style="width:60px" aria-label="최소">회 ~ <input type="number" id="a_tMax" value="${t.max}" min="0" style="width:60px" aria-label="최대">회
    <label class="checks"><label><input type="checkbox" id="a_trainee" ${A.trainee?'checked':''}>연수생도 보기</label></label>
    <input type="search" id="a_q" value="${esc(A.q)}" placeholder="이름·학원으로 찾기" style="width:min(220px,100%)"></div>
  <div class="row">${[['zero','0회'],['noles','수업 0회'],['low','목표보다 적음'],['high','목표보다 많음'],['clash','겹침'],['off','못 오는 날 걸림'],['all','전체']].map(([k,l])=>`<button class="btn small ${A.filter===k?'primary':''}" type="button" data-afilter="${k}">${l} ${n(k)}</button>`).join('')}</div>
  <div class="tbl panel" style="padding:0"><table><thead><tr><th>이름</th><th>학원</th><th>악기</th>${D.days.map(x=>`<th class="r">${x.slice(0,4)}</th>`).join('')}<th class="r">수업</th><th class="r">보조</th><th class="r">사회</th><th class="r">그 외</th><th>상태</th><th>못 오는 날</th><th>요청·메모</th><th></th></tr></thead><tbody>
  ${L.map(r=>{const {p,x}=r,f=flag(r),other=x.total-main(x);return `<tr><td><b>${LBH(p.id)}</b> <span class="cap" style="margin:0">${p.id}</span>${p.kind!=='교사'?` <span class="pill mute">${p.kind}</span>`:''}</td><td>${esc(p.acad||'')}</td><td>${esc(p.inst||'')}</td>
    ${x.days.map(v=>`<td class="r num">${v||'-'}</td>`).join('')}<td class="r num">${x.roles['수업']||'-'}</td><td class="r num">${x.roles['보조']||'-'}</td><td class="r num">${x.roles['사회']||'-'}</td><td class="r num">${other||'-'}</td>
    <td>${f==='clash'?`<span class="pill bad">겹침 ${x.clash}</span>`:f==='off'?'<span class="pill bad">못 오는 날 배정</span>':f==='zero'?'<span class="pill due">0회</span>':f==='low'?'<span class="pill due">적음</span>':f==='high'?'<span class="pill info">많음</span>':'<span class="pill ok">맞음</span>'}</td>
    <td><span class="row" style="gap:6px;flex-wrap:nowrap">${D.days.map((dl,i)=>`<label class="dck" title="${dl} 못 옴"><input type="checkbox" data-aunav="${p.id}|${i}" ${(A.unav[p.id]||[]).includes(i)?'checked':''}>${dl.slice(2,4).replace('(','')}</label>`).join('')}</span></td>
    <td><input type="text" data-areq="${p.id}" value="${esc(A.req[p.id]||'')}" placeholder="예: 2권 교사 바꿔 주세요" style="width:170px" aria-label="${esc(p.n)} 요청"></td>
    <td><span class="row" style="gap:4px;flex-wrap:nowrap"><button class="btn small" type="button" data-awho="${p.id}">일정</button>${x.total?`<button class="btn small ghost" type="button" data-apull="${p.id}">모든 칸에서 빼기</button>`:''}</span></td></tr>`}).join('')||'<tr><td colspan="16" class="cap">해당하는 사람이 없어요.</td></tr>'}
  </tbody></table></div>`}

/* ---------- 교사별 일정 ---------- */
function vWho(){
  const ids=P().map(p=>p.id); const me=A.who||((Object.values(ST.st).sort((a,b)=>b.total-a.total)[0]||{}).n)||ids[0];

  if(b.id==='bulkClr'){S.sel={};render();return}
  if(b.id==='bulkOk'){const dt=val('bulkD');if(!dt){toast('입금일을 먼저 선택해 주세요');document.getElementById('bulkD').focus();return}
    const items=Object.keys(S.sel).filter(k=>S.sel[k]).map(pid=>{const x=people().find(y=>y.p.id===pid);const a=num('a_'+pid)||(x?Math.max(0,pAmt(x.p)-(+x.p.paidAmt||0)):0);return {pid,date:dt,amt:a,memo:val('m_'+pid)}}).filter(it=>it.amt>0);
    if(!items.length){toast('확인할 금액이 없어요');return}
    call('adminConfirm',[items],r=>{S.sel={};setData(r);toast(items.length+'명 입금 확인 · '+kday(dt))});return}
});
function rpPicked(){return [...document.querySelectorAll('[data-rpsel]')].filter(x=>x.checked).map(x=>x.dataset.rpsel)}
function rpCount(){const n=rpPicked().length,all=document.querySelectorAll('[data-rpsel]');const c=document.getElementById('rpCnt');if(c)c.textContent=n+'명 선택';const a=document.getElementById('rpAll');if(a)a.checked=all.length>0&&n===all.length}
document.addEventListener('change',e=>{const el=e.target;
  if(el.id==='rpAll'){document.querySelectorAll('[data-rpsel]').forEach(x=>{x.checked=el.checked;S.rpSel[x.dataset.rpsel]=el.checked});rpCount();return}
  if(el.dataset&&el.dataset.rpsel){S.rpSel[el.dataset.rpsel]=el.checked;rpCount();return}
  if(el.dataset.sel){S.sel[el.dataset.sel]=el.checked;S.bulkD=val('bulkD')||S.bulkD;render();return}
  if(el.id==='bulkD'){S.bulkD=el.value}});
document.addEventListener('toggle',e=>{const d=e.target.dataset||{};if(d.sub)S.open[d.sub]=e.target.open;
  if(d.acad!==undefined&&S.openA[d.acad]!==e.target.open){S.openA[d.acad]=e.target.open;render()}
  if(d.rnd!==undefined&&S.openR[d.rnd]!==e.target.open){S.openR[d.rnd]=e.target.open;render()}},true);
document.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;const p=e.target.selectionStart;render();const n=document.getElementById('q');n.focus();n.setSelectionRange(p,p)}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.target.id==='lpw'||e.target.id==='lid'))document.getElementById('doLogin').click()});
(function(){let t='';try{t=sessionStorage.getItem('campAdmTok')||''}catch(x){}
  if(t){S.tok=t;let id='';try{id=sessionStorage.getItem('campAdmId')||''}catch(x){}document.getElementById('who').textContent=id?'관리자 '+id:'';call('adminData',[],setData,'불러오고 있어요…')}
  else{/* 테스트(STG): 설정에 「관리자 자동 로그인 = 예」면 바로 들어감 */google.script.run.withSuccessHandler(r=>{if(!r||!r.ok)return;S.tok=r.token;try{sessionStorage.setItem('campAdmTok',r.token);sessionStorage.setItem('campAdmId',r.id)}catch(x){}document.getElementById('who').textContent='관리자 '+r.id+' (테스트 자동 로그인)';setData(r)}).withFailureHandler(()=>{}).adminAuto()}})();
render();
</script>
</body></html>
