function call(fn,args,ok,msg,tries){tries=tries||0;busy(true,msg);google.script.run.withSuccessHandler(r=>{busy(false);ok&&ok(r)}).withFailureHandler(e=>{const m=(e&&e.message)||String(e);

  bg.innerHTML=`<div class="askbox" role="dialog" aria-modal="true"><b style="font-size:16px">${title}</b><div>${body}</div>${input?`<input type="text" id="askIn" placeholder="${esc(input)}">`:''}<div class="row" style="justify-content:flex-end"><button class="btn ghost" type="button" data-x>취소</button><button class="btn primary" type="button" data-ok>${okLabel||'확인'}</button></div></div>`;
  document.body.appendChild(bg);bg.addEventListener('click',e=>{if(e.target===bg||e.target.dataset.x!==undefined)bg.remove();else if(e.target.dataset.ok!==undefined){const v=input?document.getElementById('askIn').value.trim():'';bg.remove();ok(v)}});}

function people(){const L=[];(S.D?S.D.subs:[]).forEach(sb=>sb.ppl.forEach(p=>L.push({sb,p})));return L}
function stats(){const P=people(),live=P.filter(x=>x.p.status==='정상');
  const bill=live.reduce((t,x)=>t+pAmt(x.p),0),paid=P.reduce((t,x)=>t+(+x.p.paidAmt||0),0);
  return {subs:(S.D?S.D.subs:[]).length,n:live.length,bill,paid,left:Math.max(0,bill-paid),rp:live.filter(x=>x.p.pay==='신고').length,
    cx:(S.D?S.D.cx:[]).filter(c=>c.state==='요청'||c.state==='환불 예정').length,cxW:(S.D?S.D.cx:[]).filter(c=>c.state==='요청').length,cxP:(S.D?S.D.cx:[]).filter(c=>c.state==='환불 예정').length,q:(S.D&&S.D.issues||[]).filter(x=>x.state!=='해결').length,acads:[...new Set(live.map(x=>x.sb.acad))].length,unpaid:live.filter(x=>pAmt(x.p)-(+x.p.paidAmt||0)>0).length,over:live.filter(x=>(+x.p.paidAmt||0)>pAmt(x.p)),overAmt:live.reduce((t,x)=>t+Math.max(0,(+x.p.paidAmt||0)-pAmt(x.p)),0)}}
function payPill(p){if(p.status!=='정상')return p.status==='취소요청'?'<span class="pill due">취소 요청</span>':`<span class="pill">취소${p.refund?(p.refund.date?' · 환불 '+kday(p.refund.date):' · 환불 예정 '+won(p.refund.amt)):p.cxAt?' · 입금 전 '+kday(String(p.cxAt).slice(0,10)):''}</span>`;

/* 통계 표 정렬: 같은 보기·같은 표면 다시 그려도 유지 */
const sigOf=t=>(S.sv||'acad')+'|'+[...t.querySelectorAll('thead th')].map(x=>x.textContent.replace(/\s*[▲▼]$/,'')).join('/');

function vSubs(){

    const rows=[];books.forEach(b=>{const G=all.filter(g=>bookOf(g)===b);if(G.length>1||G[0]!==b){G.forEach(g=>{const n=Sx.filter(x=>x.prog===g).length;rows.push(['&nbsp;&nbsp;'+esc(g),n||'<span class="faint">0</span>'])});rows.push([`<b>${esc(b)} 총계</b>`,`<b>${bc(b)}</b>`])}
      else{const n=bc(b);rows.push([esc(b),n||'<span class="faint">0</span>'])}});
    if(none)rows.push(['<span class="faint">진도 미입력</span>',none]);
    const progTbl=ST(['현재 진도','인원'],rows,['총계',T]);
    return `<div class="panel"><div class="spread"><b>${esc(i)} 학생 ${T}명</b> <span class="hint">학생 + 악기하는 교사자녀</span><span class="hint">권수는 현재 진도에서 셈 (1권A·1권B → 1권)</span></div><div class="stgrid"><div><b class="hint">권수별</b>${bookTbl}</div><div><b class="hint">진도별</b>${progTbl}</div></div></div>`}).join('');
  return top+per}
/* 2026 여름 「학원별인원통계」「명찰통계」와 같은 표 */
const TYPE_ORDER=['교사','연수생','소속없는 중급연수생','학생','회원의 악기하는 자녀','회원의 첫번째 보호자','회원의 그외 악기 안하는 동반가족','동반가족 중 돌전아기'];

    +ST(['교수','신청자','이름'],[...new Set(M.flatMap(x=>x.mc))].map(m=>{const Q=M.filter(x=>x.mc.includes(m));return [esc(m),Q.length,Q.map(x=>esc(x.p.name)+' <small class="faint">'+esc(x.acad)+'</small>').join(', ')]}))}
function stCon(L){const C=L.filter(x=>x.concert);return ['오후','트와일라잇','이브닝'].map(c=>{const Q=C.filter(x=>x.concert===c);return `<div class="panel tbl"><b>${c} 음악회 ${Q.length}명</b>${Q.length?`<table style="margin-top:6px"><thead><tr><th>이름</th><th>학원</th><th>악기</th><th>곡</th></tr></thead><tbody>${Q.map(x=>`<tr><td>${esc(x.p.name)}</td><td>${esc(x.acad)}</td><td>${esc(x.inst)}</td><td>${esc(x.song)}</td></tr>`).join('')}</tbody></table>`:''}</div>`}).join('')}
function stRoom(L){const R=L.filter(x=>x.room);return ST(['학원','가족방 수','대표'],[...new Set(R.map(x=>x.acad))].map(a=>{const Q=R.filter(x=>x.acad===a);return [esc(a),Q.length,Q.map(x=>esc(x.p.name)).join(', ')]}),['합계',R.length,''])}
