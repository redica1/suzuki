<script>
const S={tok:'',tab:'home',q:'',open:{},sel:{},D:null,f:'all',rpSel:{},openA:{},openR:{}};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const won=n=>(+n||0).toLocaleString('ko-KR')+'원';
const kday=d=>{if(!d)return '';const [y,m,dd]=String(d).slice(0,10).split('-');return `${+m}월 ${+dd}일`};
const pAmt=p=>(+p.fee||0)+(+p.lesson||0)+(+p.dues||0)+(+p.room||0);
const btCls=n=>'bt'+(((n||1)-1)%6+1);
const repRow=p=>p.rep&&(p.rep.rows&&p.rep.rows[p.id]||(p.rep.ids?{name:p.rep.name,date:p.rep.date,a:p.rep.amt}:null));
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2800)}
function busy(on,m){const b=document.getElementById('busy');b.textContent=m||'저장하고 있어요…';b.hidden=!on}
/* 접속이 몰리면(BUSY) 자동으로 다시 보냄 · 로그인이 끝났으면 로그인 화면으로 */
function call(fn,args,ok,msg,tries){if(roBlock(fn)){toast(RO_MSG);return}tries=tries||0;busy(true,msg);google.script.run.withSuccessHandler(r=>{busy(false);ok&&ok(r)}).withFailureHandler(e=>{const m=(e&&e.message)||String(e);
  if(/BUSY|lock|timed out|timeout|network|네트워크|시간 초과/i.test(m)&&tries<4){busy(true,'접속이 많아 다시 보내고 있어요… ('+(tries+1)+'/4)');setTimeout(()=>call(fn,args,ok,msg,tries+1),1500*(tries+1));return}
  busy(false);if(/로그인이 끝났/.test(m)){try{sessionStorage.removeItem('campAdmTok')}catch(x){}S.tok='';S.D=null;render();toast('로그인 시간이 끝났어요. 다시 로그인해 주세요.');return}
  toast('안 됐어요 · '+(/BUSY/.test(m)?'지금 접속이 많아요. 잠시 뒤 다시 해 주세요.':m))})[fn](S.tok,...args)}
function goTab(t){if(!t)return;if(t==='staff'&&S.tab!=='staff'){S.SF=null;S.sf=null}if((t==='camp'||t==='cons')&&S.tab!==t&&!ccDirty())S.cc=null;if(t==='cons'){S.consR=null;S.consL=0}if(t==='schol'&&S.tab!=='schol'&&!scDirty()){S.SC=null;S.sc=null}if(S.tab==='act'&&t!=='act')ACT.flush();if(S.tab==='con'&&t!=='con')CORD.flush();if((t==='bplan'||t==='bset')&&S.tab!=='bplan'&&S.tab!=='bset')BUD.enter();S.tab=t;render()}
/* 한글 입력: 글자를 조합하는 동안에는 다시 그리지 않음 (다시 그리면 「ㅎㅏㄴ」처럼 깨짐) → 조합이 끝나면 한 번 */
document.addEventListener('input',e=>{if(e.isComposing&&e.target.matches&&e.target.matches('input[type=search],input[type=text]'))e.stopImmediatePropagation()},true);

function whoTxt(){const m=S.D&&S.D.me,w=document.getElementById('who');if(!m||!w)return;w.textContent=m.sup?(/자동/.test(m.name)?'관리자 '+m.name.replace('(자동)','')+' (테스트 자동 로그인)':'총관리자 '+m.name):'담당자 '+m.name+' 선생님'}
function hdrH(){const h=document.getElementById('hdr');if(h)document.documentElement.style.setProperty('--hdrH',h.offsetHeight+'px')}
window.addEventListener('resize',hdrH);
function setData(d){if(Array.isArray(d.scholar)&&typeof SCHOLAR!=='undefined'){SCHOLAR.length=0;d.scholar.forEach(t=>SCHOLAR.push(t))}if(S.D){if(!d.me&&S.D.me)d.me=S.D.me;if(!d.camp&&S.D.camp)d.camp=S.D.camp}S.D=d;applyCampAdm(d.camp);whoTxt();document.getElementById('sync').textContent='불러온 시각 '+new Date().toTimeString().slice(0,5);render()}
function ask(title,body,ok,okLabel,input){const bg=document.createElement('div');bg.className='askbg';
  bg.innerHTML=`<div class="askbox" role="dialog" aria-modal="true"><b style="font-size:18px">${title}</b><div>${body}</div>${input?`<input type="text" id="askIn" placeholder="${esc(input)}">`:''}<div class="row" style="justify-content:flex-end"><button class="btn ghost" type="button" data-x>취소</button><button class="btn primary" type="button" data-ok>${okLabel||'확인'}</button></div></div>`;
  document.body.appendChild(bg);bg.addEventListener('click',e=>{if(e.target===bg||e.target.dataset.x!==undefined)bg.remove();else if(e.target.dataset.ok!==undefined){const v=input?document.getElementById('askIn').value.trim():'';bg.remove();ok(v)}});}

/* ---------- 계산 ---------- */
function people(){const L=[];(S.D?S.D.subs:[]).forEach(sb=>sb.ppl.forEach(p=>L.push({sb,p})));return L}
function stats(){const P=people(),live=P.filter(x=>x.p.status==='정상');
  const bill=live.reduce((t,x)=>t+pAmt(x.p),0),paid=P.reduce((t,x)=>t+(+x.p.paidAmt||0),0);
  return {subs:(S.D?S.D.subs:[]).length,n:live.length,bill,paid,left:Math.max(0,bill-paid),rp:live.filter(x=>x.p.pay==='신고').length,
    cx:(S.D?S.D.cx:[]).filter(c=>c.state==='요청'||c.state==='환불 예정').length,cxW:(S.D?S.D.cx:[]).filter(c=>c.state==='요청').length,cxP:(S.D?S.D.cx:[]).filter(c=>c.state==='환불 예정').length,q:(S.D&&S.D.issues||[]).filter(x=>x.state!=='해결').length,acads:[...new Set(live.map(x=>x.sb.acad))].length,unpaid:live.filter(x=>pAmt(x.p)-(+x.p.paidAmt||0)>0).length,over:live.filter(x=>(+x.p.paidAmt||0)>pAmt(x.p)),overAmt:live.reduce((t,x)=>t+Math.max(0,(+x.p.paidAmt||0)-pAmt(x.p)),0)}}
function payPill(p){if(p.status!=='정상')return p.status==='취소요청'?'<span class="pill due">취소 요청</span>':`<span class="pill">취소${p.refund?(p.refund.date?' · 환불 '+kday(p.refund.date):' · 환불 예정 '+won(p.refund.amt)):p.cxAt?' · 입금 전 '+kday(String(p.cxAt).slice(0,10)):''}</span>`;
  const d=pAmt(p)-(+p.paidAmt||0);if(p.pay==='신고')return `<span class="pill new">${+p.paidAmt?'차액 신고 · 확인 전':'신고 · 확인 전'}</span>`;
  return !(+p.paidAmt)?'<span class="pill due">입금 전</span>':d>0?`<span class="pill due">차액 ${won(d)}</span>`:d<0?`<span class="pill new">${won(-d)} 더 냄${p.ovReq?' · 돌려받기 요청':''}</span>`:'<span class="pill ok">입금 확인</span>'}

/* ---------- 화면 ---------- */
/* GNB: 1단(묶음) › 2단(메뉴). 권한은 2단 메뉴마다 · 아래 메뉴가 다 「없음」이면 묶음도 숨김 */
const GROUPS=[['dash','대시보드',['home']],['ops','운영관리',['subs','rp','cx','schol','q']],['sch','스케줄관리',['act','tt','ens','con']],['room','방배정',['room']],['stat','통계',['stat']],['fin','예산 · 결산',['bplan','bset']],['cfg','설정',['camp','mem','cons','prof','staff']]];

const ACT=(()=>{

function tgNorm(L){const M={};(L||[]).forEach(t=>{const o=tkP(t);if(!o)return;const c=M[o.bk]||(M[o.bk]={bk:o.bk,A:false,B:false,all:false,up:false});if(!o.pt)c.all=true;if(o.pt.includes('A'))c.A=true;if(o.pt.includes('B'))c.B=true;if(o.up)c.up=true});
  return TG_BK.filter(b=>M[b]).map(b=>{const c=M[b];const pt=c.all||(c.A&&c.B)?'':c.A?'A':c.B?'B':'';return tkS({bk:b,pt,up:c.up})})}
const tkLab=o=>(o.bk==='Pre'?'Pre':o.bk)+(o.pt||'')+(o.up?' 이상':'');

function tgRange(inst,L){const T=tgNorm(L).map(tkP);const out=[];let run=[];

function normAct(r){

  D.tgSongs=r.tgSongs&&typeof r.tgSongs==='object'?r.tgSongs:JSON.parse(JSON.stringify(DEF_TGSONGS));['Vn','Vc','Fl'].forEach(k=>{if(!Array.isArray(D.tgSongs[k]))D.tgSongs[k]=[]});
  D.en=r.en&&typeof r.en==='object'?r.en:{};D.bookDesc=r.bookDesc&&typeof r.bookDesc==='object'?r.bookDesc:{};['Vn','Vc','Fl'].forEach(k=>{if(!D.bookDesc[k])D.bookDesc[k]={}});D.dayNotes=Array.isArray(r.dayNotes)?r.dayNotes:[];D.roleShort=r.roleShort&&typeof r.roleShort==='object'?r.roleShort:{};
  D.kinds=K;D.stages=Array.isArray(r.stages)&&r.stages.length?r.stages:DEF_STAGES.slice();
  D.roleSets=r.roleSets&&typeof r.roleSets==='object'?r.roleSets:JSON.parse(JSON.stringify(DEF_ROLESETS));CATS.forEach(c=>{if(!Array.isArray(D.roleSets[c]))D.roleSets[c]=DEF_ROLESETS[c].slice()});
  D.events.forEach(e=>{const old=e.type;e.cat=catOf(old);e.type=e.cat;if(e.cat==='공연'&&!e.stage)e.stage=old==='리허설'?'리허설':'본공연';if(e.cat!=='공연')e.stage=''})}
const TCLS_C={공연:'t-con',레슨:'t-les',업무:'t-reh'};
const evLabel=e=>`${esc(e.title)}${e.cat==='공연'&&e.stage&&e.stage!=='본공연'?` <span class="stg">${esc(e.stage)}</span>`:''}${e.sub?` <small>${esc(e.sub)}</small>`:''}`;
const cnt3=x=>`레슨 ${(x.cats||{})['레슨']||0} · 공연 ${(x.cats||{})['공연']||0} · 업무 ${(x.cats||{})['업무']||0}`;

let D=null,CHG=0,REV=0,DIRTY=false,SAVING=false,TIMER=null,LOADING=false,PEND=[],LASTSAVE='',ERR='';

function applyData(r){D={days:r.days||[],rooms:r.rooms||{},meals:r.meals||[],rows:r.rows||{},events:r.events||[],people:r.people||[],lessons:r.lessons||[]};normAct(r);
  A.unav=r.unav||{};A.req=r.req||{};A.target=r.target||{min:2,max:6};A.log=r.log||[];REV=r.rev||0;DIRTY=false;PEND=[];
  if(A.day>=D.days.length)A.day=0;ST=stats()}
function payload(){return {rev:REV,kinds:D.kinds,stages:D.stages,roleSets:D.roleSets,tgSongs:D.tgSongs,en:D.en,bookDesc:D.bookDesc,dayNotes:D.dayNotes,roleShort:D.roleShort,days:D.days,rooms:D.rooms,meals:D.meals,rows:D.rows||{},events:D.events,people:D.people,unav:A.unav,req:A.req,target:A.target,log:PEND.slice()}}
function save(){CHG++;DIRTY=true;clearTimeout(TIMER);TIMER=setTimeout(()=>flush(),1500);stat()}
function flush(after){if(SAVING){setTimeout(()=>flush(after),500);return}if(!DIRTY){after&&after();return}
  SAVING=true;clearTimeout(TIMER);const body=payload();const sent=body.log.length,sentChg=CHG;stat();

    REV=r.rev;PEND.splice(0,sent);DIRTY=CHG!==sentChg;if(DIRTY){clearTimeout(TIMER);TIMER=setTimeout(()=>flush(),800)}LASTSAVE=new Date().toTimeString().slice(0,5);stat();after&&after()},
    m=>{SAVING=false;stat('저장 못 함 · '+m);toast('교사 일정을 저장하지 못했어요 · '+m)})}
function stat(m){const el=document.getElementById('a_stat');if(!el)return;el.className='pill '+(m?'bad':SAVING||DIRTY?'due':'ok');el.textContent=m||(SAVING?'저장하고 있어요…':DIRTY?'고친 내용 저장 대기':LASTSAVE?'저장됨 '+LASTSAVE:'시트와 같음')}

const P=()=>D.people; const pBy=id=>D.people.find(p=>p.id===id);
/* 사람은 고유번호(T001…)로 연결. 화면에는 이름, 같은 이름이 또 있으면 소속을 붙임 */

const dupOf=id=>{const p=pBy(id);return p&&D.people.some(q=>q.id!==id&&q.n===p.n)};
const TAG=id=>{const p=pBy(id);if(!p||!dupOf(id))return '';return (p.kind==='연수생'?'연수생':(p.acad||'').split(' · ')[0].replace(/스즈키$/,''))||p.inst||p.id};
const LB=id=>NAME(id)+(TAG(id)?' · '+TAG(id):'');

const mins=t=>{const [h,m]=t.split(':').map(Number);return h*60+m};

function hmVal(id){const h=document.getElementById(id+'_h'),m=document.getElementById(id+'_m');if(!h||!m)return '';const mm=Math.max(0,Math.min(59,parseInt(m.value,10)||0));return `${h.value}:${String(mm).padStart(2,'0')}`}
const TIMES10=[];for(let t=7*60;t<=22*60;t+=10)TIMES10.push(hhmm(t));

function logIt(t){A.log.unshift({at:new Date().toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}),t});A.log=A.log.slice(0,300);PEND.push(t);save()}

/* ---------- 계산: 횟수 · 겹침 · 못 오는 날 ---------- */
function stats(){
  const st={};const get=n=>st[n]||(st[n]={n,days:D.days.map(()=>0),roles:{},cats:{},total:0,items:[]});
  D.events.forEach(e=>e.ppl.forEach(p=>{if(gone(p.n))return;const x=get(p.n);x.days[e.d]=(x.days[e.d]||0)+1;x.roles[p.r]=(x.roles[p.r]||0)+1;x.cats[e.cat]=(x.cats[e.cat]||0)+1;x.total++;x.items.push({e,r:p.r})}));
  const clash=new Set(); // `${eid}|${name}`
  Object.values(st).forEach(x=>{for(let i=0;i<x.items.length;i++)for(let j=i+1;j<x.items.length;j++){const a=x.items[i].e,b=x.items[j].e;
    if(a.d===b.d&&mins(a.s)<mins(b.e)&&mins(b.s)<mins(a.e)){clash.add(a.id+'|'+x.n);clash.add(b.id+'|'+x.n);x.clash=(x.clash||0)+1}}});
  const off=new Set(); Object.values(st).forEach(x=>x.items.forEach(({e})=>{if((A.unav[x.n]||[]).includes(e.d)){off.add(e.id+'|'+x.n);x.off=(x.off||0)+1}}));
  return {st,clash,off};
}

const TCLS={레슨:'t-les',오케스트라:'t-orc',오후음악회:'t-con',음악회:'t-con',리허설:'t-reh',특별수업:'t-spe',교사연수:'t-tt',대기:'t-reh'};
/* 접수 취소(환불 접수 · 입금 전 바로 취소)된 교사 · 명단에서 빠진 사람: 칸에는 흐리게 남고 횟수·겹침·통계에서 빠짐 */
const gone=id=>{const p=pBy(id);return !p||!!p.cx||!!p.out};
const goneTxt=id=>{const p=pBy(id);return p&&p.cx?'취소':'명단 밖'};
function chip(e,p,i){const k=e.id+'|'+p.n;if(gone(p.n))return `<button type="button" class="pchip gone" data-achip="${e.id}|${i}" title="${esc(LB(p.n))} · ${goneTxt(p.n)} — 이 칸에서 빼고 다른 분을 넣어 주세요"><span class="rl">${p.r}</span>${esc(short(NAME(p.n)))} (${goneTxt(p.n)})</button>`;const bad=ST.clash.has(k)?'겹침':ST.off.has(k)?'못 오는 날':'';
  const sw=A.swap&&A.swap.eid===e.id&&A.swap.i===i;
  return `<button type="button" class="pchip ${bad?'bad':''} ${sw?'swapping':''} r-${p.r}" data-achip="${e.id}|${i}" title="${esc(LB(p.n))} · ${p.r}${bad?' · '+bad:''}"><span class="rl">${p.r}</span>${esc(short(NAME(p.n)))}${TAG(p.n)?`<small class="dtag">${esc(TAG(p.n))}</small>`:''}</button>`}
/* 표 칸: 역할 하나에 이름을 쉼표로 (예: 연주 황선영, 곽은수, 오영근) · 이름을 누르면 바꾸기 */
function chipsByRole(e){if(!e.ppl.length)return '';const G=[];e.ppl.forEach((p,i)=>{let g=G.find(x=>x.r===p.r);if(!g)G.push(g={r:p.r,L:[]});g.L.push({p,i})});
  return `<div class="rgls">${G.map(g=>`<div class="rgl"><span class="rl r-${esc(g.r)}">${esc(g.r)}</span> ${g.L.map(({p,i})=>{const k=e.id+'|'+p.n,go=gone(p.n),bad=ST.clash.has(k)?'겹침':ST.off.has(k)?'못 오는 날':'',sw=A.swap&&A.swap.eid===e.id&&A.swap.i===i;
    return `<button type="button" class="pnm ${go?'gone':''} ${bad?'bad':''} ${sw?'swapping':''}" data-achip="${e.id}|${i}" title="${esc(LB(p.n))} · ${esc(p.r)}${go?' · '+goneTxt(p.n):''}${bad?' · '+bad:''}${TAG(p.n)?' · '+esc(TAG(p.n)):''}">${esc(short(NAME(p.n)))}${go?`(${goneTxt(p.n)})`:''}</button>`}).join('<span class="cm">, </span>')}</div>`).join('')}</div>`}
function cellEv(e){const tt=tgTxt(e.tg);const first=[...(tt?[`<span class="tgline">${esc(tt)}</span>`]:[]),...e.desc.slice(0,tt?1:2).map(esc)].join('<br>');
  return `<div class="ev ${TCLS_C[e.cat]||''} ${e.cat==='공연'&&e.stage&&e.stage!=='본공연'?'stg2':''} ${A.sel===e.id?'on':''}" data-aev="${e.id}"><div class="evh"><b>${evLabel(e)}</b><span class="num tm">${e.s}~${e.e}</span></div>${first?`<small>${first}</small>`:''}${chipsByRole(e)}</div>`}
function vGrid(){
  const d=A.day, rooms=D.rooms[d]||[], evs=D.events.filter(e=>e.d===d), meals=D.meals.filter(m=>m.d===d);

  ${starts.map(t=>{const ml=meals.filter(m=>m.s===t).map(m=>`<tr class="meal"><th class="tcol num">${t}</th><td colspan="${rooms.length}">${esc(m.t)} <span class="cap" style="margin:0">${m.s}~${m.e}</span></td></tr>`).join('');
    if(!evs.some(e=>e.s===t)&&!extra.includes(t)) return ml;
    return ml+`<tr><th class="tcol num">${t}${extra.includes(t)&&!evs.some(e=>e.s===t)?`<br><button type="button" class="btn small ghost" data-arowdel="${t}" aria-label="${t} 줄 빼기" style="padding:0 6px;font-size:13px">줄 빼기</button>`:''}</th>${rooms.map(([r])=>{const xs=evs.filter(e=>e.room===r&&e.s===t);

/* 사람 넣기: 역할을 먼저 고르고 → 이름을 「,」로 적거나 · 목록에서 체크해서 한꺼번에 */

function confOf(e,id,skip,at){const d=at?at.d:e.d,s1=at?at.s:e.s,e1=at?at.e:e.e;skip=skip||[];
  const o=D.events.find(o=>o.id!==e.id&&!skip.includes(o.id)&&o.d===d&&o.ppl.some(z=>z.n===id)&&mins(o.s)<mins(e1)&&mins(s1)<mins(o.e));
  if(o)return `같은 시간 「${o.title}」 ${o.s}~${o.e} ${o.room}`;if((A.unav[id]||[]).includes(d))return '못 오는 날';
  const ls=lesAt(id,d,s1,e1);if(ls)return `같은 시간 개인레슨 ${ls.t}~`;return ''}
/* 교수님 개인레슨(30분 칸)과 겹치는지 */
function lesAt(id,d,s1,e1){const nm=NAME(id);return (D.lessons||[]).find(x=>x.d===d&&x.pr===nm&&mins(x.t)<mins(e1)&&mins(s1)<mins(x.t)+30)}
function candRows(e){const q=A.pq.trim();const used=new Set(e.ppl.map(p=>p.n));
  return P().filter(p=>!gone(p.id)&&!used.has(p.id)&&(!q||p.n.includes(q)||(p.acad||'').includes(q)||(p.inst||'').includes(q)))
    .map(p=>{const x=ST.st[p.id]||{total:0,roles:{},cats:{},days:D.days.map(()=>0)};const busy=D.events.some(o=>o.id!==e.id&&o.d===e.d&&o.ppl.some(z=>z.n===p.id)&&mins(o.s)<mins(e.e)&&mins(e.s)<mins(o.e))||!!lesAt(p.id,e.d,e.s,e.e);const off=(A.unav[p.id]||[]).includes(e.d);return {p,x,busy,off}})

function vCount(){
  const t=A.target, q=A.q.trim();
  const rows=P().filter(p=>!gone(p.id)).map(p=>({p,x:ST.st[p.id]||{days:D.days.map(()=>0),roles:{},cats:{},total:0}}))
    .filter(({p})=>A.trainee||p.kind!=='연수생').filter(({p})=>!q||p.n.includes(q)||(p.acad||'').includes(q));
  const main=x=>x.total||0;
  const flag=({p,x})=>x.clash?'clash':x.off?'off':main(x)===0?'zero':main(x)<t.min?'low':main(x)>t.max?'high':'';
  const F={all:()=>true,zero:r=>main(r.x)===0,low:r=>main(r.x)>0&&main(r.x)<t.min,high:r=>main(r.x)>t.max,clash:r=>r.x.clash,off:r=>r.x.off,noles:r=>!((r.x.cats||{})['레슨'])};
  const G=P().filter(p=>gone(p.id)).map(p=>{const x={days:D.days.map(()=>0),roles:{},cats:{},total:0};D.events.forEach(e=>e.ppl.forEach(z=>{if(z.n===p.id){x.days[e.d]++;x.roles[z.r]=(x.roles[z.r]||0)+1;x.cats[e.cat]=(x.cats[e.cat]||0)+1;x.total++}}));return {p,x}}).filter(r=>r.x.total>0);
  const n=k=>k==='gone'?G.length:rows.filter(F[k]).length;
  const L=(A.filter==='gone'?G:rows.filter(F[A.filter]||F.all)).sort((a,b)=>main(a.x)-main(b.x)||a.p.n.localeCompare(b.p.n,'ko'));
  return `<div class="sec-h"><div><h2>교사별 횟수</h2><p>레슨·공연·업무 횟수를 자동으로 세요 (역할별 숫자는 「교사별 일정」). 손으로 세던 메모를 대신해요. 못 오는 날을 체크하면 그날 들어간 칸이 빨갛게 보여요.</p></div></div>
  <div class="row"><span class="cap" style="margin:0">목표 (전체 횟수)</span><input type="number" id="a_tMin" value="${t.min}" min="0" style="width:60px" aria-label="최소">회 ~ <input type="number" id="a_tMax" value="${t.max}" min="0" style="width:60px" aria-label="최대">회
    <label class="checks"><label><input type="checkbox" id="a_trainee" ${A.trainee?'checked':''}>연수생도 보기</label></label>
    <input type="search" id="a_q" value="${esc(A.q)}" placeholder="이름·학원으로 찾기" style="width:min(220px,100%)"></div>
  <div class="row">${[['zero','0회'],['noles','레슨 0회'],['low','목표보다 적음'],['high','목표보다 많음'],['clash','겹침'],['off','못 오는 날 걸림'],['all','전체'],['gone','취소한 사람 (칸에 남음)']].map(([k,l])=>`<button class="btn small ${A.filter===k?'primary':''} ${k==='gone'&&G.length?'warnb':''}" type="button" data-afilter="${k}">${l} ${n(k)}</button>`).join('')}</div>
  <div class="tbl panel" style="padding:0"><table><thead><tr><th>이름</th><th>학원</th><th>악기</th>${D.days.map(x=>`<th class="r">${x.slice(0,4)}</th>`).join('')}<th class="r">레슨</th><th class="r">공연</th><th class="r">업무</th><th class="r">합계</th><th>상태</th><th>못 오는 날</th><th>요청·메모</th><th></th></tr></thead><tbody>
  ${L.map(r=>{const {p,x}=r,f=flag(r),c=x.cats||{};return `<tr><td><b>${LBH(p.id)}</b>${p.kind!=='교사'?` <span class="pill mute">${p.kind}</span>`:''}</td><td>${esc(p.acad||'')}</td><td>${esc(p.inst||'')}</td>
    ${x.days.map(v=>`<td class="r num">${v||'-'}</td>`).join('')}<td class="r num">${c['레슨']||'-'}</td><td class="r num">${c['공연']||'-'}</td><td class="r num">${c['업무']||'-'}</td><td class="r num"><b>${x.total||'-'}</b></td>
    <td>${gone(p.id)?`<span class="pill bad">${goneTxt(p.id)} · ${x.total}칸에 남음</span>`:f==='clash'?`<span class="pill bad">겹침 ${x.clash}</span>`:f==='off'?'<span class="pill bad">못 오는 날 배정</span>':f==='zero'?'<span class="pill due">0회</span>':f==='low'?'<span class="pill due">적음</span>':f==='high'?'<span class="pill info">많음</span>':'<span class="pill ok">맞음</span>'}</td>
    <td><span class="row" style="gap:6px;flex-wrap:nowrap">${D.days.map((dl,i)=>`<label class="dck" title="${dl} 못 옴"><input type="checkbox" data-aunav="${p.id}|${i}" ${(A.unav[p.id]||[]).includes(i)?'checked':''}>${dl.slice(2,4).replace('(','')}</label>`).join('')}</span></td>
    <td><input type="text" data-areq="${p.id}" value="${esc(A.req[p.id]||'')}" placeholder="예: 2권 교사 바꿔 주세요" style="width:170px" aria-label="${esc(p.n)} 요청"></td>
    <td><span class="row" style="gap:4px;flex-wrap:nowrap"><button class="btn small" type="button" data-awho="${p.id}">일정</button>${x.total?`<button class="btn small ghost" type="button" data-apull="${p.id}">모든 칸에서 빼기</button>`:''}</span></td></tr>`}).join('')||'<tr><td colspan="16" class="cap">해당하는 사람이 없어요.</td></tr>'}
  </tbody></table></div>`}

    ${G.length?`<table class="pft"><tbody>${G.map(g=>`<tr><th style="white-space:nowrap;text-align:left;padding-right:10px">${esc(g.r)}</th><td>${g.N.map(esc).join(', ')}</td></tr>`).join('')}</tbody></table>`:'<p class="cap">아직 넣은 사람이 없어요.</p>'}</div>`)}

/* 정원에서 남은 자리 (skip = 그 줄은 빼고 셈) · 날짜마다 따져 가장 적은 값 */
function roomLeft(skip){const e=A.ed,rd=e.days.length?e.days:allDays();return Math.min(...rd.map(d=>e.cap-e.occ.filter((o,i)=>i!==skip&&(o.days.length?o.days:rd).includes(d)).reduce((t,o)=>t+(+o.n||0),0)))}

function edRead(){const e=A.ed;if(!e)return;const g=id=>document.getElementById(id);if(!g('r_kind'))return;e.kind=g('r_kind').value;e.cap=+g('r_cap').value||e.cap;if(g('r_size')){e.size=g('r_size').value.trim();e.beds=g('r_beds').value===''?'':+g('r_beds').value;e.feat=g('r_feat').value.trim()}e.pub=g('r_pub').checked;e.pw=g('r_pw').value.trim();e.memo=g('r_memo').value.trim();e.color=g('r_colOn')&&g('r_colOn').checked?g('r_col').value:''}
document.addEventListener('change',ev=>{if(S.tab==='room'&&ev.target.name==='rc_mode'){A.cMode=ev.target.value;A.cfgOpen=true;['kind','main'].forEach(k=>{const el=document.getElementById('rc_'+k);if(el)el.style.display=k===A.cMode?'':'none'});return}if(S.tab!=='room'||!A.ed)return;const el=ev.target,d=el.dataset;
  if(d.rday!==undefined){edRead();const D=allDays();let rd=A.ed.days.length?A.ed.days.slice():D.slice();const x=+d.rday;rd=el.checked?[...new Set([...rd,x])].sort((a,b)=>a-b):rd.filter(y=>y!==x);A.ed.days=rd.length===D.length?[]:rd;A.ed.occ.forEach(o=>{o.days=o.days.filter(y=>rd.includes(y));if(o.days.length===rd.length)o.days=[]});render();return}

/* 가족방 신청: 대표 + 같은 방 형제 + 가족 · 방 = 배정에 그 가족(접수번호 · 대표 이름)이 든 방 (예전처럼 비번 수신자 · 메모에 대표 이름이 있는 가족방도) */
function famRooms(){const L=[];(S.D.subs||[]).forEach(sb=>{const f=sb.form||{},room=f.room||{},join=f.join||{},fam=f.fam||[];
  const P=k=>sb.ppl.find(p=>p.id===sb.no+'_'+k),live=k=>{const p=P(k);return p&&p.status!=='취소'};
  Object.keys(room).filter(k=>room[k]&&live(k)).forEach(k=>{const heads=[k,...Object.keys(join).filter(j=>join[j]===k&&live(j))];
    const fm=fam.filter(x=>heads.includes(x.link)&&live(x.id));const rep=P(k);
    const mem=[...heads.map(h=>{const p=P(h);return {name:p.name,t:h===k?'대표':'형제·자녀'}}),...fm.map(x=>({name:(P(x.id)||{}).name||x.name,t:({'회원의 첫번째 보호자':'보호자','비회원 보호자':'보호자','동반가족 중 돌전아기':'돌 전 아기','비회원 돌전아기':'돌 전 아기'})[x.type]||'동반가족'}))];
    const ids=[...heads,...fm.map(x=>x.id)].map(x=>P(x)).filter(Boolean);const due=ids.reduce((t,p)=>t+pAmt(p)-(+p.paidAmt||0),0);
    const rs=(R?R.rooms:[]).filter(r=>(r.occ||[]).some(o=>o.k==='fam'&&o.no===sb.no&&o.v.startsWith(rep.name))||(/가족방/.test(r.kind)&&(r.pw.includes(rep.name)||r.memo.includes(rep.name))));
    L.push({sb,rep,mem,n:mem.length,fee:+rep.room||0,paid:ids.every(p=>(+p.paidAmt||0)>0&&pAmt(p)-(+p.paidAmt||0)<=0),due,rs,req:(S.D.issues||[]).filter(x=>ROOM_REQ.includes(x.where)&&(x.name===sb.owner||x.acad===sb.acad)).length})})});
  return L.sort((a,b)=>a.sb.acad.localeCompare(b.sb.acad,'ko')||a.rep.name.localeCompare(b.rep.name,'ko'))}

function builtinFloors(){const LY=ROOM_LAYOUT,st=LY.starts;return st.map((r0,i)=>{const r1=i+1<st.length?st[i+1]:LY.rh.length;const f=LY.fl[r0];
  const rooms={};Object.entries(LY.rooms).forEach(([no,[r,c,lab]])=>{if(r>=r0&&r<r1)rooms[no]=[r-r0,c,lab?[lab[0]-r0,lab[1]]:null]});
  return {name:f?'Stay '+f.split(' ')[0]:'Flex Tower',bld:f?'Stay Tower':'Flex Tower',fl:f?f.split(' ')[0]:'',cw:LY.cw,rh:LY.rh.slice(r0,r1),cells:LY.cells.filter(x=>x[0]>=r0&&x[0]<r1).map(x=>[x[0]-r0,...x.slice(1)]),rooms,builtin:true}})}

    ${editor()}
    ${[...new Set(L.map(r=>r.fl))].map(f=>`<div class="floor"><span class="flab">${esc(A.bld)} ${esc(f)} · ${L.filter(r=>r.fl===f&&used(r)).length}/${L.filter(r=>r.fl===f).length}</span><div class="rgrid">${L.filter(r=>r.fl===f).map(tile).join('')}</div></div>`).join('')}</div>`}
function save(clear){const e=A.ed;if(!e)return;edRead();
  const x=clear?{no:e.no,occ:[],cap:e.cap,memo:e.memo,size:e.size,beds:e.beds,feat:e.feat}:{no:e.no,kind:e.kind,cap:e.cap,pw:e.pw,memo:e.memo,pub:e.pub,days:e.days,occ:e.occ,color:e.color,size:e.size,beds:e.beds,feat:e.feat};
  if(!clear&&e.occ.length&&!e.kind){toast('방종류를 골라 주세요');return}
  if(!clear){const rd=e.days.length?e.days:allDays();const bad=rd.find(d=>e.occ.filter(o=>(o.days.length?o.days:rd).includes(d)).reduce((t,o)=>t+(+o.n||0),0)>e.cap);if(bad!=null){toast(dayLab(bad)+' 인원이 정원보다 많아요 · 정원을 고치거나 인원 · 날짜를 줄여 주세요');return}}

document.addEventListener('click',ev=>{if(S.tab!=='room')return;const b=ev.target.closest('button,td[data-rroom]');if(!b)return;const d=b.dataset;

  if(d.rqf){A.qf=d.rqf;render();return}

  if(d.rbld!==undefined){A.bld=d.rbld;A.fl='';A.sel='';A.ed=null;render();return}
  if(d.rfl!==undefined){A.fl=d.rfl;A.sel='';A.ed=null;render();return}

  if(d.rmain!==undefined){edRead();const o=A.ed.occ.splice(+d.rmain,1)[0];A.ed.occ.unshift(o);render();return}
  const addO=o=>{edRead();const left=roomLeft(-1);if(left<=0){toast(`정원 ${A.ed.cap}명이 다 찼어요 · 더 넣으려면 정원을 늘리거나 인원을 줄여 주세요`);return}
    if(o.k==='acad')o.n=Math.min(o.n||1,left);else if((o.n||1)>left){toast(`남은 자리가 ${left}명이라 넣을 수 없어요 (정원 ${A.ed.cap}명)`);return}
    const fam=A.ed.occ.some(x=>x.k==='fam');if(fam&&o.k!=='fam'){toast('가족방에는 학원 · 사람 · 이름을 같이 넣을 수 없어요');return}if(o.k==='fam'&&A.ed.occ.some(x=>x.k!=='fam')){toast('가족은 빈 방(또는 가족방)에만 넣을 수 있어요');return}A.ed.occ.push(Object.assign({days:[],tm:''},o));render()};
  if(b.id==='r_addAcad'){const v=(document.getElementById('r_addA')||{}).value;if(!v){toast('학원을 골라 주세요');return}const M=acads();const left=Math.max(0,(M[v]?M[v].n:0)-got(v));addO({k:'acad',v,a:v,n:Math.min(left||1,A.ed.cap)});return}
  if(b.id==='r_addGrp'){const v=(document.getElementById('r_addG')||{}).value;if(!v){toast('이름을 골라 주세요 · 목록은 「방 공개 · 메인 이름」에서 정해요');return}addO({k:'grp',v,a:'',n:1});return}
  if(b.id==='r_addName'){const v=((document.getElementById('r_addP')||{}).value||'').trim();if(!v){toast('사람 이름을 넣어 주세요');return}const p=people().find(x=>x.n===v);addO({k:'name',v,a:p?p.a:'',n:1});return}
  if(b.id==='r_addFam'){const v=(document.getElementById('r_addF')||{}).value;if(!v){toast('가족을 골라 주세요');return}const [no,rep]=v.split('|');const f=famRooms().find(x=>x.sb.no===no&&x.rep.name===rep);if(!f)return;
    addO({k:'fam',v:rep+' 가족',a:f.sb.acad,n:f.n,no,names:f.mem.map(m=>m.name)});A.ed.kind='가족방';if(!A.ed.pw)A.ed.pw=rep;render();return}
  if(b.id==='r_save'){save(false);return}
  if(b.id==='r_clear'){save(true);return}
  if(b.id==='r_close'){A.sel='';A.ed=null;render();return}
  if(b.id==='r_tcolSave'){const tc={};document.querySelectorAll('.r_tcol').forEach(x=>{if(x.value.trim())tc[x.dataset.c]=x.value.trim()});const c=R.cfg||{};b.disabled=true;
    run('roomCfgSave',[{pubAll:!!c.pubAll,pubAt:c.pubAt||'',names:c.names||[],typeColors:tc}],r=>{R=r;render();toast('방 타입 이름을 저장했어요')},m=>{b.disabled=false;toast('저장하지 못했어요 · '+m)});return}
  if(b.id==='r_lySrcSave'){const v=(document.getElementById('r_lySrc').value||'').trim();const c=R.cfg||{};b.disabled=true;
    run('roomCfgSave',[{pubAll:!!c.pubAll,pubAt:c.pubAt||'',names:c.names||[],layoutSrc:v}],r=>{R=r;A.lyRes=null;render();toast(r.layoutErr?r.layoutErr:`도면 시트를 저장했어요 · 도면 탭 ${(r.layoutTabs||[]).length}개`)},m=>{b.disabled=false;toast('저장하지 못했어요 · '+m)});return}
  if(b.id==='r_lyImp'){const tabs=(R.layoutTabs||[]).slice();if(!tabs.length)return;b.disabled=true;const out=[];let i=0;
    const next=()=>{if(i>=tabs.length){A.lyRes=out;load();toast(`도면 ${out.length}탭을 불러왔어요`);return}b.textContent=`불러오는 중 ${i+1}/${tabs.length} · ${tabs[i]}`;
      run('layoutImport',[tabs[i]],r=>{out.push(r);i++;next()},m=>{b.disabled=false;b.textContent='도면 불러오기';toast(tabs[i]+' 을(를) 불러오지 못했어요 · '+m)})};next();return}
  if(d.rmv){const to=(document.querySelector(`[data-rmvto="${d.rmv}"]`)||{}).value;if(!to){toast('옮길 방을 골라 주세요');return}
    run('roomMove',[d.rmv,to],r=>{R=r;(A.lyRes||[]).forEach(x=>x.missing.forEach(m=>{if(m.no===d.rmv)m.used=false}));render();toast(d.rmv+' 배정을 '+to+'(으)로 옮겼어요')},m=>toast('옮기지 못했어요 · '+m));return}
  if(b.id==='rc_pubSel'){if(!A.ed)return;edRead();A.ed.pub=!A.ed.pub;save(false);return}

    const colors={mode:(document.querySelector('[name=rc_mode]:checked')||{}).value||'kind',kind:{},main:{}};document.querySelectorAll('.rc_col').forEach(x=>{colors[x.dataset.t][x.dataset.k]=x.value});
    run('roomCfgSave',[{pubAll:all,pubAt:at,names,colors}],r=>{R=r;render();toast(all?(at?at+'에 방이 공개돼요':'방을 일괄 공개했어요'):'일괄 공개를 껐어요 (방마다 공개한 방은 보여요)')},m=>toast('저장하지 못했어요 · '+m));return}});
return {view};
})();


/* ================= 오후음악회 (신청 목록 · 연주 순서 · 리허설) ================= */
const CON_KINDS=['오후','트와일라잇','이브닝','없음'];
const CAMP_YEAR=2027, CAMP_DAY='01-11';   /* 캠프 첫날 기준 만 나이 (생일을 모르면 출생연도로: 캠프가 1월이라 대부분 생일 전 → 캠프 해 − 출생연도 − 1) */
const manAge=by=>{by=String(by||'').trim();if(!/^\d{4}/.test(by))return '';const y=+by.slice(0,4);const md=by.length>=10?by.slice(5,10):'';return CAMP_YEAR-y-(md&&md<=CAMP_DAY?0:1)};
const bookNo=g=>{g=String(g||'');if(/pre/i.test(g))return 0;const m=g.match(/(\d+)권/);return m?+m[1]+(/B/.test(g.slice(m.index,m.index+4))?.5:0)+(/이상/.test(g)?.6:0):99};
function conRows(){const L=[];(S.D.subs||[]).forEach(sb=>sb.ppl.forEach(p=>{if(p.status==='취소')return;const k=p.id.slice(sb.no.length+1),i=(sb.form&&sb.form.info&&sb.form.info[k])||{};
  const type=p.type||i.type||'';if(!['학생','회원의 악기하는 자녀','비회원 학생','교사','연수생','소속없는 중급연수생'].includes(type))return;
  L.push({id:p.id,key:p.name+'('+String(sb.acad).replace(/스즈키$/,'')+')',at:String(p.addAt||sb.createdAt||''),round:sb.round||'',acad:sb.acad,owner:sb.owner||'',name:p.name,inst:p.inst||i.inst||'',by:i.by||'',age:manAge(i.by),type,prog:i.prog||'',con:i.concert||'없음',
    song:i.other?'':(i.song||''),oc:i.other?(i.oc||''):'',ot:i.other?(i.ot||''):'',video:i.concert==='이브닝'?(i.video||''):'',status:p.status})}));return L}
function conAll(){const m={};(S.D.subs||[]).forEach(sb=>sb.ppl.forEach(p=>{m[p.id]={name:p.name,acad:sb.acad,status:p.status}}));return m}

  return tabs+(sv==='ord'?CORD.view():vConList())}

/* ---------- 연주 순서 · 리허설 ---------- */
const CORD=(()=>{
let C=null,LOADING=false,ERR='',TIMER=null,DIRTY=false,SAVING=false,CHG=0;
const A={pick:{}};
const hm=s=>{const [h,m]=String(s).split(':').map(Number);return h*60+m};
const fmt=n=>String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');
function run(fn,args,ok,fail){if(roBlock(fn)){fail&&fail(RO_MSG);return}google.script.run.withSuccessHandler(ok).withFailureHandler(e=>{const m=(e&&e.message)||String(e);fail&&fail(m)})[fn](S.tok,...args)}
function load(){LOADING=true;ERR='';run('conGet',[],r=>{LOADING=false;C=r;C.concerts.forEach(x=>{if(!C.order[x.id])C.order[x.id]=[]});render()},m=>{LOADING=false;ERR=m;render()})}
function save(){CHG++;DIRTY=true;clearTimeout(TIMER);TIMER=setTimeout(flush,1200);stat()}
function flush(){if(SAVING){setTimeout(flush,400);return}if(!DIRTY)return;SAVING=true;const sent=CHG;stat();

    <tr class="off"><td><small class="faint">그 뒤</small></td><td>${inp('refund.after.label','text','maxlength="30"')}</td><td>${inp('refund.after.rate','num','style="width:64px"')}</td><td class="c">${inp('refund.after.doc','check')}</td><td><label class="row" style="gap:4px;flex-wrap:nowrap"><small>취소 받기</small>${inp('refund.after.allow','check')}</label></td></tr></tbody></table>
    <label class="row" style="gap:6px;margin-top:6px">${inp('refund.duesRefund','check')} 연회비도 환불</label>
    <p class="hint">위에서부터 처음 맞는 규정을 써요 (취소 요청한 날 기준). 「취소 받기」를 끄면 캠프 시작 뒤에는 입금한 사람이 취소를 요청할 수 없어요.</p></div>
  <div class="panel"><div class="spread"><h3>식사 시간 <span class="hint">교사 일정 모든 날짜의 식사 줄 · 프로그램북에도 그대로</span></h3><button class="btn small" type="button" data-ccm="add" ${(c.meals||[]).length>=6?'disabled':''}>＋ 식사 추가</button></div>

    ${(c.meals||[]).map((m,i)=>`<tr class="${m.on===false?'off':''}"><td>${inp('meals.'+i+'.k','text','maxlength="10" style="width:70px"')}</td><td>${inp('meals.'+i+'.s','time')}</td><td>${inp('meals.'+i+'.e','time')}</td><td>${inp('meals.'+i+'.t','text','maxlength="120" style="min-width:220px" placeholder="예: Lunch 점심 식사 · 식사 장소: 밀타임"')}</td><td class="c">${inp('meals.'+i+'.first','check')}</td><td class="c">${inp('meals.'+i+'.last','check')}</td><td class="c">${inp('meals.'+i+'.on','check')}</td><td><button class="btn small ghost" type="button" data-ccm="del|${i}">빼기</button></td></tr>`).join('')||'<tr><td colspan="8" class="hint">식사 시간이 없어요.</td></tr>'}</tbody></table>

document.addEventListener('input',e=>{const t=e.target;if(!t.dataset||!t.dataset.cc||!S.cc)return;const ty=t.dataset.cct;
  const v=t.type==='checkbox'?t.checked:ty==='num'?+(t.value.replace(/[^\d]/g,'')||0):t.value;ccSet(t.dataset.cc,v);
  const p=document.getElementById('ccDirty');if(p)p.innerHTML=ccPill()});
document.addEventListener('change',e=>{const t=e.target;if(!t.dataset||!t.dataset.cc||!S.cc)return;if(t.tagName==='SELECT'){ccSet(t.dataset.cc,t.value);render();return}
  if(t.dataset.cct==='num'){t.value=(+(t.value.replace(/[^\d]/g,'')||0)).toLocaleString('ko-KR');return}if(t.type==='checkbox'||t.type==='date')render()});
function ccClick(b,d){if(S.tab!=='camp'&&S.tab!=='cons')return false;const c=S.cc;
  if(d.ccreset){S.cc=null;render();return true}
  if(d.ccr){const [op,i]=d.ccr.split('|');if(op==='add'){const L=c.rounds[c.rounds.length-1]||{};c.rounds.push({n:(c.rounds.length+1)+'차',from:L.to||'',to:L.to||''});Object.keys(c.fees).forEach(t=>c.fees[t].push(c.fees[t][c.fees[t].length-1]||0))}
    else{c.rounds.splice(+i,1);Object.keys(c.fees).forEach(t=>c.fees[t].splice(+i,1));if(c.base.cur!=='auto'&&+c.base.cur>=c.rounds.length)c.base.cur='auto'}render();return true}
  if(d.ccf){const [op,i]=d.ccf.split('|');if(op==='add'){const L=c.refund.rules[c.refund.rules.length-1];c.refund.rules.push({until:L?L.until:'',label:'',rate:0,doc:false})}else c.refund.rules.splice(+i,1);render();return true}
  if(d.ccm){const [op,i]=d.ccm.split('|');c.meals=c.meals||[];if(op==='add')c.meals.push({k:'',t:'',s:'15:00',e:'15:30',on:true,first:true,last:true});else c.meals.splice(+i,1);render();return true}
  if(b.id==='fkMake'){const t=+document.getElementById('fkT').value||0,sN=+document.getElementById('fkS').value||0;ask('가상 접수를 만들까요?',`교사 ${t}명 · 학생 ${sN}명을 「가상○○스즈키」 학원들로 접수해요 (학원마다 교사 3명). 나중에 「가상 접수 모두 지우기」로 한 번에 지울 수 있어요.`,()=>call('devFakeSubs',[t,sN],r=>{setData(r.adm);toast('가상 접수 '+r.made.length+'건을 만들었어요 · '+r.made.join(', '))},'가상 접수를 만들고 있어요…'),'만들기');return true}
  if(b.id==='fkClear'){ask('가상 접수를 모두 지울까요?','가상 표시가 있는 접수와 그 참가자 줄만 지워요. 진짜 접수는 그대로예요. 방 · 레슨 · 일정에 넣은 가상 인원은 따로 빼 주세요.',()=>call('devFakeClear',[],r=>{setData(r.adm);toast('가상 접수 줄 '+r.n+'개를 지웠어요')},'지우고 있어요…'),'지우기');return true}
  if(d.ccsave){const old=S.D.camp||{},idCh=old.base&&old.base.id!==c.base.id;const ap=document.getElementById('ccMealsApply');c.mealsApply=!!(ap&&ap.checked);
    const go=()=>call('campSave',[c,old.rev||0],r=>{S.D.camp=r.camp;S.cc=null;applyCampAdm(r.camp);render();toast('캠프 설정을 저장했어요 · 선생님 화면에 바로 반영돼요'+(r.mealsDays?` · 교사 일정 ${r.mealsDays}일에 식사 시간을 넣었어요`:''));if(r.mealsDays)ACT.reset()},'저장하고 있어요…');
    if(idCh&&(S.D.subs||[]).length)ask('캠프 코드를 바꿀까요?',`이미 접수가 ${(S.D.subs||[]).length}건 있어요. 새 접수부터 <b>${esc(c.base.id)}-001</b>처럼 번호가 매겨지고, 지난 접수 번호는 그대로예요. 보통은 새 캠프를 열 때만 바꿔요.`,go,'그래도 저장');
    else go();return true}
  return false}
/* 캠프 설정 → 관리자 화면 값 (환불 규정) */
function applyCampAdm(c){if(!c||!c.refund||!Array.isArray(c.refund.rules))return;CX_RULES.length=0;c.refund.rules.forEach(r=>CX_RULES.push(r))}

/* ---------- 동의서 (설정 › 동의서, 총관리자): 문구 입력·수정·저장 + 누가 동의했는지 ---------- */
function vCons(){if(!S.cc)S.cc=ccCopy();const c=S.cc;if(!c.consent)return '<div class="panel hint">불러오지 못했어요. 「새로 불러오기」를 눌러 주세요.</div>';
  const inp=(p,extra)=>`<input type="text" data-cc="${p}" value="${esc(ccGet(p)==null?'':ccGet(p))}" ${extra||''}>`;

  bg.innerHTML=`<div class="askbox popbox" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="spread"><b style="font-size:18px">${esc(title)}</b><button class="btn small ghost" type="button" data-x>닫기</button></div><div style="max-height:65vh;overflow:auto">${html}</div></div>`;
  document.body.appendChild(bg);const close=()=>{bg.remove();document.removeEventListener('keydown',k)};const k=e=>{if(e.key==='Escape')close()};document.addEventListener('keydown',k);
  bg.addEventListener('click',e=>{if(e.target===bg||e.target.closest('[data-x]'))close()});const f=bg.querySelector('[data-x]');if(f)f.focus();return bg}
function popShow(k){const P=POP[k];if(!P)return;const bg=document.createElement('div');bg.className='askbg';
  const L=P.list.slice().sort((a,b)=>a.acad.localeCompare(b.acad,'ko')||String(a.p.name).localeCompare(b.p.name,'ko'));
  const tsv=[['이름','학원','구분','악기','권수(진도)','담당 교사','접수번호'],...L.map(x=>[x.p.name,x.acad,x.type,x.inst,x.prog,x.i.teacher||'',x.sb.no])].map(r=>r.map(v=>String(v==null?'':v).replace(/[\t\n]/g,' ')).join('\t')).join('\n');
  bg.innerHTML=`<div class="askbox popbox" role="dialog" aria-modal="true" aria-label="${esc(P.label)}"><div class="spread"><b style="font-size:18px">${esc(P.label)} · ${L.length}명</b><div class="row" style="gap:6px"><button class="btn small" type="button" data-popcopy>표 복사</button><button class="btn small ghost" type="button" data-x>닫기</button></div></div>
    <div class="tbl" style="max-height:60vh;overflow:auto"><table><thead><tr><th>#</th><th>이름</th><th>학원</th><th>구분</th><th>악기</th><th>권수 (진도)</th><th>담당 교사</th><th>접수</th></tr></thead><tbody>
    ${L.map((x,n)=>`<tr><td class="num">${n+1}</td><td><b>${esc(x.p.name)}</b>${x.p.status==='취소요청'?' <small class="faint">(취소 요청)</small>':''}</td><td>${esc(x.acad)}</td><td><small>${esc(x.type==='회원의 악기하는 자녀'?'악기하는 교사자녀':x.type)}</small></td><td>${esc(x.inst||'')}</td><td>${esc(x.prog||'-')}</td><td>${esc(x.i.teacher||'')}</td><td class="num"><small>${esc(x.sb.no)}</small></td></tr>`).join('')}</tbody></table></div></div>`;
  document.body.appendChild(bg);const close=()=>{bg.remove();document.removeEventListener('keydown',esc_)};const esc_=e=>{if(e.key==='Escape')close()};document.addEventListener('keydown',esc_);
  bg.addEventListener('click',e=>{if(e.target===bg||e.target.closest('[data-x]'))close();else if(e.target.closest('[data-popcopy]')){try{navigator.clipboard.writeText(tsv).then(()=>toast('복사했어요 · 시트에 붙여넣기'),()=>toast('복사하지 못했어요'))}catch(x){toast('복사하지 못했어요')}}});
  const f=bg.querySelector('[data-x]');if(f)f.focus()}
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('[data-pop]');if(b){e.stopPropagation();popShow(b.dataset.pop)}},true);
function stInst(L){const P=L.filter(x=>T_TEACH.includes(x.type)||T_PLAY.includes(x.type));const ins=cnt(P,x=>x.inst||'미정').sort((x,y)=>instSort(x[0],y[0]));
  const iof=x=>x.inst||'미정',isT=x=>T_TEACH.includes(x.type),isS=x=>T_PLAY.includes(x.type);
  const top=ST(['악기','교사','학생','합계'],ins.map(([i])=>{const G=P.filter(x=>iof(x)===i);return [esc(i),pc(G.filter(isT),i+' 교사'),pc(G.filter(isS),i+' 학생'),pc(G,i+' 전체')]}),['합계',pc(P.filter(isT),'교사 전체'),pc(P.filter(isS),'학생 전체'),pc(P,'교사·학생 전체')]);
  const per=ins.map(([i])=>{const Sx=P.filter(x=>iof(x)===i&&isS(x));if(!Sx.length)return '';
    const list=PROG_LIST[i]||PROG_LIST['기타'];const known=new Set(list);const extra=[...new Set(Sx.map(x=>x.prog).filter(g=>g&&!known.has(g)))];const all=[...list,...extra];
    const T=Sx.length,none=Sx.filter(x=>!x.prog);
    const books=[...new Set(all.map(bookOf))];const bl=b=>Sx.filter(x=>x.prog&&bookOf(x.prog)===b);
    const bookTbl=ST(['권수','인원'],books.map(b=>[esc(b),pc(bl(b),i+' '+b)]).concat(none.length?[['<span class="faint">진도 미입력</span>',pc(none,i+' 진도 미입력')]]:[]),['총계',pc(Sx,i+' 학생 전체')]);
    const rows=[];books.forEach(b=>{const G=all.filter(g=>bookOf(g)===b);if(G.length>1||G[0]!==b){G.forEach(g=>{rows.push(['&nbsp;&nbsp;'+esc(g),pc(Sx.filter(x=>x.prog===g),i+' '+g)])});rows.push([`<b>${esc(b)} 총계</b>`,pc(bl(b),i+' '+b)])}
      else rows.push([esc(b),pc(bl(b),i+' '+b)])});
    if(none.length)rows.push(['<span class="faint">진도 미입력</span>',pc(none,i+' 진도 미입력')]);
    const progTbl=ST(['현재 진도','인원'],rows,['총계',pc(Sx,i+' 학생 전체')]);
    return `<div class="panel"><div class="spread"><b>${esc(i)} 학생 ${T}명</b> <span class="hint">학생 + 악기하는 교사자녀</span><span class="hint">권수는 현재 진도에서 셈 (1권A·1권B → 1권) · 숫자를 누르면 누구인지 보여요</span></div><div class="stgrid"><div><b class="hint">권수별</b>${bookTbl}</div><div><b class="hint">진도별</b>${progTbl}</div></div></div>`}).join('');
  return top+per}
/* 2026 여름 「학원별인원통계」「명찰통계」와 같은 표 */
const TYPE_ORDER=['교사','연수생','소속없는 중급연수생','학생','회원의 악기하는 자녀','회원의 첫번째 보호자','회원의 그외 악기 안하는 동반가족','동반가족 중 돌전아기','비회원 학생','비회원 보호자','비회원 동반가족','비회원 돌전아기','초빙교수','반주자','지휘자','통역','초청강사','스태프','기타 관계자','해외 학생','해외 교사','해외 보호자','해외 동반가족','해외 돌전아기'];
const T_TEACH=['교사','연수생','소속없는 중급연수생','해외 교사'],T_PLAY=['학생','회원의 악기하는 자녀','비회원 학생','해외 학생'];
const byTot=(A,f)=>A.map(a=>[a,f(a)]).sort((x,y)=>y[1]-x[1]||x[0].localeCompare(y[0],'ko')).map(x=>x[0]);
const nz=n=>n||'';
function stBadge(L){const A=[...L.map(x=>x.acad)].filter((x,i,arr)=>arr.indexOf(x)===i).sort((x,y)=>x.localeCompare(y,'ko'));const tc=G=>G.filter(x=>T_TEACH.includes(x.type)).length,pc=G=>G.filter(x=>T_PLAY.includes(x.type)).length,fc=G=>G.length-tc(G)-pc(G);
  return `<div class="panel"><b>명찰 통계</b> <span class="hint">학원 이름순 · 교수진은 「교수진」 탭에서 사용 중인 분 (같은 이름은 한 장)</span>${(()=>{const pf=[...new Set((S.D.profs||[]).filter(p=>p.on).map(p=>p.name))].length;return ST(['학원','교사','학생','가족','필요 명찰 수'],A.map(a=>{const G=L.filter(x=>x.acad===a);return [esc(a),nz(tc(G)),nz(pc(G)),nz(fc(G)),G.length]}).concat(pf?[['교수진','','','',pf]]:[]),['총계',tc(L),pc(L),fc(L),L.length+pf])})()}</div>`}
function stLes(L){const LS=L.filter(x=>x.lessons>0);const M=L.filter(x=>x.mc.length);
  return `<div class="panel"><b>추가 개인레슨</b> <span class="hint">${LS.length}명 · ${LS.reduce((t,x)=>t+x.lessons,0)}회 · ${won(LS.reduce((t,x)=>t+x.lessons,0)*60000)}</span></div>`
    +ST(['선호 교수 1','신청자','레슨 횟수','선호 교수 2로 고른 사람'],cnt(LS,x=>x.p1||'(안 고름)').map(([k,n])=>[esc(k),n,LS.filter(x=>(x.p1||'(안 고름)')===k).reduce((t,x)=>t+x.lessons,0),LS.filter(x=>x.p2===k).length||'']))
    +`<div class="panel"><b>마스터클래스</b> <span class="hint">${M.length}명</span></div>`
    +ST(['교수','신청자','이름'],[...new Set(M.flatMap(x=>x.mc))].map(m=>{const Q=M.filter(x=>x.mc.includes(m));return [esc(m),Q.length,Q.map(x=>esc(x.p.name)+' <small class="faint">'+esc(x.acad)+'</small>').join(', ')]}))}
function stCon(L){const C=L.filter(x=>x.concert);return ['오후','트와일라잇','이브닝'].map(c=>{const Q=C.filter(x=>x.concert===c);return `<div class="panel tbl"><b>${c} 음악회 ${Q.length}명</b>${Q.length?`<table style="margin-top:6px"><thead><tr><th>이름</th><th>학원</th><th>악기</th><th>곡</th></tr></thead><tbody>${Q.map(x=>`<tr><td>${esc(x.p.name)}</td><td>${esc(x.acad)}</td><td>${esc(x.inst)}</td><td>${esc(x.song)}</td></tr>`).join('')}</tbody></table>`:''}</div>`}).join('')}
function stRoom(L){const R=L.filter(x=>x.room);return ST(['학원','가족방 수','대표'],[...new Set(R.map(x=>x.acad))].map(a=>{const Q=R.filter(x=>x.acad===a);return [esc(a),Q.length,Q.map(x=>esc(x.p.name)).join(', ')]}),['합계',R.length,''])}

/* ================= 예산 · 결산 =================
   예산 계획(bplan): 지출 줄(단가 × 수량 × 횟수) · 수입(참가자격 구성 × 참가비 + 그 밖의 수입) · 인원별 손익표
   결산(bset): 같은 지출 줄에 확정(견적 · 계약) · 지급 · 지급일 · 방법, 참가비 수입은 접수 입금에서 자동
   시트 「예산결산」(값 JSON) · 서버 budData / budSave · 확정 · 지급 · 실제 금액은 모두 원(KRW) */
const BUD=(()=>{
const CATS=[['room','호텔 · 객실'],['meal','호텔 · 식사'],['hall','호텔 · 홀'],['prof','교수 인건비'],['teach','교사 인건비'],['staff','스텝 · 외부 연주자'],['print','인쇄'],['equip','장비'],['ad','광고'],['bus','교통'],['schol','장학금'],['etc','기타 · 잡비']];
const HOTEL=['room','meal','hall'];
/* 26 겨울(2026.1) 결산 시트의 실지출 — 묶음별 비교용 */
const REF={room:105000000,meal:87090000,hall:0,prof:41250000,teach:19000000,staff:12650000,print:1566000,equip:1650000,ad:1000000,bus:3700000,schol:5900000,etc:1500000};
const REF_INC=336060000,REF_COST=280306000;
const MIX26={'학생':266,'교사':95,'연수생':26,'회원의 악기하는 자녀':20,'회원의 첫번째 보호자':69,'회원의 그외 악기 안하는 동반가족':29,'동반가족 중 돌전아기':1,'비회원 학생':2,'비회원 보호자':2};
const CUR=[['KRW','원'],['USD','달러'],['JPY','엔']];
const HOW=['','통장','카드','현금','달러','엔화','기타'];
const B={D:null,P:null,L:false,err:'',sub:'cost'};
const cp=o=>JSON.parse(JSON.stringify(o));
const dirty=()=>!!(B.D&&B.P&&JSON.stringify(B.P)!==JSON.stringify(B.D.plan));
const pn=v=>{const s=String(v==null?'':v).replace(/[^\d.\-]/g,'');return s===''||s==='-'||s==='.'?'':+s};
const fmt=v=>v===''||v==null?'':(+v).toLocaleString('ko-KR',{maximumFractionDigits:2});
const W=v=>won(Math.round(+v||0));
const sg=v=>{v=Math.round(+v||0);return `<span class="${v<0?'bneg':v>0?'bpos':''}">${v>0?'+':''}${v.toLocaleString('ko-KR')}원</span>`};
function load(){B.L=true;B.err='';google.script.run.withSuccessHandler(r=>{B.L=false;B.D=r;B.P=cp(r.plan);render()}).withFailureHandler(e=>{B.L=false;B.err=(e&&e.message)||String(e);render()}).budData(S.tok)}
function enter(){if(!dirty()){B.D=null;B.P=null}}

/* ---------- 계산 ---------- */
const nb=()=>Math.max(1,+B.P.base.n||1);
const fx=c=>!c||c==='KRW'?1:+((B.P.base.fx||{})[c])||0;
function qty(l,N,sc){if(l.scale!=='person'||(sc&&B.P.base.hotelFix&&HOTEL.includes(l.cat)))return +l.qty||0;return Math.max(+l.guar||0,Math.round((+l.qty||0)*N/nb()))}
const amt=(l,N,sc)=>(+l.unit||0)*qty(l,N==null?nb():N,sc)*(+l.times||0)*fx(l.cur);
/* 참가비 = 캠프 설정 참가비표 그대로 (참가자격 × 차수) · 차수 비율로 평균 */
const CF=()=>(S.D&&S.D.camp&&S.D.camp.fees)||B.D.fees||{};
const RN=()=>{const r=S.D&&S.D.camp&&S.D.camp.rounds;return r&&r.length?r.map(x=>x.n):(B.D.rounds||['1차'])};
const feeR=(t,r)=>+((CF()[t]||[])[r])||0;
const fee1=t=>feeR(t,0);
function rmix(){const n=RN().length,R=(B.P.base.rmix||[]).slice(0,n).map(v=>+v||0);while(R.length<n)R.push(R.length?0:1);return R.some(v=>v>0)?R:R.map((v,i)=>i?0:1)}
function feeOf(t){const R=rmix(),tot=R.reduce((a,v)=>a+v,0);return R.reduce((a,v,i)=>a+v*feeR(t,i),0)/tot}
function liveRounds(){const n=RN(),m=n.map(()=>0);(S.D.subs||[]).forEach(sb=>{const i=n.indexOf(sb.round);if(i<0)return;sb.ppl.forEach(p=>{if(p.status==='정상')m[i]++})});return m}
function avgFee(){const M=B.P.mix||{};let n=0,s=0;Object.keys(M).forEach(t=>{n+=+M[t]||0;s+=(+M[t]||0)*feeOf(t)});return n?s/n:0}
const incAmt=(i,N)=>(+i.amt||0)*fx(i.cur)*(i.scale==='person'?(N==null?nb():N)/nb():1);
function calc(N,sc){const fee=N*avgFee(),inc=B.P.inc.reduce((t,i)=>t+incAmt(i,N),0),cost=B.P.lines.reduce((t,l)=>t+amt(l,N,sc),0),rev=fee+inc,cut=rev*(+B.P.base.cut.pct||0)/100;return {N,fee,inc,rev,cost,pro:rev-cost,cut,after:rev-cost-cut}}
function bep(hf){const keep=B.P.base.hotelFix;B.P.base.hotelFix=hf;let r=0;for(let N=1;N<=3000;N++){if(calc(N,true).pro>=0){r=N;break}}B.P.base.hotelFix=keep;return r}
const nowAmt=l=>l.paid!==''&&l.paid!=null?+l.paid:l.conf!==''&&l.conf!=null?+l.conf:amt(l);
function liveTypes(){const m={};(S.D.subs||[]).forEach(sb=>sb.ppl.forEach(p=>{if(p.status!=='정상')return;const k=p.id.slice(sb.no.length+1),i=(sb.form&&sb.form.info&&sb.form.info[k])||{};const t=p.type||i.type||'';if(t)m[t]=(m[t]||0)+1}));return m}
const liveN=()=>Object.values(liveTypes()).reduce((t,v)=>t+v,0);
const liveTeach=()=>{const m=liveTypes();return T_TEACH.reduce((t,k)=>t+(m[k]||0),0)};

/* ---------- 공통 조각 ---------- */
const tile=(k,v,s,cls)=>`<div class="tile ${cls||''}"><span class="k">${k}</span><span class="v">${v}</span><span class="s">${s||''}</span></div>`;
const nIn=(attr,v,w,ph)=>`<input type="text" inputmode="decimal" class="num" ${attr} value="${esc(fmt(v))}" style="width:${w||110}px"${ph?` placeholder="${esc(ph)}"`:''}>`;
const pill=()=>dirty()?'<span class="pill due">저장 안 한 변경 있음</span><button class="btn small ghost" type="button" data-breset="1">되돌리기</button>':'<span class="pill ok">저장됨</span>';
function bar(title,sub){return `<div class="panel"><div class="spread"><div><b>${title}</b> <span class="hint">${sub}</span></div>
  <div class="row" style="gap:6px"><span id="bDirty" class="row" style="gap:6px">${pill()}</span><button class="btn small" type="button" data-breload="1">새로 불러오기</button><button class="btn small primary" type="button" data-bsave="1">저장</button></div></div>
  ${B.D.seeded?'<p class="hint" style="margin:8px 0 0">아직 저장한 예산이 없어서 <b>2027 겨울 리솜 견적(26.10.21)</b> + <b>26 겨울 결산 실지출</b>로 채운 초안을 보여 드려요. 고친 뒤 「저장」을 누르면 시트 「예산결산」에 남아요.</p>':''}
  ${B.D.err?`<p class="err">${esc(B.D.err)} · 초안을 대신 보여 드려요.</p>`:''}</div>`}
function view(kind){
  if(!B.D){if(!B.L&&!B.err)setTimeout(load,0);return B.err?`<div class="panel"><span class="err">예산 · 결산을 불러오지 못했어요 · ${esc(B.err)}</span> <button class="btn small" type="button" data-breload="1">다시</button></div>`:'<div class="panel hint">예산 · 결산을 불러오고 있어요…</div>'}
  return `<div class="bud">${kind==='plan'?vPlan():vSet()}</div>`}

/* ---------- 예산 계획 ---------- */
function vPlan(){const b=B.P.base,c=calc(nb(),true),e1=bep(true),e2=bep(false),avg=avgFee();
  const S2=[['cost','지출 계획'],['inc','수입 계획'],['ppl','인원별 손익'],['set','기본 값']];
  return bar('예산 계획',`참가비는 캠프 설정에서 불러오고, 예상 인원과 지출 줄을 채우면 인원별로 얼마가 남는지 바로 계산돼요`)+
  `<div class="tiles">${tile('예상 인원 (유료 참가자)',nb()+'명',`평균 참가비 ${W(avg)} · 캠프 설정 학생 1차 ${W(fee1('학생'))}`)}
    ${tile('예상 수입',W(c.rev),`참가비 ${W(c.fee)} · 그 밖 ${W(c.inc)}`)}
    ${tile('예상 지출',W(c.cost),`1인당 ${W(c.cost/nb())}`)}

    ${tile('손익분기 인원',e1?e1+'명':'-',`호텔 ${b.hotelFix?'계약대로 고정':'인원 따라 조정'} · ${b.hotelFix?`호텔도 조정하면 ${e2?e2+'명':'-'}`:`호텔 고정이면 ${bepFix()}`}`,e1>nb()?'warn':'')}</div>

    call('adminConfirm',[items],r=>{S.sel={};setData(r);toast(items.length+'명 입금 확인 · '+kday(dt))});return}
});
function rpPicked(){return [...document.querySelectorAll('[data-rpsel]')].filter(x=>x.checked).map(x=>x.dataset.rpsel)}
function rpCount(){const n=rpPicked().length,all=document.querySelectorAll('[data-rpsel]');const c=document.getElementById('rpCnt');if(c)c.textContent=n+'명 선택';const a=document.getElementById('rpAll');if(a)a.checked=all.length>0&&n===all.length}
document.addEventListener('change',e=>{const el=e.target;
  if(el.id==='rpAll'){document.querySelectorAll('[data-rpsel]').forEach(x=>{x.checked=el.checked;S.rpSel[x.dataset.rpsel]=el.checked});rpCount();return}
  if(el.dataset&&el.dataset.rpsel){S.rpSel[el.dataset.rpsel]=el.checked;rpCount();return}
  if(el.dataset.sel){S.sel[el.dataset.sel]=el.checked;S.bulkD=val('bulkD')||S.bulkD;render();return}
  if(el.id==='bulkD'){S.bulkD=el.value}});
document.addEventListener('toggle',e=>{const d=e.target.dataset||{};if(d.sub)S.open[d.sub]=e.target.open;
  if(d.acad!==undefined&&S.openA[d.acad]!==e.target.open){S.openA[d.acad]=e.target.open;render()}
  if(d.rnd!==undefined&&S.openR[d.rnd]!==e.target.open){S.openR[d.rnd]=e.target.open;render()}},true);
document.addEventListener('input',e=>{if(e.target.id==='conq'){S.conq=e.target.value;const p=e.target.selectionStart;render();const n=document.getElementById('conq');if(n){n.focus();n.setSelectionRange(p,p)}return}});
document.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;const p=e.target.selectionStart;render();const n=document.getElementById('q');n.focus();n.setSelectionRange(p,p)}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&/^(lpw|lid|lnm|lph)$/.test(e.target.id))document.getElementById('doLogin').click()});
(function(){let t='';try{t=sessionStorage.getItem('campAdmTok')||''}catch(x){}
  if(t){S.tok=t;let id='';try{id=sessionStorage.getItem('campAdmId')||''}catch(x){}document.getElementById('who').textContent=id?'관리자 '+id:'';call('adminData',[],setData,'불러오고 있어요…')}
  else{/* 테스트(STG): 설정에 「관리자 자동 로그인 = 예」면 바로 들어감 */google.script.run.withSuccessHandler(r=>{if(!r||!r.ok)return;S.tok=r.token;try{sessionStorage.setItem('campAdmTok',r.token);sessionStorage.setItem('campAdmId',r.id)}catch(x){}document.getElementById('who').textContent='관리자 '+r.id+' (테스트 자동 로그인)';setData(r)}).withFailureHandler(()=>{}).adminAuto()}})();
render();
</script>
</body></html>
