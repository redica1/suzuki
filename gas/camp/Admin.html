.act .tgs.on{background:var(--rosin);border-color:var(--rosin);color:#fff;font-weight:600}.act .tgs:focus-visible{outline:2px solid var(--accent)}.act .tgline{color:var(--accent);font-weight:600}
.act .panel{display:grid;gap:12px}.act .panel .cap{font-size:12.5px;color:var(--faint);margin:-6px 0 0}.act h2{font-family:var(--display);font-size:20px;margin:0}.act .pill.mute{background:var(--sunk);color:var(--muted)}.act .pill.info{background:var(--accent-soft);color:var(--accent)}.act input[type=text],.act input[type=search],.act input[type=number],.act select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 9px;min-width:0;font:inherit;color:inherit}.act .tbl table{border-collapse:collapse;width:100%;font-size:13.5px}.act .tbl th,.act .tbl td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}.act .tbl th{font-size:12px;color:var(--muted);background:var(--sunk)}.act td.r,.act th.r{text-align:right}.act .err{color:var(--bad)}

.act .rtile:hover{border-color:var(--accent)}.act .rtile.on{outline:2px solid var(--accent);outline-offset:1px}

.act .rtile b{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.act .rtile b small{font-weight:500;color:var(--muted)}
.act .rtile.cls{border-left:4px solid var(--accent)}.act .rtile.fam{background:var(--accent-soft)}.act .rtile.prof{background:var(--rosin-soft)}.act .rtile.etc{background:var(--sunk)}.act .rtile.empty{background:transparent;border-style:dashed}

<body>
<div class="band"><div class="wrap">
  <h1>2027 스즈키 겨울 음악제 · 접수 관리</h1>
  <div class="meta"><span>입금 확인 · 입금 신고 대조 · 환불 처리</span><span id="who"></span><span id="sync"></span></div>
  <nav class="tabs" id="tabs" role="tablist"></nav>
</div></div>
<nav class="wrap tabs2" id="tabs2" role="tablist" aria-label="세부 메뉴"></nav>
<main class="wrap" id="app"></main>
<div class="toast" id="toast" hidden></div>
<div class="busy" id="busy" hidden></div>
<script>
const S={tok:'',tab:'home',q:'',open:{},sel:{},D:null,f:'all',rpSel:{},openA:{},openR:{}};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const won=n=>(+n||0).toLocaleString('ko-KR')+'원';
const kday=d=>{if(!d)return '';const [y,m,dd]=String(d).slice(0,10).split('-');return `${+m}월 ${+dd}일`};
const pAmt=p=>(+p.fee||0)+(+p.lesson||0)+(+p.dues||0)+(+p.room||0);
const btCls=n=>'bt'+(((n||1)-1)%6+1);
const repRow=p=>p.rep&&(p.rep.rows&&p.rep.rows[p.id]||(p.rep.ids?{name:p.rep.name,date:p.rep.date,a:p.rep.amt}:null));
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2800)}
function busy(on,m){const b=document.getElementById('busy');b.textContent=m||'저장하고 있어요…';b.hidden=!on}
/* 접속이 몰리면(BUSY) 자동으로 다시 보냄 · 로그인이 끝났으면 로그인 화면으로 */
function call(fn,args,ok,msg,tries){if(roBlock(fn)){toast(RO_MSG);return}tries=tries||0;busy(true,msg);google.script.run.withSuccessHandler(r=>{busy(false);ok&&ok(r)}).withFailureHandler(e=>{const m=(e&&e.message)||String(e);
  if(/BUSY|lock|timed out|timeout|network|네트워크|시간 초과/i.test(m)&&tries<4){busy(true,'접속이 많아 다시 보내고 있어요… ('+(tries+1)+'/4)');setTimeout(()=>call(fn,args,ok,msg,tries+1),1500*(tries+1));return}
  busy(false);if(/로그인이 끝났/.test(m)){try{sessionStorage.removeItem('campAdmTok')}catch(x){}S.tok='';S.D=null;render();toast('로그인 시간이 끝났어요. 다시 로그인해 주세요.');return}
  toast('안 됐어요 · '+(/BUSY/.test(m)?'지금 접속이 많아요. 잠시 뒤 다시 해 주세요.':m))})[fn](S.tok,...args)}
function goTab(t){if(!t)return;if(t==='staff'&&S.tab!=='staff'){S.SF=null;S.sf=null}if((t==='camp'||t==='cons')&&S.tab!==t&&!ccDirty())S.cc=null;if(t==='cons'){S.consR=null;S.consL=0}if(t==='schol'&&S.tab!=='schol'&&!scDirty()){S.SC=null;S.sc=null}if(S.tab==='act'&&t!=='act')ACT.flush();if(S.tab==='con'&&t!=='con')CORD.flush();S.tab=t;render()}
/* 한글 입력: 글자를 조합하는 동안에는 다시 그리지 않음 (다시 그리면 「ㅎㅏㄴ」처럼 깨짐) → 조합이 끝나면 한 번 */
document.addEventListener('input',e=>{if(e.isComposing&&e.target.matches&&e.target.matches('input[type=search],input[type=text]'))e.stopImmediatePropagation()},true);
document.addEventListener('compositionend',e=>{const t=e.target;if(t.matches&&t.matches('input[type=search],input[type=text]'))setTimeout(()=>{if(document.body.contains(t))t.dispatchEvent(new Event('input',{bubbles:true}))},0)},true);
function whoTxt(){const m=S.D&&S.D.me,w=document.getElementById('who');if(!m||!w)return;w.textContent=m.sup?(/자동/.test(m.name)?'관리자 '+m.name.replace('(자동)','')+' (테스트 자동 로그인)':'총관리자 '+m.name):'담당자 '+m.name+' 선생님'}
function setData(d){if(Array.isArray(d.scholar)&&typeof SCHOLAR!=='undefined'){SCHOLAR.length=0;d.scholar.forEach(t=>SCHOLAR.push(t))}if(S.D){if(!d.me&&S.D.me)d.me=S.D.me;if(!d.camp&&S.D.camp)d.camp=S.D.camp}S.D=d;applyCampAdm(d.camp);whoTxt();document.getElementById('sync').textContent='불러온 시각 '+new Date().toTimeString().slice(0,5);render()}
function ask(title,body,ok,okLabel,input){const bg=document.createElement('div');bg.className='askbg';
  bg.innerHTML=`<div class="askbox" role="dialog" aria-modal="true"><b style="font-size:16px">${title}</b><div>${body}</div>${input?`<input type="text" id="askIn" placeholder="${esc(input)}">`:''}<div class="row" style="justify-content:flex-end"><button class="btn ghost" type="button" data-x>취소</button><button class="btn primary" type="button" data-ok>${okLabel||'확인'}</button></div></div>`;
  document.body.appendChild(bg);bg.addEventListener('click',e=>{if(e.target===bg||e.target.dataset.x!==undefined)bg.remove();else if(e.target.dataset.ok!==undefined){const v=input?document.getElementById('askIn').value.trim():'';bg.remove();ok(v)}});}

/* ---------- 계산 ---------- */
function people(){const L=[];(S.D?S.D.subs:[]).forEach(sb=>sb.ppl.forEach(p=>L.push({sb,p})));return L}
function stats(){const P=people(),live=P.filter(x=>x.p.status==='정상');
  const bill=live.reduce((t,x)=>t+pAmt(x.p),0),paid=P.reduce((t,x)=>t+(+x.p.paidAmt||0),0);
  return {subs:(S.D?S.D.subs:[]).length,n:live.length,bill,paid,left:Math.max(0,bill-paid),rp:live.filter(x=>x.p.pay==='신고').length,
    cx:(S.D?S.D.cx:[]).filter(c=>c.state==='요청'||c.state==='환불 예정').length,cxW:(S.D?S.D.cx:[]).filter(c=>c.state==='요청').length,cxP:(S.D?S.D.cx:[]).filter(c=>c.state==='환불 예정').length,q:(S.D&&S.D.issues||[]).filter(x=>x.state!=='해결').length,acads:[...new Set(live.map(x=>x.sb.acad))].length,unpaid:live.filter(x=>pAmt(x.p)-(+x.p.paidAmt||0)>0).length,over:live.filter(x=>(+x.p.paidAmt||0)>pAmt(x.p)),overAmt:live.reduce((t,x)=>t+Math.max(0,(+x.p.paidAmt||0)-pAmt(x.p)),0)}}
function payPill(p){if(p.status!=='정상')return p.status==='취소요청'?'<span class="pill due">취소 요청</span>':`<span class="pill">취소${p.refund?(p.refund.date?' · 환불 '+kday(p.refund.date):' · 환불 예정 '+won(p.refund.amt)):p.cxAt?' · 입금 전 '+kday(String(p.cxAt).slice(0,10)):''}</span>`;
  const d=pAmt(p)-(+p.paidAmt||0);if(p.pay==='신고')return `<span class="pill new">${+p.paidAmt?'차액 신고 · 확인 전':'신고 · 확인 전'}</span>`;
  return !(+p.paidAmt)?'<span class="pill due">입금 전</span>':d>0?`<span class="pill due">차액 ${won(d)}</span>`:d<0?`<span class="pill new">${won(-d)} 더 냄${p.ovReq?' · 돌려받기 요청':''}</span>`:'<span class="pill ok">입금 확인</span>'}

/* ---------- 화면 ---------- */
/* GNB: 1단(묶음) › 2단(메뉴). 권한은 2단 메뉴마다 · 아래 메뉴가 다 「없음」이면 묶음도 숨김 */
const GROUPS=[['dash','대시보드',['home']],['ops','운영관리',['subs','rp','cx','schol','q']],['sch','스케줄관리',['act','tt','ens','con']],['room','방배정',['room']],['stat','통계',['stat']],['cfg','설정',['camp','cons','prof','staff']]];
const SUBL={home:'대시보드',subs:'접수 · 입금 확인',rp:'입금 신고',cx:'취소 · 환불',q:'오류 · 건의',act:'교사 일정',tt:'개인레슨',ens:'앙상블',con:'오후음악회',room:'방배정',stat:'통계',schol:'장학금',cons:'동의서',camp:'캠프 설정',prof:'교수진',staff:'담당자'};
const groupOf=t=>(GROUPS.find(g=>g[2].includes(t))||GROUPS[0]);
const TABS=[['home','한눈에'],['subs','접수 · 입금 확인'],['rp','입금 신고'],['cx','취소 · 환불'],['ens','앙상블'],['prof','교수진'],['act','교사 일정'],['tt','개인레슨'],['room','방 배정'],['con','오후음악회'],['stat','통계'],['q','오류·건의'],['schol','장학금']];
function render(){
  const app=document.getElementById('app'),tabs=document.getElementById('tabs');
  if(!S.D){tabs.innerHTML='';document.getElementById('tabs2').innerHTML='';app.innerHTML=vLogin();return}
  const st=stats();
  const VT=visTabs();if(!VT.some(([k])=>k===S.tab))S.tab=VT.length?VT[0][0]:'home';
  if(!VT.length){tabs.innerHTML='';document.getElementById('tabs2').innerHTML='';app.innerHTML='<div class="panel hint">아직 볼 수 있는 메뉴가 없어요. 총관리자에게 권한을 받아 주세요.</div>';return}
  const vis=new Set(VT.map(x=>x[0])),cntOf=k=>k==='rp'?st.rp:k==='cx'?st.cx:k==='q'?st.q:k==='room'?famReqOpen():0,badge=n=>n?`<span class="cnt">${n}</span>`:'';
  const cur=groupOf(S.tab);S.lastSub=S.lastSub||{};S.lastSub[cur[0]]=S.tab;
  const G=GROUPS.map(([g,l,ks])=>[g,l,ks.filter(k=>vis.has(k))]).filter(x=>x[2].length);
  tabs.innerHTML=G.map(([g,l,ks])=>`<button type="button" role="tab" data-g="${g}"${GROUPS.find(x=>x[0]===g)[2].length===1?` data-tab="${ks[0]}"`:''} aria-selected="${cur[0]===g}">${l}${badge(ks.reduce((t,k)=>t+cntOf(k),0))}</button>`).join('');
  /* 2단: 묶음마다 만들어 두고 지금 묶음만 보임 (메뉴가 하나뿐인 묶음은 2단 없음) */
  document.getElementById('tabs2').innerHTML=G.filter(([g,l,ks])=>ks.length>1||GROUPS.find(x=>x[0]===g)[2].length>1).map(([g,l,ks])=>`<span class="grp" data-grp="${g}" ${cur[0]===g?'':'hidden'} style="display:${cur[0]===g?'contents':'none'}">${ks.map(k=>`<button type="button" role="tab" data-tab="${k}" aria-selected="${S.tab===k}">${SUBL[k]}${badge(cntOf(k))}</button>`).join('')}</span>`).join('');
  /* 지금 묶음에 2단이 없으면 빈칸으로 → 줄이 안 보임 */
  document.getElementById('tabs2').classList.toggle('none',!document.querySelector('#tabs2 .grp:not([hidden])'));
  const ro=RO();app.classList.toggle('ro',ro);
  app.innerHTML=(ro?`<div class="robar">보기만 할 수 있는 메뉴예요 · 바꿔도 저장되지 않아요 (총관리자에게 「편집」 권한을 받으면 저장돼요)</div>`:'')+{home:vHome,subs:vSubs,rp:vRp,cx:vCx,ens:vEns,prof:vProf,act:()=>ACT.view(),tt:()=>LES.view(),room:()=>ROOM.view(),con:vCon,stat:vStat,q:vQ,camp:vCamp,staff:vStaff,cons:vCons,schol:vSchol}[S.tab]();
  if(S.tab==='stat'||S.tab==='home')reSort();
}
/* 통계 표 정렬: 같은 보기·같은 표면 다시 그려도 유지 */
const sigOf=t=>(S.sv||'acad')+'|'+[...t.querySelectorAll('thead th')].map(x=>x.textContent.replace(/\s*[▲▼]$/,'')).join('/');
const cellVal=td=>{const s=(td?td.textContent:'').trim();if(s===''||s==='-')return 0;return /^-?[\d,.\s]+(원|명|건|%|회)?$/.test(s)?+s.replace(/[^\d.-]/g,'')||0:s};
function sortTbl(t,c,d){const tb=t.tBodies[0];if(!tb)return;const foot=[...tb.rows].filter(r=>r.classList.contains('foot'));const R=[...tb.rows].filter(r=>!r.classList.contains('foot'));
  R.sort((x,y)=>{const a=cellVal(x.cells[c]),b=cellVal(y.cells[c]);const v=typeof a==='number'&&typeof b==='number'?a-b:String(a).localeCompare(String(b),'ko',{numeric:true});return d==='asc'?v:-v});
  R.concat(foot).forEach(r=>tb.appendChild(r));t.querySelectorAll('thead th').forEach((th,i)=>{const s=th.querySelector('.sarr');if(s)s.textContent=i===c?(d==='asc'?' ▲':' ▼'):'';th.setAttribute('aria-sort',i===c?(d==='asc'?'ascending':'descending'):'none')})}
function reSort(){const M=S.statSort||{};document.querySelectorAll('#app table.sortable').forEach(t=>{const m=M[sigOf(t)];if(m)sortTbl(t,m.c,m.d)})}
document.addEventListener('click',e=>{const th=e.target.closest&&e.target.closest('table.sortable th[data-sc]');if(!th)return;const t=th.closest('table'),c=+th.dataset.sc,k=sigOf(t);
  S.statSort=S.statSort||{};const cur=S.statSort[k];const d=cur&&cur.c===c?(cur.d==='desc'?'asc':'desc'):(c===0?'asc':'desc');S.statSort[k]={c,d};sortTbl(t,c,d)});
function vLogin(){const m=S.lmode||'sup';return `<div class="panel login"><h2 style="font-family:var(--display);font-size:19px;margin:0 0 10px">관리자 로그인</h2>
  <div class="row lmode" role="tablist" style="gap:6px;margin-bottom:10px"><button class="btn small ${m==='sup'?'primary':''}" type="button" data-lmode="sup" aria-pressed="${m==='sup'}">총관리자</button><button class="btn small ${m==='stf'?'primary':''}" type="button" data-lmode="stf" aria-pressed="${m==='stf'}">담당 선생님</button></div>
  ${m==='sup'?`<label>아이디<input type="text" id="lid" autocomplete="username" value="admin"></label>
  <label>비밀번호<input type="password" id="lpw" autocomplete="current-password"></label>`:`<label>이름<input type="text" id="lnm" autocomplete="name" placeholder="회원 명단의 이름"></label>
  <label>휴대전화<input type="tel" id="lph" inputmode="tel" autocomplete="tel" placeholder="010-0000-0000"></label>`}
  <p class="err" id="lerr"></p><button class="btn primary" type="button" id="doLogin" style="width:100%;justify-content:center">들어가기</button>
  <p class="hint">${m==='sup'?'아이디·비밀번호는 접수 DB 시트의 「설정」 탭에서 정해요.':'총관리자가 「담당자」에 등록한 교사 회원만 들어올 수 있어요. 메뉴는 받은 권한만큼 보여요.'}</p></div>`}
function vHome(){const st=stats();const t=(k,v,s,w,cls)=>`<div class="tile ${w?'warn':''} ${cls||''}"><span class="k">${k}</span><span class="v">${v}</span><span class="s">${s||''}</span></div>`;
  const L=statRows(),T=L.filter(x=>T_TEACH.includes(x.type)),Sx=L.filter(x=>T_PLAY.includes(x.type)),fam=L.length-T.length-Sx.length;
  const ins=[...new Set([...T,...Sx].map(x=>x.inst||'미정'))].sort(instSort);
  const live=people().filter(x=>x.p.status==='정상');const rp=live.filter(x=>x.p.pay==='신고');const rpAmt=rp.reduce((s,x)=>s+((repRow(x.p)||{}).a||0),0);
  const CX=(S.D.cx||[]).filter(c=>c.why!=='차액 환불'||true),sumCx=k=>CX.filter(c=>c.state===k).reduce((s,c)=>s+(+c.amt||0),0),nCx=k=>CX.filter(c=>c.state===k).length;
  return `<div class="hsec"><h3>인원 <span class="hint">취소한 사람 빼고 · 통계와 같은 기준</span></h3><div class="tiles">

function tgNorm(L){const M={};(L||[]).forEach(t=>{const o=tkP(t);if(!o)return;const c=M[o.bk]||(M[o.bk]={bk:o.bk,A:false,B:false,all:false,up:false});if(!o.pt)c.all=true;if(o.pt.includes('A'))c.A=true;if(o.pt.includes('B'))c.B=true;if(o.up)c.up=true});

  A.unav=r.unav||{};A.req=r.req||{};A.target=r.target||{min:2,max:6};A.log=r.log||[];REV=r.rev||0;DIRTY=false;PEND=[];
  if(A.day>=D.days.length)A.day=0;ST=stats()}
function payload(){return {rev:REV,kinds:D.kinds,stages:D.stages,roleSets:D.roleSets,tgSongs:D.tgSongs,days:D.days,rooms:D.rooms,meals:D.meals,rows:D.rows||{},events:D.events,people:D.people,unav:A.unav,req:A.req,target:A.target,log:PEND.slice()}}
function save(){CHG++;DIRTY=true;clearTimeout(TIMER);TIMER=setTimeout(()=>flush(),1500);stat()}
function flush(after){if(SAVING){setTimeout(()=>flush(after),500);return}if(!DIRTY){after&&after();return}
  SAVING=true;clearTimeout(TIMER);const body=payload();const sent=body.log.length,sentChg=CHG;stat();
  run('schedSave',[body],r=>{SAVING=false;
    if(r&&r.conflict){toast(r.msg||'다른 화면에서 먼저 고쳤어요. 최신 내용으로 다시 불러왔어요.');applyData(r);render();return}
    REV=r.rev;PEND.splice(0,sent);DIRTY=CHG!==sentChg;if(DIRTY){clearTimeout(TIMER);TIMER=setTimeout(()=>flush(),800)}LASTSAVE=new Date().toTimeString().slice(0,5);stat();after&&after()},
    m=>{SAVING=false;stat('저장 못 함 · '+m);toast('교사 일정을 저장하지 못했어요 · '+m)})}
function stat(m){const el=document.getElementById('a_stat');if(!el)return;el.className='pill '+(m?'bad':SAVING||DIRTY?'due':'ok');el.textContent=m||(SAVING?'저장하고 있어요…':DIRTY?'고친 내용 저장 대기':LASTSAVE?'저장됨 '+LASTSAVE:'시트와 같음')}
window.addEventListener('beforeunload',e=>{if(DIRTY||SAVING){e.preventDefault();e.returnValue=''}});
const P=()=>D.people; const pBy=id=>D.people.find(p=>p.id===id);
/* 사람은 고유번호(T001…)로 연결. 화면에는 이름, 같은 이름이 또 있으면 소속을 붙임 */
const NAME=id=>(pBy(id)||{n:id}).n;
const dupOf=id=>{const p=pBy(id);return p&&D.people.some(q=>q.id!==id&&q.n===p.n)};
const TAG=id=>{const p=pBy(id);if(!p||!dupOf(id))return '';return (p.kind==='연수생'?'연수생':(p.acad||'').split(' · ')[0].replace(/스즈키$/,''))||p.inst||p.id};
const LB=id=>NAME(id)+(TAG(id)?' · '+TAG(id):'');
const LBH=id=>esc(NAME(id))+(TAG(id)?` <small class="dtag">${esc(TAG(id))}</small>`:'');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mins=t=>{const [h,m]=t.split(':').map(Number);return h*60+m};
const hhmm=n=>`${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`;
/* 시·분 입력: 시는 고르고 분은 0~59 직접 입력 */
function hmIn(id,v,label){const [h,m]=(v||'09:00').split(':');
  return `<span class="hm" style="display:inline-flex;gap:3px;align-items:center"><select id="${id}_h" aria-label="${label} 시">${Array.from({length:17},(_,i)=>String(i+6).padStart(2,'0')).map(x=>`<option ${x===h?'selected':''}>${x}</option>`).join('')}</select><span>:</span><input type="number" id="${id}_m" value="${m}" min="0" max="59" step="1" inputmode="numeric" aria-label="${label} 분" style="width:58px"></span>`}
function hmVal(id){const h=document.getElementById(id+'_h'),m=document.getElementById(id+'_m');if(!h||!m)return '';const mm=Math.max(0,Math.min(59,parseInt(m.value,10)||0));return `${h.value}:${String(mm).padStart(2,'0')}`}
const TIMES10=[];for(let t=7*60;t<=22*60;t+=10)TIMES10.push(hhmm(t));
const locOf=(d,room)=>((D.rooms[d]||[]).find(r=>r[0]===room)||[])[1]||'';
const evById=id=>D.events.find(e=>e.id===id);
const short=n=>n.length>14?n.split(/[ ,]+/).filter(Boolean).slice(-1)[0]:n;
function logIt(t){A.log.unshift({at:new Date().toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}),t});A.log=A.log.slice(0,300);PEND.push(t);save()}

/* ---------- 계산: 횟수 · 겹침 · 못 오는 날 ---------- */
function stats(){
  const st={};const get=n=>st[n]||(st[n]={n,days:D.days.map(()=>0),roles:{},cats:{},total:0,items:[]});
  D.events.forEach(e=>e.ppl.forEach(p=>{if(gone(p.n))return;const x=get(p.n);x.days[e.d]=(x.days[e.d]||0)+1;x.roles[p.r]=(x.roles[p.r]||0)+1;x.cats[e.cat]=(x.cats[e.cat]||0)+1;x.total++;x.items.push({e,r:p.r})}));
  const clash=new Set(); // `${eid}|${name}`
  Object.values(st).forEach(x=>{for(let i=0;i<x.items.length;i++)for(let j=i+1;j<x.items.length;j++){const a=x.items[i].e,b=x.items[j].e;
    if(a.d===b.d&&mins(a.s)<mins(b.e)&&mins(b.s)<mins(a.e)){clash.add(a.id+'|'+x.n);clash.add(b.id+'|'+x.n);x.clash=(x.clash||0)+1}}});
  const off=new Set(); Object.values(st).forEach(x=>x.items.forEach(({e})=>{if((A.unav[x.n]||[]).includes(e.d)){off.add(e.id+'|'+x.n);x.off=(x.off||0)+1}}));
  return {st,clash,off};
}
let ST={st:{},clash:new Set(),off:new Set()};
function refresh(){ST=stats();save();render()}

/* ---------- 프로그램표 (장소 × 시간) ---------- */
const TCLS={레슨:'t-les',오케스트라:'t-orc',오후음악회:'t-con',음악회:'t-con',리허설:'t-reh',특별수업:'t-spe',교사연수:'t-tt',대기:'t-reh'};
/* 접수 취소(환불 접수 · 입금 전 바로 취소)된 교사 · 명단에서 빠진 사람: 칸에는 흐리게 남고 횟수·겹침·통계에서 빠짐 */
const gone=id=>{const p=pBy(id);return !p||!!p.cx||!!p.out};
const goneTxt=id=>{const p=pBy(id);return p&&p.cx?'취소':'명단 밖'};
function chip(e,p,i){const k=e.id+'|'+p.n;if(gone(p.n))return `<button type="button" class="pchip gone" data-achip="${e.id}|${i}" title="${esc(LB(p.n))} · ${goneTxt(p.n)} — 이 칸에서 빼고 다른 분을 넣어 주세요"><span class="rl">${p.r}</span>${esc(short(NAME(p.n)))} (${goneTxt(p.n)})</button>`;const bad=ST.clash.has(k)?'겹침':ST.off.has(k)?'못 오는 날':'';
  const sw=A.swap&&A.swap.eid===e.id&&A.swap.i===i;
  return `<button type="button" class="pchip ${bad?'bad':''} ${sw?'swapping':''} r-${p.r}" data-achip="${e.id}|${i}" title="${esc(LB(p.n))} · ${p.r}${bad?' · '+bad:''}"><span class="rl">${p.r}</span>${esc(short(NAME(p.n)))}${TAG(p.n)?`<small class="dtag">${esc(TAG(p.n))}</small>`:''}</button>`}
function cellEv(e){const tt=tgTxt(e.tg);const first=[...(tt?[`<span class="tgline">${esc(tt)}</span>`]:[]),...e.desc.slice(0,tt?1:2).map(esc)].join('<br>');
  return `<div class="ev ${TCLS_C[e.cat]||''} ${e.cat==='공연'&&e.stage&&e.stage!=='본공연'?'stg2':''} ${A.sel===e.id?'on':''}" data-aev="${e.id}"><div class="evh"><b>${evLabel(e)}</b><span class="num tm">${e.s}~${e.e}</span></div>${first?`<small>${first}</small>`:''}<div class="chips2">${e.ppl.map((p,i)=>chip(e,p,i)).join('')}</div></div>`}
function vGrid(){
  const d=A.day, rooms=D.rooms[d]||[], evs=D.events.filter(e=>e.d===d), meals=D.meals.filter(m=>m.d===d);
  const extra=((D.rows||{})[d]||[]);
  const starts=[...new Set([...evs.map(e=>e.s),...meals.map(m=>m.s),...extra])].sort((a,b)=>mins(a)-mins(b));
  const nLes=evs.filter(e=>e.cat==='레슨').length, nP=new Set(evs.flatMap(e=>e.ppl.map(p=>p.n))).size;
  const bad=evs.flatMap(e=>e.ppl.filter(p=>ST.clash.has(e.id+'|'+p.n)||ST.off.has(e.id+'|'+p.n)).map(p=>p.n));
  return `<div class="sec-h"><div><h2>프로그램표</h2><p>장소 × 시간. 칸을 누르면 고치고, 빈 칸을 누르면 새 일정을 넣어요. 사람 칩의 「바꾸기」로 두 사람을 맞바꿔요.</p></div>
    <div class="row"><button class="btn small" type="button" id="a_reload">새로 불러오기</button></div></div>
  <div class="row"><div class="seg" role="group" aria-label="날짜">${D.days.map((x,i)=>`<button type="button" data-aday="${i}" aria-pressed="${d===i}">${x}</button>`).join('')}</div>
    <span class="pill info">일정 ${evs.length} · 레슨 ${nLes}</span><span class="pill mute">이날 나오는 사람 ${nP}명</span>${bad.length?`<span class="pill bad">겹침·못 오는 날 ${new Set(bad).size}명</span>`:'<span class="pill ok">겹침 없음</span>'}</div>
  ${A.swap?`<div class="note"><b>바꾸기</b> · ${esc(LB(evById(A.swap.eid).ppl[A.swap.i].n))} 선생님과 바꿀 사람 칩을 아무 날짜에서나 누르세요. <button class="btn small" type="button" id="a_swapX">취소</button></div>`:''}
  ${editor()}

  <div class="tt pgrid"><table><thead><tr><th class="tcol">시간</th>${rooms.map(([r,l])=>`<th>${esc(r)}<small>${esc(l)}</small></th>`).join('')}</tr></thead><tbody>
  ${starts.map(t=>{const ml=meals.filter(m=>m.s===t).map(m=>`<tr class="meal"><th class="tcol num">${t}</th><td colspan="${rooms.length}">${esc(m.t)} <span class="cap" style="margin:0">${m.s}~${m.e}</span></td></tr>`).join('');
    if(!evs.some(e=>e.s===t)&&!extra.includes(t)) return ml;
    return ml+`<tr><th class="tcol num">${t}${extra.includes(t)&&!evs.some(e=>e.s===t)?`<br><button type="button" class="btn small ghost" data-arowdel="${t}" aria-label="${t} 줄 빼기" style="padding:0 6px;font-size:11px">줄 빼기</button>`:''}</th>${rooms.map(([r])=>{const xs=evs.filter(e=>e.room===r&&e.s===t);
      const cont=!xs.length&&evs.some(e=>e.room===r&&mins(e.s)<mins(t)&&mins(t)<mins(e.e));
      return `<td class="${cont?'cont':''}">${xs.map(cellEv).join('')}${!xs.length?(cont?'<span class="cap">↑ 이어짐</span>':`<button type="button" class="addev" data-anew="${d}|${esc(r)}|${t}" aria-label="${esc(r)} ${t} 일정 넣기">+</button>`):''}</td>`}).join('')}</tr>`}).join('')}
  </tbody></table></div>`;
}
/* 고치는 칸 */
/* 사람 넣기: 역할을 먼저 고르고 → 이름을 「,」로 적거나 · 목록에서 체크해서 한꺼번에 */
function candRows(e){const q=A.pq.trim();const used=new Set(e.ppl.map(p=>p.n));
  return P().filter(p=>!gone(p.id)&&!used.has(p.id)&&(!q||p.n.includes(q)||(p.acad||'').includes(q)||(p.inst||'').includes(q)))
    .map(p=>{const x=ST.st[p.id]||{total:0,roles:{},cats:{},days:D.days.map(()=>0)};const busy=D.events.some(o=>o.id!==e.id&&o.d===e.d&&o.ppl.some(z=>z.n===p.id)&&mins(o.s)<mins(e.e)&&mins(e.s)<mins(o.e));const off=(A.unav[p.id]||[]).includes(e.d);return {p,x,busy,off}})
    .sort((a,b)=>(a.busy||a.off)-(b.busy||b.off)||a.x.total-b.x.total||a.p.n.localeCompare(b.p.n,'ko'))}
function addBox(e){const RL=roleList(e.cat);if(!A.addR||!RL.includes(A.addR))A.addR=e.ppl.length?(RL[1]||RL[0]):RL[0];const m=A.addM||'type';A.pck=A.pck||{};

    <span class="cap" style="margin:0">②</span><div class="seg" role="group" aria-label="넣는 방법"><button type="button" data-aaddm="type" aria-pressed="${m==='type'}">이름으로 입력</button><button type="button" data-aaddm="check" aria-pressed="${m==='check'}">목록에서 체크</button></div></div>
  ${m==='type'?`<div class="row" style="gap:6px;flex-wrap:nowrap"><input type="text" id="a_names" value="${esc(A.names||'')}" placeholder="이름을 쉼표(,)로 구분해 적어요 · 예: 황의한, 최진실, 이선화" autocomplete="off" style="flex:1"><button class="btn small primary" type="button" id="a_namesAdd">${esc(A.addR)}(으)로 넣기</button></div>

  :`<div class="row" style="gap:6px;flex-wrap:nowrap"><input type="search" id="a_pq" value="${esc(A.pq)}" placeholder="이름·학원·악기로 찾기 (적게 나온 사람이 위에)" autocomplete="off" style="flex:1"><button class="btn small primary" type="button" id="a_pckAdd" ${picked.length?'':'disabled'}>선택한 ${picked.length}명 ${esc(A.addR)}(으)로 넣기</button></div>
    <ul class="cands ckl">${candRows(e).slice(0,60).map(({p,x,busy,off})=>`<li><label class="${busy||off?'warn':''}"><input type="checkbox" data-apck="${esc(p.id)}" ${A.pck[p.id]?'checked':''}><span><b>${LBH(p.id)}</b> <small>${esc(p.inst||'')} · ${esc(p.acad||'')}${p.kind!=='교사'?' · '+p.kind:''}</small></span>
      <span class="row" style="gap:4px;flex-wrap:nowrap;margin-left:auto">${busy?'<span class="pill bad">이 시간 다른 일정</span>':''}${off?'<span class="pill bad">못 오는 날</span>':''}<span class="pill ${x.total?'mute':'due'}">${x.total?cnt3(x):'아직 0회'}</span></span></label></li>`).join('')||'<li class="cap" style="padding:8px">찾는 사람이 없어요.</li>'}</ul>`}</div>`}
/* 이름 → 사람: 띄어쓰기·대소문자 무시, 같은 이름이 여럿이면 고르게 */
function addPeople(e,ids,role){const have=new Set(e.ppl.map(p=>p.n));let n=0;const warn=[];

/* ---------- 교사별 횟수 ---------- */
function vCount(){
  const t=A.target, q=A.q.trim();
  const rows=P().filter(p=>!gone(p.id)).map(p=>({p,x:ST.st[p.id]||{days:D.days.map(()=>0),roles:{},cats:{},total:0}}))
    .filter(({p})=>A.trainee||p.kind!=='연수생').filter(({p})=>!q||p.n.includes(q)||(p.acad||'').includes(q));
  const main=x=>x.total||0;
  const flag=({p,x})=>x.clash?'clash':x.off?'off':main(x)===0?'zero':main(x)<t.min?'low':main(x)>t.max?'high':'';
  const F={all:()=>true,zero:r=>main(r.x)===0,low:r=>main(r.x)>0&&main(r.x)<t.min,high:r=>main(r.x)>t.max,clash:r=>r.x.clash,off:r=>r.x.off,noles:r=>!((r.x.cats||{})['레슨'])};
  const G=P().filter(p=>gone(p.id)).map(p=>{const x={days:D.days.map(()=>0),roles:{},cats:{},total:0};D.events.forEach(e=>e.ppl.forEach(z=>{if(z.n===p.id){x.days[e.d]++;x.roles[z.r]=(x.roles[z.r]||0)+1;x.cats[e.cat]=(x.cats[e.cat]||0)+1;x.total++}}));return {p,x}}).filter(r=>r.x.total>0);
  const n=k=>k==='gone'?G.length:rows.filter(F[k]).length;
  const L=(A.filter==='gone'?G:rows.filter(F[A.filter]||F.all)).sort((a,b)=>main(a.x)-main(b.x)||a.p.n.localeCompare(b.p.n,'ko'));
  return `<div class="sec-h"><div><h2>교사별 횟수</h2><p>레슨·공연·업무 횟수를 자동으로 세요 (역할별 숫자는 「교사별 일정」). 손으로 세던 메모를 대신해요. 못 오는 날을 체크하면 그날 들어간 칸이 빨갛게 보여요.</p></div></div>
  <div class="row"><span class="cap" style="margin:0">목표 (전체 횟수)</span><input type="number" id="a_tMin" value="${t.min}" min="0" style="width:60px" aria-label="최소">회 ~ <input type="number" id="a_tMax" value="${t.max}" min="0" style="width:60px" aria-label="최대">회
    <label class="checks"><label><input type="checkbox" id="a_trainee" ${A.trainee?'checked':''}>연수생도 보기</label></label>
    <input type="search" id="a_q" value="${esc(A.q)}" placeholder="이름·학원으로 찾기" style="width:min(220px,100%)"></div>
  <div class="row">${[['zero','0회'],['noles','레슨 0회'],['low','목표보다 적음'],['high','목표보다 많음'],['clash','겹침'],['off','못 오는 날 걸림'],['all','전체'],['gone','취소한 사람 (칸에 남음)']].map(([k,l])=>`<button class="btn small ${A.filter===k?'primary':''} ${k==='gone'&&G.length?'warnb':''}" type="button" data-afilter="${k}">${l} ${n(k)}</button>`).join('')}</div>
  <div class="tbl panel" style="padding:0"><table><thead><tr><th>이름</th><th>학원</th><th>악기</th>${D.days.map(x=>`<th class="r">${x.slice(0,4)}</th>`).join('')}<th class="r">레슨</th><th class="r">공연</th><th class="r">업무</th><th class="r">합계</th><th>상태</th><th>못 오는 날</th><th>요청·메모</th><th></th></tr></thead><tbody>
  ${L.map(r=>{const {p,x}=r,f=flag(r),c=x.cats||{};return `<tr><td><b>${LBH(p.id)}</b>${p.kind!=='교사'?` <span class="pill mute">${p.kind}</span>`:''}</td><td>${esc(p.acad||'')}</td><td>${esc(p.inst||'')}</td>
    ${x.days.map(v=>`<td class="r num">${v||'-'}</td>`).join('')}<td class="r num">${c['레슨']||'-'}</td><td class="r num">${c['공연']||'-'}</td><td class="r num">${c['업무']||'-'}</td><td class="r num"><b>${x.total||'-'}</b></td>
    <td>${gone(p.id)?`<span class="pill bad">${goneTxt(p.id)} · ${x.total}칸에 남음</span>`:f==='clash'?`<span class="pill bad">겹침 ${x.clash}</span>`:f==='off'?'<span class="pill bad">못 오는 날 배정</span>':f==='zero'?'<span class="pill due">0회</span>':f==='low'?'<span class="pill due">적음</span>':f==='high'?'<span class="pill info">많음</span>':'<span class="pill ok">맞음</span>'}</td>
    <td><span class="row" style="gap:6px;flex-wrap:nowrap">${D.days.map((dl,i)=>`<label class="dck" title="${dl} 못 옴"><input type="checkbox" data-aunav="${p.id}|${i}" ${(A.unav[p.id]||[]).includes(i)?'checked':''}>${dl.slice(2,4).replace('(','')}</label>`).join('')}</span></td>
    <td><input type="text" data-areq="${p.id}" value="${esc(A.req[p.id]||'')}" placeholder="예: 2권 교사 바꿔 주세요" style="width:170px" aria-label="${esc(p.n)} 요청"></td>
    <td><span class="row" style="gap:4px;flex-wrap:nowrap"><button class="btn small" type="button" data-awho="${p.id}">일정</button>${x.total?`<button class="btn small ghost" type="button" data-apull="${p.id}">모든 칸에서 빼기</button>`:''}</span></td></tr>`}).join('')||'<tr><td colspan="16" class="cap">해당하는 사람이 없어요.</td></tr>'}
  </tbody></table></div>`}

document.addEventListener('change',ev=>{if(S.tab!=='act'||ev.target.id!=='a_edK')return;const o=ev.target.selectedOptions[0],y=document.getElementById('a_edY');if(o&&y&&o.dataset.t)y.value=o.dataset.t});

  const s=hmVal('a_edS'),en=hmVal('a_edE'); if(s&&en&&mins(en)>mins(s)){e.s=s;e.e=en}else if(s&&en)toast('끝나는 시간이 시작보다 늦어야 해요');}

document.addEventListener('click',ev=>{if(S.tab!=='act'||!D)return;

      const pa=a.ppl[A.swap.i],pb=bb.ppl[+i];[pa.n,pb.n]=[pb.n,pa.n];
      logIt(`맞바꿈: ${D.days[a.d]} ${a.s} ${a.room} 「${a.title}」 ${pa.r} ↔ ${D.days[bb.d]} ${bb.s} ${bb.room} 「${bb.title}」 ${pb.r} · 이제 ${LB(pa.n)} / ${LB(pb.n)}`);

  if(b.id==='a_rowAdd'){const t=hmVal('a_rowT');A.rowT=t;const dd=A.day;D.rows=D.rows||{};const L=D.rows[dd]=D.rows[dd]||[];
    const has=D.events.some(e=>e.d===dd&&e.s===t)||L.includes(t);if(has){toast(`${t} 줄은 이미 있어요`);return}L.push(t);logIt(`시간 줄 추가: ${D.days[dd]} ${t}`);refresh();toast(`${D.days[dd]} ${t} 줄을 넣었어요 · 빈 칸의 +를 눌러 일정을 넣으세요`);return}

  if(d.anew){const [dd,room,t]=d.anew.split('|');const id='n'+Date.now();{const k0=kindsOf('레슨')[0]||D.kinds[0]||{n:'새 일정',c:'레슨'};D.events.push({id,d:+dd,room,s:t,e:hhmm(mins(t)+50),title:k0.n,sub:'',stage:k0.c==='공연'?(D.stages[0]||''):'',desc:[],cat:k0.c,type:k0.c,ppl:[]})}
    logIt(`새 일정: ${D.days[+dd]} ${t} ${room}`);A.sel=id;refresh();setTimeout(()=>{const k=document.getElementById('a_edK');if(k)k.focus()});return}
  if(b.id==='a_edClose'){A.sel=null;render();return}
  if(b.id==='a_edSave'){const e=evById(A.sel);readEditor(e);logIt(`고침: ${D.days[e.d]} ${e.s} ${e.room} 「${e.title}」`);refresh();toast('저장했어요');return}
  if(b.id==='a_edDel'){const e=evById(A.sel);if(!b.dataset.sure){b.dataset.sure='1';b.textContent='정말 지울까요? 한 번 더 누르세요';return}
    D.events.splice(D.events.indexOf(e),1);logIt(`지움: ${D.days[e.d]} ${e.s} ${e.room} 「${e.title}」${e.ppl.length?' ('+e.ppl.map(p=>LB(p.n)).join(', ')+')':''}`);A.sel=null;refresh();toast('일정을 지웠어요');return}
  if(b.id==='a_cpOther'){const e=evById(A.sel);readEditor(e);let n=0;D.days.forEach((_,dd)=>{if(dd===e.d)return;if((D.rooms[dd]||[]).some(r=>r[0]===e.room)&&!D.events.some(o=>o.d===dd&&o.room===e.room&&o.s===e.s)){D.events.push({...JSON.parse(JSON.stringify(e)),id:'n'+Date.now()+dd,d:dd,ppl:[]});n++}});
    logIt(`복사: 「${e.title}」 ${e.s} ${e.room} → 다른 날 ${n}곳`);refresh();toast(n?`다른 날 ${n}곳에 복사했어요 (사람은 비워 둠)`:'다른 날 같은 자리에 이미 일정이 있어요');return}
  if(b.id==='a_mainCopy'){const e=evById(A.sel);readEditor(e);const o=evById(document.getElementById('a_main').value);if(!o)return;

    const L=tgNorm(t.b).map(tkP);const i=L.findIndex(o=>o.bk===bk);

  if(b.id==='conCopy'){const t=S.conTSV||'';const done=()=>toast('표를 복사했어요 · 구글 시트 칸에 붙여넣기 하세요');
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(done,()=>{const x=document.createElement('textarea');x.value=t;document.body.appendChild(x);x.select();try{document.execCommand('copy');done()}catch(e){toast('복사하지 못했어요')}x.remove()});
    else{const x=document.createElement('textarea');x.value=t;document.body.appendChild(x);x.select();try{document.execCommand('copy');done()}catch(e){toast('복사하지 못했어요')}x.remove()}return}
  if(d.sv){S.sv=d.sv;render();return}
  if(d.sv2){S.sv2=d.sv2;render();return}
  if(d.sv3){S.sv3=d.sv3;render();return}

  if(d.ensopen){S.ensOpen=S.ensOpen===d.ensopen?'':d.ensopen;render();return}
  if(d.enssave){const g=k=>val('ee_'+k),c=k=>!!(document.getElementById('ee_'+k)||{}).checked;
    const p={group:g('group'),acads:g('acads').split(/[,，]/).map(x=>x.trim()).filter(Boolean),k1:g('k1'),c1:g('c1'),o1:g('o1'),acc1:c('acc1'),video1:c('video1'),k2:g('k2'),c2:g('c2'),o2:g('o2'),acc2:c('acc2'),video2:c('video2'),tm:g('tm').replace(/\D/g,''),ts:g('ts').replace(/\D/g,''),adminMemo:g('adminMemo')};

    if(+p.ts>59){toast('초는 59까지예요');return}
    const other=p.acads.filter(a=>(S.D.teams||[]).some(t=>t.no!==d.enssave&&(t.rep===a||(t.acads||[]).includes(a))));
    const go=()=>call('adminSaveEns',[d.enssave,p],r=>{setData(r);toast('앙상블 「'+p.group+'」 팀을 고쳤어요')});
    if(other.length)ask('다른 팀에도 들어 있는 학원이 있어요','<b>'+other.map(esc).join(', ')+'</b>은(는) 다른 팀에도 있어요. 그래도 저장할까요?',go,'그래도 저장');else go();return}
  if(b.id==='doLogin'&&S.lmode==='stf'){const nm=val('lnm'),ph=val('lph');busy(true,'확인하고 있어요…');
    google.script.run.withSuccessHandler(r=>{busy(false);if(!r.ok){document.getElementById('lerr').textContent=r.msg;return}S.tok=r.token;try{sessionStorage.setItem('campAdmTok',r.token);sessionStorage.removeItem('campAdmId')}catch(x){}setData(r)}).withFailureHandler(x=>{busy(false);document.getElementById('lerr').textContent=(x&&x.message)||String(x)}).staffLogin(nm,ph);return}
  if(b.id==='doLogin'){const id=val('lid'),pw=document.getElementById('lpw').value;busy(true,'확인하고 있어요…');
    google.script.run.withSuccessHandler(r=>{busy(false);if(!r.ok){document.getElementById('lerr').textContent=r.msg;return}S.tok=r.token;try{sessionStorage.setItem('campAdmTok',r.token);sessionStorage.setItem('campAdmId',id)}catch(x){}document.getElementById('who').textContent='관리자 '+id;setData(r)}).withFailureHandler(x=>{busy(false);document.getElementById('lerr').textContent=(x&&x.message)||String(x)}).adminLogin(id,pw);return}
  if(d.g){const g=GROUPS.find(x=>x[0]===d.g),vis=visTabs().map(x=>x[0]),L=(S.lastSub||{})[d.g];goTab(L&&vis.includes(L)?L:g[2].find(k=>vis.includes(k)));return}
  if(d.tab){goTab(d.tab);return}
  if(b.id==='reload'){call('adminData',[],setData,'불러오고 있어요…');return}
  if(d.f){S.f=d.f;render();return}
  if(d.mf){S.mf=d.mf;render();return}
  if(d.ok){confirmOne(d.ok);return}
  if(b.id==='rpSame'||b.id==='rpDayGo'){const ids=rpPicked();if(!ids.length){toast('먼저 사람을 선택해 주세요');return}const day=b.id==='rpDayGo'?val('rpDay'):'';if(b.id==='rpDayGo'&&!day){toast('넣을 날짜를 골라 주세요');return}
    ids.forEach(id=>{const el=document.getElementById('d_'+id);if(el)el.value=day||el.dataset.rdate||''});toast(ids.length+'명에게 '+(day?kday(day):'신고일')+'을(를) 넣었어요');return}
  if(b.id==='rpOkAll'){const ids=rpPicked();if(!ids.length){toast('먼저 사람을 선택해 주세요');return}
    const noD=ids.filter(id=>!val('d_'+id));if(noD.length){toast('통장 입금일이 빈 사람이 '+noD.length+'명 있어요. 「신고일 넣기」나 「날짜 넣기」를 먼저 눌러 주세요');const el=document.getElementById('d_'+noD[0]);if(el)el.focus();return}
    const noA=ids.filter(id=>!num('a_'+id));if(noA.length){toast('확인 금액이 빈 사람이 있어요');return}
    const items=ids.map(id=>({pid:id,date:val('d_'+id),amt:num('a_'+id),memo:''}));const sum=items.reduce((t,x)=>t+x.amt,0);
    ask(ids.length+'명 입금 확인할까요?','합계 '+won(sum)+' · 사람마다 고른 통장 입금일로 확인돼요.',()=>call('adminConfirm',[items],r=>{S.rpSel={};setData(r);toast(ids.length+'명 입금 확인했어요')}),'모두 확인');return}
  if(b.id==='rpRejAll'){const ids=rpPicked();if(!ids.length){toast('먼저 사람을 선택해 주세요');return}
    ask(ids.length+'명 입금 신고를 반려할까요?','선생님 화면에서 다시 「입금 전」이 되고 반려 사유가 보여요.',v=>{if(!v){toast('반려 사유를 적어 주세요');return}call('adminRejectReport',[ids,v],r=>{S.rpSel={};setData(r);toast(ids.length+'명 반려했어요')})},'모두 반려','반려 사유 (예: 통장에 없어요)');return}
  if(d.unok){ask('입금 확인을 취소할까요?','이 사람은 다시 「입금 전」(신고했으면 「신고 · 확인 전」)으로 돌아가요.',()=>call('adminConfirm',[[{pid:d.unok,date:'',amt:0,memo:val('m_'+d.unok)}]],r=>{setData(r);toast('입금 확인을 취소했어요')}),'확인 취소');return}
  if(d.same){const [pid,dt]=d.same.split('|');const el=document.getElementById('d_'+pid);if(el&&dt)el.value=dt;return}
  if(d.rej){ask('입금 신고를 반려할까요?','선생님 화면에서 이 사람이 다시 「입금 전」이 되고 반려 사유가 보여요.',v=>{if(!v){toast('반려 사유를 적어 주세요');return}call('adminRejectReport',[d.rej,v],r=>{setData(r);toast('반려했어요')})},'반려','반려 사유 (예: 통장에 없어요)');return}
  if(d.cxacc){const row=+d.cxacc,amt=num('ca_'+row),c=(S.D.cx||[]).find(x=>x.row===row)||{};
    ask(amt?'환불을 접수할까요?':'취소를 확정할까요?',amt?`<b>${esc(c.names||'')}</b> · 환불액 <b>${won(amt)}</b><br>${c.why==='차액 환불'?'참가는 그대로예요. ':'그 사람은 「취소 · 환불 예정」으로 바뀌어요. '}돈을 보낸 뒤 「환불 완료」에서 보낸 날을 넣어요.`:`<b>${esc(c.names||'')}</b> · 환불액 0원이라 송금 없이 바로 취소돼요.`,()=>call('adminRefund',[row,'접수','','',amt],r=>{setData(r);toast(amt?'환불 접수 · 송금 대기로 옮겼어요':'취소 확정')}),amt?'환불 접수':'취소 확정');return}
  if(d.cxok){const row=+d.cxok,dt=val('cd_'+row);if(!dt){toast('돈을 보낸 날짜를 먼저 선택해 주세요');document.getElementById('cd_'+row).focus();return}
    call('adminRefund',[row,'완료',dt,'',''],r=>{setData(r);toast('환불 완료 · '+kday(dt))});return}
  if(d.cxno){const row=+d.cxno;ask('취소 요청을 반려할까요?','그 사람은 다시 참가 상태로 돌아가요.',v=>call('adminRefund',[row,'반려','',v,''],r=>{setData(r);toast('반려했어요')}),'반려','반려 사유');return}
  if(b.id==='bulkClr'){S.sel={};render();return}
  if(b.id==='bulkOk'){const dt=val('bulkD');if(!dt){toast('입금일을 먼저 선택해 주세요');document.getElementById('bulkD').focus();return}
    const items=Object.keys(S.sel).filter(k=>S.sel[k]).map(pid=>{const x=people().find(y=>y.p.id===pid);const a=num('a_'+pid)||(x?Math.max(0,pAmt(x.p)-(+x.p.paidAmt||0)):0);return {pid,date:dt,amt:a,memo:val('m_'+pid)}}).filter(it=>it.amt>0);
    if(!items.length){toast('확인할 금액이 없어요');return}
    call('adminConfirm',[items],r=>{S.sel={};setData(r);toast(items.length+'명 입금 확인 · '+kday(dt))});return}
});
function rpPicked(){return [...document.querySelectorAll('[data-rpsel]')].filter(x=>x.checked).map(x=>x.dataset.rpsel)}
function rpCount(){const n=rpPicked().length,all=document.querySelectorAll('[data-rpsel]');const c=document.getElementById('rpCnt');if(c)c.textContent=n+'명 선택';const a=document.getElementById('rpAll');if(a)a.checked=all.length>0&&n===all.length}
document.addEventListener('change',e=>{const el=e.target;
  if(el.id==='rpAll'){document.querySelectorAll('[data-rpsel]').forEach(x=>{x.checked=el.checked;S.rpSel[x.dataset.rpsel]=el.checked});rpCount();return}
  if(el.dataset&&el.dataset.rpsel){S.rpSel[el.dataset.rpsel]=el.checked;rpCount();return}
  if(el.dataset.sel){S.sel[el.dataset.sel]=el.checked;S.bulkD=val('bulkD')||S.bulkD;render();return}
  if(el.id==='bulkD'){S.bulkD=el.value}});
document.addEventListener('toggle',e=>{const d=e.target.dataset||{};if(d.sub)S.open[d.sub]=e.target.open;
  if(d.acad!==undefined&&S.openA[d.acad]!==e.target.open){S.openA[d.acad]=e.target.open;render()}
  if(d.rnd!==undefined&&S.openR[d.rnd]!==e.target.open){S.openR[d.rnd]=e.target.open;render()}},true);
document.addEventListener('input',e=>{if(e.target.id==='conq'){S.conq=e.target.value;const p=e.target.selectionStart;render();const n=document.getElementById('conq');if(n){n.focus();n.setSelectionRange(p,p)}return}});
document.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;const p=e.target.selectionStart;render();const n=document.getElementById('q');n.focus();n.setSelectionRange(p,p)}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&/^(lpw|lid|lnm|lph)$/.test(e.target.id))document.getElementById('doLogin').click()});
(function(){let t='';try{t=sessionStorage.getItem('campAdmTok')||''}catch(x){}
  if(t){S.tok=t;let id='';try{id=sessionStorage.getItem('campAdmId')||''}catch(x){}document.getElementById('who').textContent=id?'관리자 '+id:'';call('adminData',[],setData,'불러오고 있어요…')}
  else{/* 테스트(STG): 설정에 「관리자 자동 로그인 = 예」면 바로 들어감 */google.script.run.withSuccessHandler(r=>{if(!r||!r.ok)return;S.tok=r.token;try{sessionStorage.setItem('campAdmTok',r.token);sessionStorage.setItem('campAdmId',r.id)}catch(x){}document.getElementById('who').textContent='관리자 '+r.id+' (테스트 자동 로그인)';setData(r)}).withFailureHandler(()=>{}).adminAuto()}})();
render();
