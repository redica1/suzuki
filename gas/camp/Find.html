function ask(){var box=$('aout');box.innerHTML='<div class="card"><h2 style="font-size:18px">운영진에게 요청 · 문의</h2><p class="hint" style="margin:4px 0 8px">방 · 일정 · 불편한 점 등 무엇이든 적어 주세요. 답이 오면 아래 「내 글」에 보여요.</p><textarea id="aT" maxlength="2000" placeholder="예) 304호 에어컨이 안 돼요 / 개인레슨 시간을 바꾸고 싶어요"></textarea><p style="margin:8px 0 0"><button type="button" class="btn1" id="aGo">보내기</button></p></div><div id="aMine"><p class="hint">내 글을 불러오는 중…</p></div>';
  $('aGo').addEventListener('click',function(){var t=$('aT').value.trim();if(t.length<2){alert('내용을 적어 주세요.');return}$('aGo').disabled=true;
    run('findIssue',{text:t},function(r){$('aGo').disabled=false;if(!r.ok){alert(r.msg||'보내지 못했어요');return}$('aT').value='';alert('보냈어요. 답이 오면 「내 글」에 보여요.');mine(r.mine)},$('aMine'))});
  run('findMyIssues',null,function(r){mine(r.mine||[])},$('aMine'))}
function mine(L){$('aMine').innerHTML=L.length?'<div class="card"><h2 style="font-size:18px">내 글</h2>'+L.map(function(x){return '<div style="padding:8px 0;border-bottom:1px solid var(--line)"><small class="hint">'+esc(x.at)+'</small> <span class="st'+(x.state==='해결'||x.state==='완료'?'':' wait')+'">'+esc(x.state)+'</span><div style="white-space:pre-line;margin-top:4px">'+esc(x.text)+'</div>'+(x.reply?'<div class="reply"><b>답변</b> '+esc(x.reply)+'</div>':'')+'</div>'}).join('')+'</div>':''}

document.addEventListener('click',function(e){var t=e.target.closest('[data-tab],[data-ev],[data-day],[data-cday],[data-mday],[data-kdel],[data-ttclose]');if(!t)return;
  if(t.hasAttribute('data-tab')){show(t.getAttribute('data-tab'));return}
  if(t.hasAttribute('data-day')){DAY=+t.getAttribute('data-day');SEL=null;board();return}
  if(t.hasAttribute('data-cday')){CDAY=+t.getAttribute('data-cday');concerts();return}
  if(t.hasAttribute('data-mday')){MDAY=+t.getAttribute('data-mday');info();return}
  if(t.hasAttribute('data-kdel')){var kn=t.getAttribute('data-kdel'),ka=t.getAttribute('data-kacad');var same=KIDS&&KIDS.kids?KIDS.kids.filter(function(x){return x.how==='add'&&x.name===kn}).length:0;
    if(ka&&same>1){var H=kidHide();H.push(kn+'|'+ka);try{localStorage.setItem('campKidsHide',JSON.stringify(H))}catch(e){}}else setKids(myKids().filter(function(x){return x.name!==kn}));kids();return}
  if(t.hasAttribute('data-ttclose')){if(t.classList.contains('ttpop')&&e.target!==t)return;SEL=null;board();return}
  if(t.hasAttribute('data-ev')){var id=t.getAttribute('data-ev');SEL=id;board();if(!EV[id])run('campEventPeople',id,function(r){EV[id]=r||{ok:false};if(SEL===id)board()},null)}});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&SEL){SEL=null;board()}});
</script>
