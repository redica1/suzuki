<!doctype html><!-- build: 20261103-161423 --><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<base target="_top">
<style>
:root{--ink:#18232b;--muted:#5b6b73;--faint:#93a1a8;--line:#d5e6e6;--bg:#f2f8f8;--surface:#fff;--accent:#0f8a86;--soft:#e3f3f2}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;letter-spacing:-.01em}
.band{background:var(--accent);color:#fff;padding:22px 16px 18px}
.band h1{margin:0;font-size:22px;font-weight:800;line-height:1.3}
.band p{margin:6px 0 0;opacity:.9;font-size:15px}
.wrap{max-width:640px;margin:0 auto;padding:16px}
.search{display:flex;gap:8px;margin:4px 0 12px}
.search input{flex:1;min-width:0;font:inherit;font-size:18px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface)}
.search button{font:inherit;font-weight:800;font-size:17px;padding:0 18px;border:0;border-radius:12px;background:var(--accent);color:#fff;cursor:pointer}
.hint{color:var(--muted);font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 12px}
.card h2{margin:0;font-size:21px}
.who{color:var(--muted);font-size:14.5px;margin:2px 0 10px}
.sec{margin:12px 0 0}
.sec h3{margin:0 0 6px;font-size:15px;color:var(--accent)}
.it{display:flex;gap:10px;padding:8px 10px;border-radius:10px;background:var(--soft);margin:0 0 6px}
.it .t{font-weight:800;min-width:96px;font-variant-numeric:tabular-nums}
.it small{display:block;color:var(--muted);font-size:13.5px}
.none{color:var(--faint);font-size:14.5px}
.err{color:#c0392b;font-weight:700}
.sos{background:#fff7e8;border:1px solid #f0d9a8;border-radius:12px;padding:12px 14px;font-size:14.5px;margin:12px 0 0}
</style></head><body>
<div class="band"><h1 id="title">캠프 일정 찾기</h1><p>학생 이름을 넣으면 그 아이가 지금 어디로 가야 하는지 보여요. 길을 잃은 아이를 만나면 이름을 물어 찾아 주세요.</p></div>
<div class="wrap">
  <form class="search" id="f"><input id="q" type="search" placeholder="학생 이름" autocomplete="off" aria-label="학생 이름"><button type="submit">찾기</button></form>
  <div id="out"><p class="hint">이름 전체를 넣으면 가장 정확해요. 같은 이름이 여럿이면 학원 · 악기를 보고 골라 주세요.</p></div>
  <div class="sos"><b>도움이 필요하면</b> 가까운 운영진(명찰 · 조끼)이나 안내 데스크로 아이와 함께 와 주세요. 담당 선생님 이름이 보이면 그 선생님을 찾아도 돼요.</div>
</div>
<script>
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var out=document.getElementById('out');
function show(r){
  if(r.name)document.getElementById('title').textContent=r.name+' · 일정 찾기';
  if(!r.ok){out.innerHTML='<p class="err">'+esc(r.msg)+'</p>';return}
  if(!r.open){out.innerHTML='<p class="hint">'+esc(r.msg)+'</p>';return}
  if(!r.kids.length){out.innerHTML='<p class="hint">그 이름의 학생을 찾지 못했어요. 띄어쓰기 없이 이름만 넣어 보세요.</p>';return}
  out.innerHTML=(r.kids.length>1?'<p class="hint">'+r.kids.length+'명이 나왔어요'+(r.more?' (앞 20명만)':'')+'. 학원 · 악기로 맞는 아이를 찾아 주세요.</p>':'')+r.kids.map(function(k){
    var g=k.grp.length?k.grp.map(function(x){return '<div class="it"><span class="t">'+esc(x.time)+'</span><span><b>'+esc(x.sub||'그룹레슨')+'</b> · '+esc(x.room||'장소 미정')+'<small>'+esc(x.days.join(', '))+'</small></span></div>'}).join(''):'<p class="none">아직 정해지지 않았어요</p>';
    var l=k.les.length?k.les.map(function(x){return '<div class="it"><span class="t">'+esc(x.day)+'<br>'+esc(x.t)+'</span><span><b>'+esc(x.pr)+'</b> 교수 · '+esc(x.room||'레슨실 미정')+'</span></div>'}).join(''):'';
    return '<div class="card"><h2>'+esc(k.name)+'</h2><div class="who">'+esc(k.acad)+(k.inst?' · '+esc(k.inst):'')+(k.teacher?' · 담당 '+esc(k.teacher)+' 선생님':'')+'</div>'+
      '<div class="sec"><h3>그룹레슨</h3>'+g+'</div>'+(l?'<div class="sec"><h3>개인레슨</h3>'+l+'</div>':'')+(k.concert?'<div class="sec"><h3>음악회</h3><div class="it"><span><b>'+esc(k.concert)+' 음악회</b></span></div></div>':'')+'</div>'}).join('');
}
document.getElementById('f').addEventListener('submit',function(e){e.preventDefault();var q=document.getElementById('q').value.trim();if(!q)return;
  out.innerHTML='<p class="hint">찾고 있어요…</p>';
  google.script.run.withSuccessHandler(show).withFailureHandler(function(x){out.innerHTML='<p class="err">연결이 잠시 안 돼요. 다시 눌러 주세요.</p>'}).findKid(q)});
</script>
<div id="bldMark" hidden>빌드표시 20261103-161423 </div>
</body></html>
