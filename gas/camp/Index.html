.roomck{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--accent-soft);border-radius:8px;padding:9px 12px;font-size:14px;cursor:pointer}
.roomck input{width:18px;height:18px;accent-color:var(--accent)}
.roomck span:nth-child(2){flex:1}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px dashed var(--accent);color:var(--accent);background:transparent;border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:600;cursor:pointer}
.chip:hover{background:var(--accent-soft)}
.roomrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13.5px}
.roomrow select{padding:5px 8px;width:auto}
.roomrow .pill{font-weight:500}
.note{background:var(--rosin-soft);color:var(--ink);border-radius:8px;padding:10px 12px;font-size:13.5px;border-left:3px solid var(--rosin)}
.note.info{background:var(--accent-soft);border-left-color:var(--accent)}
.adder{border:1px dashed var(--line);border-radius:8px;padding:12px;display:grid;gap:10px;background:var(--bg)}

/* participant cards */
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.pcard header{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 16px;background:var(--sunk);flex-wrap:wrap}
.pcard header h3{font-size:16px;font-weight:700}
.pcard header small{color:var(--muted);font-size:13px}
.pcard .body{padding:14px 16px;display:grid;gap:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{all:unset;cursor:pointer;padding:6px 12px;font-size:13.5px}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.checks{display:flex;gap:14px;flex-wrap:wrap}
.checks label{display:flex;gap:6px;align-items:center;font-size:14px;color:var(--ink)}
.checks input{accent-color:var(--accent);width:16px;height:16px}
.sub{display:grid;gap:12px;padding-left:12px;border-left:2px solid var(--accent-soft)}
.fee-line{display:flex;justify-content:space-between;font-size:13.5px;color:var(--muted);border-top:1px dashed var(--line);padding-top:10px}
.fee-line b{color:var(--ink)}
details.opt summary{cursor:pointer;font-weight:600;color:var(--accent)}
details.opt[open] summary{margin-bottom:12px}

/* review */
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:520px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12.5px;color:var(--muted);font-weight:600;letter-spacing:.02em}
td.r,th.r{text-align:right}
tfoot td{font-weight:700;border-bottom:0}
.bank{display:grid;gap:4px;background:var(--sunk);border-radius:8px;padding:12px 14px}
.bank .k{font-size:12.5px;color:var(--muted)}
.agree{display:flex;gap:8px;align-items:flex-start;font-size:14px}
.agree input{margin-top:4px;accent-color:var(--accent)}

.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:4px 14px;margin:0;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.dcard{border:1px solid var(--line);border-radius:8px;padding:12px;display:grid;gap:8px;background:var(--bg)}
.dcard header{display:flex;justify-content:space-between;gap:8px;align-items:center}
.dcard.famc{border-style:dashed}
.dcard .kv{font-size:13.5px}
.g2c{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.panel h3{margin:0}
.combo{position:relative}
.combo input{padding-right:30px;cursor:pointer}
.combo .caret{position:absolute;right:11px;top:10px;color:var(--faint);pointer-events:none}
.combo ul{max-height:300px}
.combo li button[aria-selected=true]{background:var(--accent-soft)}
.combo li:first-child button{border-bottom:1px solid var(--line);border-radius:6px 6px 0 0}
.acards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.acard{all:unset;cursor:pointer;display:grid;gap:2px;border:1px solid var(--line);border-radius:8px;padding:12px;background:var(--bg)}
.acard:hover{border-color:var(--accent)}
.acard[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.acard small{color:var(--muted);font-size:12.5px}
.acard .pill{justify-self:start;margin-top:4px}
.mine{display:flex;gap:6px;align-items:center;font-size:13.5px}
.mine input{accent-color:var(--accent)}
/* done */
.ticket{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px 18px;display:grid;gap:8px;text-align:center}
.ticket .no{font-family:var(--mono);font-size:30px;letter-spacing:.06em;color:var(--accent)}
.ticket p{margin:0;color:var(--muted)}

/* sticky total */
.dock{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:8}
.dock .wrap{padding-block:12px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.dock .sum{display:grid;line-height:1.3}
.dock .sum small{color:var(--muted);font-size:12.5px}
.dock .sum b{font-size:19px}
.dock .row{flex-wrap:nowrap}
.dock .btn.mine{border-color:var(--accent,#2c46c9);color:var(--accent,#2c46c9);font-weight:700}
@media (max-width:440px){.dock .wrap{gap:8px}.dock .btn{padding-inline:10px}.dock .sum b{font-size:16px}}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:14px;z-index:9}
.flash{animation:flash .45s ease-in-out 4;outline:3px solid #e0483b;outline-offset:2px;border-radius:8px}
@keyframes flash{0%,100%{box-shadow:0 0 0 0 rgba(224,72,59,0)}50%{box-shadow:0 0 0 6px rgba(224,72,59,.45);background-color:#fff1ef}}
.btn.dim{opacity:.55}
.ens3 button:disabled{opacity:.45;cursor:not-allowed}
@media (prefers-reduced-motion:no-preference){.sec{animation:in .18s ease-out}@keyframes in{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}}
.kind{display:inline-block;font-size:11.5px;font-weight:600;border-radius:5px;padding:0 6px;margin-left:4px;vertical-align:1px}
.kind.ks{background:var(--sunk,#e9eef0);color:var(--muted)}
.kind.kt{background:var(--accent-soft,#dcecee);color:var(--accent)}
.grp{display:grid;gap:10px;border-top:1px dashed var(--line);padding-top:12px}
.grp-h{font-size:13.5px;font-weight:700;color:var(--ink)}
.rules{margin:8px 0;padding-left:18px;display:grid;gap:4px;font-size:14px}
.cxbox{display:grid;gap:10px;border:1px solid var(--rosin);background:var(--rosin-soft);border-radius:10px;padding:12px}
.sub-card{display:grid;gap:10px}
#ruleBox summary{cursor:pointer}
.pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:start}
.pair .f select,.pair .f input{min-width:0;width:100%}
.demo{display:grid;gap:6px;border-top:1px dashed var(--line);padding-top:10px}
.demo .btn{justify-content:flex-start;text-align:left}
select:disabled{opacity:.5}
.xhead{font-size:13.5px;font-weight:700;padding-top:10px;border-top:1px dashed var(--line)}
.ex{color:var(--faint);font-weight:400;font-size:12.5px}
.req{color:var(--bad);font-weight:700;margin-left:2px}
.ex{margin-left:2px}
.rp{display:grid;gap:10px;border-color:var(--accent)}
