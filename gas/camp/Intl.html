<body>
<header><div class="wrap"><small>Korea Suzuki Music Association</small><h1 id="ttl">Suzuki Winter Music Camp</h1><p id="when">Overseas group registration</p></div></header>
<main class="wrap" id="app"></main>
<div class="toast" id="toast" hidden></div><div class="busy" id="busy" hidden>Saving…</div>
<script>
var S={tok:'',D:null,list:[],dirty:false,err:'',rep:{cur:'USD'}};
var TYPES=[['해외 학생','Student (plays an instrument)'],['해외 교사','Teacher'],['해외 보호자','Parent / guardian'],['해외 동반가족','Accompanying family member (no instrument)'],['해외 15개월 미만','Infant (under 15 months)']];
var TL={};TYPES.forEach(function(t){TL[t[0]]=t[1]});
var CONEN={'오후':'Afternoon','트와일라잇':'Twilight','이브닝':'Evening'};
var INST=[['바이올린','Violin'],['첼로','Cello'],['비올라','Viola'],['플루트','Flute'],['피아노','Piano']];var IL={};INST.forEach(function(t){IL[t[0]]=t[1]});
var BOOK=[['Pre-Twinkle','Pre-Twinkle'],['1권','Book 1'],['2권','Book 2'],['3권','Book 3'],['4권','Book 4'],['5권','Book 5'],['6권','Book 6'],['7권','Book 7'],['8권','Book 8'],['9권','Book 9'],['10권','Book 10'],['10권 이상','Above Book 10']];
var BL={};BOOK.forEach(function(t){BL[t[0]]=t[1]});
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function won(n){return 'USD '+(Math.round((+n||0)*100)/100).toLocaleString('en-US')}
function opt(L,v,ph){return (ph?'<option value="">'+ph+'</option>':'')+L.map(function(o){return '<option value="'+esc(o[0])+'"'+(o[0]===v?' selected':'')+'>'+esc(o[1])+'</option>'}).join('')}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){t.hidden=true},2600)}
function busy(on,m){var b=document.getElementById('busy');b.textContent=m||'Saving…';b.hidden=!on}
function run(fn,args,ok){busy(true);google.script.run.withSuccessHandler(function(r){busy(false);if(r&&r.ok===false){S.err=r.msg;render();toast(r.msg);return}ok(r)}).withFailureHandler(function(e){busy(false);var m=(e&&e.message)||String(e);S.err=m;render();toast(m)})[fn].apply(null,args)}
function setD(r){S.D=r;S.list=(r.ppl||[]).map(function(p){return {key:p.key,first:p.first,last:p.last,type:p.type,gender:p.gender,by:p.by,inst:p.inst,prog:p.prog,note:p.note,room:p.room||'',lessons:+p.lessons||0,mc:p.mc||[],concert:p.concert||'없음',song:p.song||'',video:p.video||'',fee:p.fee,paid:p.paid,pay:p.pay}});S.dirty=false;S.err='';
  var c=r.camp||{};document.getElementById('ttl').textContent=(c.name?c.name.replace('스즈키 겨울 음악제','Suzuki Winter Music Camp'):'Suzuki Winter Music Camp');
  document.getElementById('when').textContent=(c.start||'')+' ~ '+(c.end||'')+' · Overseas group registration · '+r.group.name}
function agBox(){return '<label style="display:flex;gap:10px;align-items:flex-start;font-weight:400"><input type="checkbox" id="ag" style="width:22px;min-height:22px;margin-top:3px"><span>I agree that the association collects and uses the participants’ names, gender, birth year, instrument and level to run the camp (room assignment, lessons, name tags), and shares names and gender with the camp hotel. I confirm that guardians of participants under 14 have agreed. The data is deleted after the camp settlement.</span></label>'}
/* 코드 없이 새 단체 (11-15) */
function vNew(){return '<div class="card" style="max-width:520px"><h2>Register a new group</h2>'+
  '<p class="hint">No access code needed. Enter your group and leader details, and you can start registering right away. We will show you an access code and also email it to you, so you can sign in again later.</p>'+
  '<div style="display:grid;gap:12px;margin-top:10px"><label>Group name<input type="text" id="ng" maxlength="40" placeholder="e.g. Taipei Suzuki Strings"></label><label>Country<input type="text" id="nc" maxlength="30" placeholder="e.g. Taiwan"></label><label>Leader name<input type="text" id="nl" maxlength="40"></label><label>Email<input type="email" id="ne" autocomplete="email" inputmode="email"></label>'+agBox()+
  (S.err?'<p class="err">'+esc(S.err)+'</p>':'')+'<button class="btn primary" type="button" id="ngo">Register and start</button><button class="btn ghost" type="button" id="tosign">I already have an access code</button></div></div>'}
/* Questions board (11-15): no sign-in · name + email · replies come by email and show under 「My questions」 */
function askCard(){return '<div class="card" style="max-width:520px;margin-top:16px"><h2>Questions?</h2><p class="hint">Ask us anything about the camp. No sign-in needed: just your name and email. We reply by email.</p><button class="btn primary" type="button" id="toask">Ask a question</button></div>'}
function vAsk(){var Q=S.ask||(S.ask={});var mine=Q.mine;
  return '<div class="card" style="max-width:620px"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><h2 style="margin:0">Questions</h2><button class="btn small" type="button" id="askback">Back</button></div>'+
  '<p class="hint">Only you and the camp office can see your questions. We reply by email; you can also check replies here with the same name and email.</p>'+
  '<div style="display:grid;gap:12px;margin-top:10px"><label>Your name<input type="text" id="qn" maxlength="40" value="'+esc(Q.name||'')+'" autocomplete="name"></label>'+
  '<label>Email<input type="email" id="qe" maxlength="80" value="'+esc(Q.email||'')+'" autocomplete="email" inputmode="email"></label>'+
  '<label>Question<textarea id="qt" rows="5" maxlength="2000" placeholder="Group name, country and your question">'+esc(Q.text||'')+'</textarea></label>'+
  '<input type="text" id="qhp" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;width:1px;height:1px">'+
  (S.err?'<p class="err">'+esc(S.err)+'</p>':'')+
  '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" type="button" id="asksend">Send question</button><button class="btn" type="button" id="askmine">My questions</button></div></div>'+
  (mine?'<h3 style="margin:18px 0 6px">My questions ('+mine.length+')</h3>'+(mine.length?mine.map(function(x){return '<div class="note" style="margin:8px 0;display:grid;gap:6px"><div><b>'+esc(x.no)+'</b> <span class="hint">'+esc(String(x.at).slice(0,16))+'</span> · '+(x.reply?'<b style="color:#0f766e">Answered</b>':'<span class="hint">Waiting for reply</span>')+'</div><div style="white-space:pre-wrap">'+esc(x.text)+'</div>'+(x.reply?'<div style="white-space:pre-wrap;border-left:3px solid #0f766e;padding-left:10px"><b>Reply</b><br>'+esc(x.reply)+'</div>':'')+'</div>'}).join(''):'<p class="hint">No questions yet with this name and email.</p>'):'')+'</div>'}
function vLogin(){if(S.mode==='ask')return vAsk();var E=S.ent||(S.ent={});
  return '<div class="card" style="max-width:520px"><h2>Group registration</h2>'+
  '<p class="hint">One leader registers everyone in the group: students, teachers, parents and family. No access code is needed. Use the same email and group name to come back later and add or change people.</p>'+
  '<div style="display:grid;gap:12px;margin-top:10px"><label>Email<input type="email" id="em" autocomplete="email" inputmode="email" value="'+esc(E.email||'')+'"></label>'+
  '<label>Group (school / studio) name<input type="text" id="gn" maxlength="40" value="'+esc(E.name||'')+'" placeholder="e.g. Manila Suzuki Studio"></label>'+
  (S.needNew?'<div class="note">New group: please add these too.</div><label>Country<input type="text" id="gc" maxlength="30" value="'+esc(E.country||'')+'"></label><label>Leader name<input type="text" id="gl" maxlength="40" value="'+esc(E.lead||'')+'"></label>':'')+
  agBox()+
  (S.err?'<p class="err">'+esc(S.err)+'</p>':'')+'<button class="btn primary" type="button" id="enter">'+(S.needNew?'Create group and continue':'Continue')+'</button>'+
  (S.test?'<button class="btn" type="button" id="tgo" style="border-style:dashed">STG 시험: 시험 단체로 바로 로그인</button>':'')+'</div></div>'+askCard()}
function rooms(){var g={};S.list.forEach(function(p,i){var t=String(p.room||'').trim().toLowerCase();if(t)(g[t]=g[t]||[]).push(i)});return g}
function roomFeeOf(){var g=rooms(),out={},cap=S.D.roomCap||4;Object.keys(g).forEach(function(t){out[t]={n:g[t].length,fee:Math.max(0,cap-g[t].length)*(S.D.roomEmptyUsd||0),over:g[t].length>(S.D.roomMax||6),first:g[t][0]}});return out}
function mcFor(p){var M=(S.D.mcs||[]).filter(function(m){return m.i===p.inst});return M}
function mcUsd(p){if(!(p.type==='해외 학생'||p.type==='해외 교사'))return 0;return (p.mc||[]).reduce(function(t,n){var m=mcFor(p).find(function(x){return x.n===n});return t+(m?m.usd:0)},0)}
function sum(){var L=S.list,by={},tot=0,paid=0,room=0,les=0,mcT=0,mcN=0;L.forEach(function(p){by[p.type]=(by[p.type]||0)+1;var f=(S.D.fees[p.type]||0)+((p.type==='해외 학생'||p.type==='해외 교사')?(+p.lessons||0)*(S.D.lessonUsd||45):0)+mcUsd(p);tot+=f;mcT+=mcUsd(p);mcN+=mcUsd(p)?(p.mc||[]).filter(function(n){return mcFor(p).some(function(m){return m.n===n})}).length:0;paid+=+p.paid||0;if(p.type==='해외 학생'||p.type==='해외 교사')les+=+p.lessons||0});var R=roomFeeOf();Object.keys(R).forEach(function(t){room+=R[t].fee});return {by:by,tot:tot+room,paid:paid,room:room,rooms:R,les:les,mcT:mcT,mcN:mcN}}
function vPerson(p,i){var plays=p.type==='해외 학생'||p.type==='해외 교사';
  return '<div class="person'+(p.key?'':' new')+'"><div class="spread"><b>'+(i+1)+'. '+esc((p.first||'')+' '+(p.last||'')).trim()+(p.key?'':' <span class="pill">new</span>')+'</b><div class="row">'+(p.paid>0?'<span class="pill ok">paid '+won(p.paid)+'</span>':'')+'<span class="num">'+won((S.D.fees[p.type]||0)+(plays?(+p.lessons||0)*(S.D.lessonUsd||45):0)+mcUsd(p))+'</span>'+(p.paid>0?'':'<button class="btn small ghost" type="button" data-rm="'+i+'">Remove</button>')+'</div></div>'+
  '<div class="grid" style="margin-top:8px">'+
  '<label>First name *<input data-f="first" data-i="'+i+'" value="'+esc(p.first)+'"></label>'+
  '<label>Last name *<input data-f="last" data-i="'+i+'" value="'+esc(p.last)+'"></label>'+
  '<label>Type *<select data-f="type" data-i="'+i+'"'+(p.paid>0?' disabled':'')+'>'+opt(TYPES,p.type,'Choose')+'</select></label>'+
  '<label>Gender *<select data-f="gender" data-i="'+i+'">'+opt([['남','Male'],['여','Female']],p.gender,'Choose')+'</select></label>'+
  '<label>Birth year *<input data-f="by" data-i="'+i+'" value="'+esc(p.by)+'" inputmode="numeric" maxlength="4" placeholder="2015"></label>'+
  (plays?'<label>Instrument *<select data-f="inst" data-i="'+i+'">'+opt(INST,p.inst,'Choose')+'</select></label>':'')+
  (p.type==='해외 학생'?'<label>Current book *<select data-f="prog" data-i="'+i+'">'+opt(BOOK,p.prog,'Choose')+'</select></label>':'')+
  (plays?'<label>Extra private lessons <span class="hint">(30 min · '+won(S.D.lessonUsd||45)+' each)</span><select data-f="lessons" data-i="'+i+'">'+opt([0,1,2,3,4,5].slice(0,(S.D.lessonMax||5)+1).map(function(n){return [String(n),n?n+' × '+won(S.D.lessonUsd||45)+' = '+won(n*(S.D.lessonUsd||45)):'None']}),String(p.lessons||0))+'</select></label>':'')+
  (plays?'<label>Concert <span class="hint">(to perform)</span><select data-f="concert" data-i="'+i+'">'+opt([['없음','Not performing']].concat((S.D.cons||[]).map(function(c){return [c,(CONEN[c]||c)+' concert']})),p.concert||'없음')+'</select></label>'+
    (p.concert&&p.concert!=='없음'?'<label>Piece (composer · title) *<input data-f="song" data-i="'+i+'" value="'+esc(p.song||'')+'" maxlength="120" placeholder="e.g. Vivaldi · Concerto in A minor, 1st mvt."></label>'+(/오후/.test(p.concert)?'':'<label>Video link <span class="hint">(YouTube, optional'+(/이브닝/.test(p.concert)?', needed for audition':'')+')</span><input data-f="video" data-i="'+i+'" value="'+esc(p.video||'')+'" placeholder="https:\/\/"></label>')+'':''):'')+
  (plays?'<div class="mcbox"><b>Masterclass</b> <span class="hint">(optional · several allowed)</span>'+(!p.inst?'<p class="hint" style="margin:4px 0 0">Choose the instrument first.</p>':mcFor(p).length?mcFor(p).map(function(m){return '<label class="mcl"><input type="checkbox" data-mc="'+i+'" value="'+esc(m.n)+'"'+((p.mc||[]).indexOf(m.n)>=0?' checked':'')+'> '+esc(m.en||m.n)+(m.en&&m.en!==m.n?' <span class="hint">('+esc(m.n)+')</span>':'')+' <span class="hint">'+m.min+' min · '+won(m.usd)+'</span></label>'}).join(''):'<p class="hint" style="margin:4px 0 0">No masterclass for this instrument yet.</p>')+'</div>':'')+
  '<label>Family room<input data-f="room" data-i="'+i+'" value="'+esc(p.room)+'" placeholder="e.g. Dela Cruz family" list="roomNames"></label>'+
  '<label>Note<input data-f="note" data-i="'+i+'" value="'+esc(p.note)+'" placeholder="allergy, etc."></label></div></div>'}
function vMain(){var D=S.D,s=sum();
  var fee='<table><thead><tr><th>Participant type</th><th class="r">Fee ('+esc(String(D.round).replace(/(\d+)\s*차/,'round $1'))+')</th><th class="r">People</th></tr></thead><tbody>'+TYPES.map(function(t){return '<tr><td>'+esc(t[1])+'</td><td class="r num">'+won(D.fees[t[0]]||0)+'</td><td class="r num">'+(s.by[t[0]]||0)+'</td></tr>'}).join('')+
    (s.les?'<tr><td>Extra private lessons ('+s.les+' × '+won(D.lessonUsd||45)+')</td><td class="r num">'+won(s.les*(D.lessonUsd||45))+'</td><td></td></tr>':'')+
    (s.mcT?'<tr><td>Masterclasses ('+s.mcN+')</td><td class="r num">'+won(s.mcT)+'</td><td></td></tr>':'')+
    (s.room?'<tr><td>Family room empty bed spots</td><td class="r num">'+won(s.room)+'</td><td></td></tr>':'')+
    '<tr><td><b>Total</b></td><td class="r num"><b>'+won(s.tot)+'</b></td><td class="r num"><b>'+S.list.length+'</b></td></tr></tbody></table>';
  var RR=s.rooms,rk=Object.keys(RR),cap=D.roomCap||4;
  var roomBox='<div class="card"><h2>Family rooms</h2><p class="hint">A family room is for one family of '+cap+' or more people (each room sleeps 5 to 6; up to 6 per family room). Type the same family room name (for example “Dela Cruz family”) for everyone who will share the room. If fewer than '+cap+' people stay, each empty bed spot costs '+won(D.roomEmptyUsd||0)+'. Leave it blank for people who stay in the group rooms (usually 5 per room).</p>'+
    (rk.length?'<table><thead><tr><th>Family room</th><th class="r">People</th><th class="r">Empty bed spots</th></tr></thead><tbody>'+rk.map(function(t){var x=RR[t];return '<tr><td>'+esc(S.list[x.first].room)+(x.over?' <span class="pill due">max '+(S.D.roomMax||6)+'</span>':'')+'</td><td class="r num">'+x.n+'</td><td class="r num">'+won(x.fee)+'</td></tr>'}).join('')+'</tbody></table>':'<p class="hint">No family rooms yet.</p>')+
    '<datalist id="roomNames">'+rk.map(function(t){return '<option value="'+esc(S.list[RR[t].first].room)+'">'}).join('')+'</datalist></div>';
  return (S.newCode?'<div class="note" style="margin-bottom:16px"><b>Your group is ready.</b> Your access code is <b style="font-size:20px;letter-spacing:.08em">'+esc(S.newCode)+'</b>. Please keep it: you need your email and this code to sign in again. We also emailed it to '+esc(D.group.email)+'.</div>':'')+'<div class="card"><div class="spread"><div><h2>'+esc(D.group.name)+'</h2><span class="hint">'+esc(D.group.country)+(D.group.lead?' · leader '+esc(D.group.lead):'')+' · '+esc(D.group.email)+(D.no?' · registration '+esc(D.no):'')+'</span></div><button class="btn small ghost" type="button" id="out">Sign out</button></div>'+
    '<p class="hint" style="margin-top:8px">Camp: '+esc(D.camp.start)+' ~ '+esc(D.camp.end)+(D.camp.place&&D.camp.place!=='추후 안내'?' · '+esc(D.camp.place):'')+'. Fees include the camp program, room and meals. No membership fee for overseas participants.</p>'+fee+'</div>'+
    '<div class="card"><div class="spread"><h2>Participants</h2>'+(S.list.length?'':'<div class="row addrow"><button class="btn small" type="button" data-add="해외 학생">+ Student</button><button class="btn small" type="button" data-add="해외 교사">+ Teacher</button><button class="btn small" type="button" data-add="해외 보호자">+ Parent</button><button class="btn small" type="button" data-add="해외 동반가족">+ Family</button><button class="btn small" type="button" data-add="해외 15개월 미만">+ Infant</button></div>')+'</div>'+
    '<p class="hint">Enter every person who will come. Names in English as in the passport. You can come back later to add or change people. People whose payment is confirmed cannot be removed here.</p>'+
    (S.list.length?S.list.map(vPerson).join('')+'<div class="addbot"><b>Add another person</b>'+'<div class="row addrow"><button class="btn small" type="button" data-add="해외 학생">+ Student</button><button class="btn small" type="button" data-add="해외 교사">+ Teacher</button><button class="btn small" type="button" data-add="해외 보호자">+ Parent</button><button class="btn small" type="button" data-add="해외 동반가족">+ Family</button><button class="btn small" type="button" data-add="해외 15개월 미만">+ Infant</button></div>'+'</div>':'<p class="hint">No one yet. Use the buttons above to add people.</p>')+'</div>'+
    roomBox+
    /* 11-15 사용자: 해외 단체는 이체 없이 신청만 → 입금 · 이체 신고 칸을 뺌, 금액은 참고로만 */
    '<div class="card"><h2>Fees</h2><p class="hint"><b>Registration only.</b> You do not need to send money or report a transfer on this page. The camp office will contact you by email about payment.</p>'+
    '<div class="spread" style="margin-top:10px"><b>Estimated total '+won(s.tot)+'</b><span class="hint">'+S.list.length+' people'+(s.room?' · incl. family room empty bed spots '+won(s.room):'')+'</span></div></div>'+
    '<div class="sticky"><div class="spread wrap" style="padding:0"><span>'+S.list.length+' people · <b>'+won(s.tot)+'</b>'+(S.dirty?' · <span class="err">not saved</span>':'')+'</span><button class="btn primary" type="button" id="save"'+(S.dirty?'':' disabled')+'>Save list</button></div>'+(S.err?'<p class="err" style="margin:6px 0 0">'+esc(S.err)+'</p>':'')+'</div>'}
function render(){document.getElementById('app').innerHTML=S.D?vMain():vLogin()}
document.addEventListener('input',function(e){var t=e.target;if(t.dataset&&t.dataset.f!==undefined){var p=S.list[+t.dataset.i];p[t.dataset.f]=t.value;S.dirty=true;var b=document.getElementById('save');if(b)b.disabled=false}});
document.addEventListener('change',function(e){var t=e.target;if(t.dataset&&t.dataset.mc!==undefined){var q=S.list[+t.dataset.mc];q.mc=(q.mc||[]).filter(function(n){return n!==t.value});if(t.checked)q.mc.push(t.value);S.dirty=true;render();return}if(t.dataset&&t.dataset.f!==undefined&&(t.tagName==='SELECT'||t.dataset.f==='room')){var p=S.list[+t.dataset.i];p[t.dataset.f]=t.value;S.dirty=true;render()}});
document.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;var d=b.dataset;
  if(b.id==='go'){var em=document.getElementById('em').value.trim(),cd=document.getElementById('cd').value.trim(),ag=document.getElementById('ag').checked;if(!em||!cd){S.err='Please enter your email and access code.';render();return}if(!ag){S.err='Please agree to the collection and use of personal information.';render();return}
    run('intlLogin',[em,cd,true],function(r){S.tok=r.token;setD(r);render()});return}
  if(b.id==='toask'){S.mode='ask';S.err='';render();window.scrollTo(0,0);return}
  if(b.id==='askback'){S.mode='';S.err='';render();return}
  if(b.id==='asksend'||b.id==='askmine'){var Q=S.ask||(S.ask={});Q.name=document.getElementById('qn').value.trim();Q.email=document.getElementById('qe').value.trim();Q.text=document.getElementById('qt').value;
    if(!Q.name||!Q.email){S.err='Please enter your name and email.';render();return}S.err='';
    if(b.id==='askmine'){run('intlMine',[Q.name,Q.email],function(r){Q.mine=r.mine;render()});return}
    if(Q.text.trim().length<2){S.err='Please write your question.';render();return}
    run('intlAsk',[{name:Q.name,email:Q.email,text:Q.text,hp:document.getElementById('qhp').value,env:navigator.userAgent.slice(0,120)}],function(r){Q.text='';Q.mine=r.mine;render();toast('Sent. We will reply by email.')});return}
  if(b.id==='enter'){var E=S.ent||(S.ent={}),g=function(id){var x=document.getElementById(id);return x?x.value.trim():''};E.email=g('em');E.name=g('gn');if(S.needNew){E.country=g('gc');E.lead=g('gl')}var ag=document.getElementById('ag').checked;
    if(!E.email||!E.name){S.err='Please enter your email and group name.';render();return}if(!ag){S.err='Please agree to the collection and use of personal information.';render();return}S.err='';
    busy(true);google.script.run.withSuccessHandler(function(r){busy(false);if(r&&r.ok===false){if(r.need)S.needNew=true;S.err=r.msg;render();return}S.needNew=false;S.tok=r.token;setD(r);render()}).withFailureHandler(function(e){busy(false);S.err=(e&&e.message)||String(e);render()}).intlEnter({email:E.email,name:E.name,country:E.country||'',lead:E.lead||''},true);return}
  if(b.id==='tonew'||b.id==='tosign'){S.mode=b.id==='tonew'?'new':'';S.err='';render();return}
  if(b.id==='ngo'){var v=function(id){return document.getElementById(id).value.trim()},ag=document.getElementById('ag').checked;if(!ag){S.err='Please agree to the collection and use of personal information.';render();return}
    run('intlSignup',[{name:v('ng'),country:v('nc'),lead:v('nl'),email:v('ne')},true],function(r){S.tok=r.token;S.newCode=r.code||'';S.mode='';setD(r);render()});return}
  if(b.id==='tgo'){run('intlTestLogin',[],function(r){S.tok=r.token;setD(r);render()});return}
  if(b.id==='out'){if(S.dirty&&!confirm('You have unsaved changes. Sign out anyway?'))return;S.tok='';S.D=null;S.err='';S.newCode='';render();return}
  if(d.add){S.list.push({key:'',first:'',last:'',type:d.add,gender:'',by:'',inst:'',prog:'',note:'',lessons:0,mc:[],concert:'없음',song:'',video:'',paid:0});S.dirty=true;render();var L=document.querySelectorAll('[data-f="first"]');if(L.length)L[L.length-1].focus();return}
  if(d.rm!==undefined){var p=S.list[+d.rm];if(p.key&&!confirm('Remove '+((p.first||'')+' '+(p.last||'')).trim()+'?'))return;S.list.splice(+d.rm,1);S.dirty=true;render();return}
  if(b.id==='save'){run('intlSave',[S.tok,S.list.map(function(p){return {key:p.key,first:p.first,last:p.last,type:p.type,gender:p.gender,by:p.by,inst:p.inst,prog:p.prog,note:p.note,room:p.room,concert:p.concert||'없음',song:p.song||'',video:p.video||'',lessons:+p.lessons||0,mc:(p.mc||[]).filter(function(n){return mcFor(p).some(function(m){return m.n===n})})}})],function(r){setD(r);render();toast('Saved · '+r.ppl.length+' people')});return}
  if(b.id==='rep'){S.rep={date:document.getElementById('rd').value,cur:document.getElementById('rc').value,amt:document.getElementById('ra').value,name:document.getElementById('rn').value};
    if(!S.rep.date||!S.rep.amt){toast('Please enter the date and amount.');return}
    run('intlReport',[S.tok,S.rep],function(r){S.rep={cur:S.rep.cur};var keep=S.dirty?S.list:null;setD(r);if(keep){S.list=keep;S.dirty=true}render();toast('Transfer reported. Thank you!')});return}});
window.addEventListener('beforeunload',function(e){if(S.dirty){e.preventDefault();e.returnValue=''}});
render();
google.script.run.withSuccessHandler(function(r){if(r&&r.test){S.test=true;if(!S.D)render()}}).intlTestInfo();
</script>
