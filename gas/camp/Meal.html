<!doctype html><!-- build: 20261111-231036 --><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<base target="_top">
<!-- 식권 스캐너 (11-04) — 2026 여름 「식권 QR」 스캐너를 캠프에 옮김
  · 주소: 캠프 앱 ?page=meal  (app.suzukimusickorea.org/camp/meal.html 이 여기로 보냄)
  · 바코드건(MQ160W)이 고유번호를 치고 Enter → 새로 고치지 않고 바로 서버에 기록 → 다음 스캔
  · 판정 없이 「제출 완료」, 발급 기록에 없는 번호만 「등록되지 않은 QR」 (여름과 같음) -->
<style>
:root{--ok:#16a34a;--warn:#6b7280;--err:#dc2626;--ink:#18203a;--muted:#5d6680;--bg:#eef0f4}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:600 17px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-user-select:none;user-select:none}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px 30px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.top b{font-size:19px}.top small{color:var(--muted);font-weight:500;font-size:13px}
.card{background:#fff;border-radius:16px;box-shadow:0 4px 15px rgba(0,0,0,.06);padding:26px 18px;text-align:center;border-top:10px solid #3b82f6;min-height:250px;display:flex;flex-direction:column;justify-content:center;gap:8px;transition:border-color .15s}
.card h1{margin:0;font-size:38px;line-height:1.2}
.card .msg{font-size:23px}
.card .sub{font-size:15px;color:var(--muted);font-weight:500}
.card .note{font-size:15px;color:#92400e;background:#fef3c7;border-radius:8px;padding:4px 10px;align-self:center}
.card.ok{border-top-color:var(--ok)}.card.ok h1{color:var(--ok)}
.card.no{border-top-color:var(--warn)}.card.no h1{color:var(--warn)}
.card.err{border-top-color:var(--err)}.card.err h1{color:var(--err)}
.card.wait h1{color:#3b82f6;font-size:30px}
#scan{display:block;margin:16px auto 0;width:100%;max-width:340px;padding:12px;font-size:16px;text-align:center;border:2px solid #3b82f6;border-radius:10px;color:var(--ink);background:#fff}
.row{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:12px;font-size:14px;color:var(--muted);font-weight:500}
.row input{font:inherit;padding:6px 8px;border:1px solid #cbd5e1;border-radius:8px;width:130px;-webkit-user-select:text;user-select:text}
.cnt{font-size:15px;color:var(--ink)}
ul{list-style:none;padding:0;margin:16px 0 0;background:#fff;border-radius:12px;overflow:hidden}
li{display:flex;justify-content:space-between;gap:8px;padding:9px 14px;border-top:1px solid #eef0f4;font-size:14px;font-weight:500}
li:first-child{border-top:0}li .t{color:var(--muted);font-variant-numeric:tabular-nums}
li.ok b{color:var(--ok)}li.no b{color:var(--warn)}li.err b{color:var(--err)}li.wait b{color:#3b82f6}
.snd{margin-top:10px;text-align:center;font-size:14px;color:#1d4ed8}
</style></head><body>
<div class="wrap">
  <div class="top"><div><b>식권 제출 스캐너</b><br><small id="camp">불러오는 중…</small></div><div class="cnt" id="cnt">이 기기 0장</div></div>
  <div class="card wait" id="card"><h1>스캔 대기 중</h1><div class="msg">참가자의 QR 코드를 스캔해 주세요.</div><div class="sub" id="clock"></div></div>
  <input id="scan" type="text" inputmode="none" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="스캔 대기 중…" aria-label="스캔 입력">
  <div class="snd" id="snd">화면을 한 번 눌러 주세요 (소리 켜기)</div>
  <div class="row"><label for="dev">자리 이름</label><input id="dev" type="text" placeholder="예: 식당 1" maxlength="20"><span>여러 대를 쓸 때 시트에 같이 적혀요</span></div>
  <ul id="log" aria-live="polite"></ul>
</div>
<script>
(function () {
  var inp = document.getElementById('scan'), card = document.getElementById('card'), devIn = document.getElementById('dev');
  var idle = null, back = null, n = 0, seq = 0, ctx = null, LOG = [];
  var store = { get: function (k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }, set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
  devIn.value = store.get('mealDev'); n = +store.get('mealCnt_' + today()) || 0; showCnt();
  devIn.addEventListener('input', function () { store.set('mealDev', devIn.value.trim()); });
  function today() { var d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }
  function pad(x) { return (x < 10 ? '0' : '') + x; }
  function clock() { var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function showCnt() { document.getElementById('cnt').textContent = '이 기기 ' + n + '장'; }
  function focusIn() { if (document.activeElement !== devIn) inp.focus(); }
  function sound(ok) {
    try {
      if (!ctx) { var A = window.AudioContext || window.webkitAudioContext; if (!A) return; ctx = new A(); }
      if (ctx.state === 'suspended') ctx.resume();
      var beep = function (f, dur, delay, type) { var o = ctx.createOscillator(), g = ctx.createGain(); o.type = type || 'sine'; o.frequency.value = f; g.gain.value = 0.35; o.connect(g); g.connect(ctx.destination); var t = ctx.currentTime + (delay || 0); o.start(t); o.stop(t + dur); };
      if (ok) { beep(880, 0.12, 0); beep(1318, 0.16, 0.13); } else beep(220, 0.22, 0, 'square');
    } catch (e) {}
  }
  function unlock() { sound(true); document.getElementById('snd').style.display = 'none'; document.removeEventListener('touchstart', unlock); document.removeEventListener('mousedown', unlock); }
  document.addEventListener('touchstart', unlock); document.addEventListener('mousedown', unlock);
  function show(cls, h, msg, sub, note) {
    card.className = 'card ' + cls;
    card.innerHTML = '<h1>' + h + '</h1>' + (msg ? '<div class="msg">' + msg + '</div>' : '') + (note ? '<div class="note">' + note + '</div>' : '') + (sub ? '<div class="sub">' + sub + '</div>' : '');
    clearTimeout(back);
    if (cls !== 'wait') back = setTimeout(function () { show('wait', '스캔 대기 중', '참가자의 QR 코드를 스캔해 주세요.', ''); }, 3000);
  }
  function logPut(id, cls, what, no, t) {
    var x = null; for (var i = 0; i < LOG.length; i++) if (LOG[i].id === id) x = LOG[i];
    if (!x) { x = { id: id }; LOG.unshift(x); if (LOG.length > 8) LOG.pop(); }
    x.cls = cls; x.what = what; x.no = no; x.t = t;
    document.getElementById('log').innerHTML = LOG.map(function (y) { return '<li class="' + y.cls + '"><span><b>' + esc(y.what) + '</b> · ' + esc(y.no) + '</span><span class="t">' + esc(String(y.t).slice(11)) + '</span></li>'; }).join('');
  }
  function send(no, id, tries) {
    google.script.run.withSuccessHandler(function (r) {
      if (r && r.found) {
        n++; store.set('mealCnt_' + today(), n); showCnt();
        var what = (r.kind ? r.kind + ' · ' : '') + (r.label || '');
        show('ok', '&#9989; 제출 완료', esc(what) + '<br>식권이 정상 제출되었습니다.', 'NO. ' + esc(r.no) + ' · ' + esc(r.at), r.before ? '이 번호는 ' + (r.before + 1) + '번째 제출이에요' : '');
        sound(true); logPut(id, 'ok', r.before ? '제출 완료 (' + (r.before + 1) + '번째)' : '제출 완료', r.no, r.at);
      } else {
        show('no', '&#9888;&#65039; 등록되지 않은 QR', '발급 기록을 찾을 수 없습니다.', 'NO. ' + esc(r && r.no) + ' · ' + esc((r && r.at) || clock()));
        sound(false); logPut(id, 'no', '등록되지 않은 QR', (r && r.no) || no, (r && r.at) || clock());
      }
    }).withFailureHandler(function (e) {
      if ((tries || 0) < 3) { setTimeout(function () { send(no, id, (tries || 0) + 1); }, 1200 * ((tries || 0) + 1)); logPut(id, 'wait', '다시 보내는 중', no, clock()); return; }
      show('err', '보내지 못했어요', '인터넷 연결을 확인하고 다시 스캔해 주세요.', esc(no)); sound(false); logPut(id, 'err', '보내지 못함 · 다시 스캔', no, clock());
    }).mealScan(no, devIn.value.trim());
  }
  function submitScan() {
    clearTimeout(idle);
    var raw = inp.value.trim(); inp.value = ''; if (!raw) return;
    var m = raw.match(/([1-4]-[0-9]{6}-[0-9]{6})/), no = m ? m[1] : raw.slice(0, 40), id = ++seq;
    if (!m) { show('no', '&#9888;&#65039; 등록되지 않은 QR', '식권 번호 모양이 아니에요.', esc(no) + ' · ' + clock()); sound(false); logPut(id, 'no', '번호 모양 아님', no, clock()); return; }
    show('wait', '확인 중…', 'NO. ' + esc(no), ''); logPut(id, 'wait', '확인 중', no, clock());
    send(no, id, 0);
  }
  inp.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === 'Tab') { e.preventDefault(); submitScan(); } });
  inp.addEventListener('input', function () { clearTimeout(idle); idle = setTimeout(submitScan, 150); });
  document.body.addEventListener('click', focusIn);
  setInterval(focusIn, 400); focusIn();
  setInterval(function () { var c = document.getElementById('clock'); if (c) c.textContent = clock(); }, 1000);
  google.script.run.withSuccessHandler(function (r) { document.getElementById('camp').textContent = (r && r.camp) || ''; }).withFailureHandler(function () { document.getElementById('camp').textContent = ''; }).mealHello();
})();
</script>
</body></html>
