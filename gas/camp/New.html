let WHO='김스즈',LIVE=false;const REGL=()=>{try{return P.picked.filter(x=>!S.token||(x.done&&x.no)).map(x=>({n:x.n,k:x.k,i:NOPLAY(x.k)?'':instOf(x),pid:x.no?x.no+'_'+x.key:'',t:x.owner&&x.owner!==WHO?x.owner:''}))}catch(e){return []}};

const KEY=m=>m.pid||((m.a||ACAD)+'|'+m.n),RN=()=>((S.mem.find(m=>KEY(m)===S.rep)||{}).n||'');const OTH=[{n:'이두리',k:'학생',i:'첼로',y:2013,a:'마포스즈키',t:'박선생'},{n:'김하나',k:'학생',i:'바이올린',y:2015,a:'마포스즈키',t:'박선생'},{n:'이엄마',k:'첫번째 보호자',a:'마포스즈키',t:'박선생'},{n:'최하늘',k:'학생',i:'플루트',y:2016,a:'수지스즈키',t:'정선생'}];const REGA=()=>REGL().map(m=>({...m,a:ACAD})).concat(OTH);const REPOK=k=>k==='학생'||k==='교사';

 <div class="flow"><div class="card"><b>① 개별 접수</b><span class="hint">교사 · 학생 · 보호자 · 동반가족을 모두 여기서 접수해요. 3단계에 가족 칸이 없어요.</span></div><div class="arr" aria-hidden="true">→</div><div class="card"><b>② 가족 신청</b><span class="hint">접수된 사람을 찾아 가족 · 가족방으로 묶기만 해요. 선생님이 해요.</span></div></div>

 ${I0.err?`<p class="hint" style="color:var(--warn);font-weight:700;margin:0">${esc(I0.err)}</p>`:''}<div class="row" style="justify-content:flex-end;gap:6px"><button class="btn sm" type="button" data-igx="1">닫기</button><button class="btn sm pri" type="button" data-igo="1">캠프 신청하고 ${I0.rep?'대표로':'가족방에 넣기'}</button></div></div>`}
function iregGo(){const I0=S.ireg,m=I0.m,stu=STU3(m.k);const g=id=>((document.getElementById(id)||{}).value||'').trim();if(stu){I0.age=g('ig_age');I0.prog=g('ig_prog');I0.t=g('ig_t')}

 const x={n:m.n,k:m.k,i:m.i||'',sub:ACAD+(m.direct?' · 직접 추가':' · 회원'),id:m.id,done:true,now:true,at:nowTs()};P.picked.push(x);Object.assign(inf(x),{sex:I0.sex,age:I0.age||'',prog:I0.prog||'',t:I0.t||'',saved:true});
 const it={k:m.k,n:m.n,sub:ACAD+(m.i?' · '+m.i:'')+' · 방금 캠프 신청',st:'ok'};if(I0.rep){S.rep=KEY(it);S.mem=S.mem.filter(q=>KEY(q)!==S.rep);S.mem.unshift(it)}else S.mem.push(it);
 S.ireg=null;S.fdir=null;render();toast(m.n+' · 캠프 신청하고 '+(I0.rep?'대표로 골랐어요':'가족방에 넣었어요'))}
document.addEventListener('click',e=>{const b=e.target.closest('[data-ireg],[data-ig],[data-igo],[data-igx],[data-fdk],[data-fdgo]');if(!b)return;const d=b.dataset;e.stopImmediatePropagation();
 if(d.ireg){const [n,rep]=d.ireg.split('|');const m=MEMBERS.find(x=>x.a===ACAD&&x.n===n);if(m)S.ireg={m,rep:rep==='rep',sex:/^여/.test(m.g||'')?'여성':/^남/.test(m.g||'')?'남성':'',age:m.y?String(2026-m.y):'',t:m.t||''};render();return}

function vNew(){const T=total();
