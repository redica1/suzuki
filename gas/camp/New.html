<style>
/* 캠프 접수 화면과 같은 청록 · 한 칸 폭 앱 화면 */

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1A1C;--surface:#16252A;--sunk:#1C2F34;--ink:#E4EEF0;--muted:#9FB3B8;--line:#2A4148;--accent:#3CC2BC;--accentD:#5ED4CE;--soft:#163A3A;--warn:#F2B35A;--warnbg:#3A2C14;--ok:#6BD39B;--okbg:#173527;--band:#0B6F6C;--bandInk:#F2FBFA;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1A1C;--surface:#16252A;--sunk:#1C2F34;--ink:#E4EEF0;--muted:#9FB3B8;--line:#2A4148;--accent:#3CC2BC;--accentD:#5ED4CE;--soft:#163A3A;--warn:#F2B35A;--warnbg:#3A2C14;--ok:#6BD39B;--okbg:#173527;--band:#0B6F6C;--bandInk:#F2FBFA;color-scheme:dark}
*{box-sizing:border-box}

.band{background:var(--band);color:var(--bandInk);padding-block:18px 16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.tabs{display:flex;gap:6px;flex-wrap:wrap}
.mineT td,.mineT th{white-space:nowrap;padding:8px}.mineT td.nm{white-space:normal}.mineT td.nm .kind{display:table;margin:0 auto 3px}.mineT td.nm b{display:block;font-size:16px}
.mineT td.tsc{text-align:left;font-size:12.5px;color:var(--muted);line-height:1.35}.mineT .tsl{display:block}.mineT .rmtag{display:block;font-size:12px;font-weight:500;color:var(--ink)}.mineT .rmtag.rep{color:var(--accent);font-weight:700}
.mineT td.r,.mineT th.r{text-align:right}.amtL{display:inline-flex;align-items:center;gap:6px}.udot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#c0392b}.udot.or{background:#e67e22}.uamt{color:#c0392b;font-weight:500}.amt2{font-size:12px;color:var(--muted)}
.mineT .actc{display:flex;flex-direction:column;align-items:flex-end;gap:4px}.mineT input[type=checkbox]{width:16px;height:16px}
.fr0>td{background:#fff4e0}.fr1>td{background:#e8f1ff}.fr2>td{background:#f1e9ff}.fr3>td{background:#e6f7ec}.fr4>td{background:#ffe9ef}.fr5>td{background:#e9f7f7}
.tabs[hidden]{display:none}
.cxr{display:block}.cxr summary{cursor:pointer;font-size:16px;list-style:none}.cxr summary::-webkit-details-marker{display:none}.cxr summary::before{content:'▶ ';font-size:13px}.cxr[open] summary::before{content:'▼ '}.cxr[open] summary{margin-bottom:12px}.cxr .tbl{margin-bottom:8px}
.itabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 0 12px}.itabs button{font:inherit;font-size:16px;font-weight:700;background:none;border:0;border-bottom:2.5px solid transparent;color:var(--muted);padding:10px 14px;cursor:pointer;margin-bottom:-1px}.itabs button[aria-pressed=true]{color:var(--ink);border-bottom-color:var(--accentD)}
.mvT td.l{text-align:left}
.fchips{display:flex;gap:8px;flex-wrap:wrap;margin:2px 0 4px}.fchips button{font:inherit;font-size:15px;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 16px;cursor:pointer}.fchips button span{font-weight:500;color:var(--muted)}.fchips button[aria-pressed=true]{background:var(--accentD);border-color:var(--accentD);color:#fff}.fchips button[aria-pressed=true] span{color:#fff}.fchips button:disabled{opacity:.4;cursor:default}.fchips .clr{font-weight:500;color:var(--muted);border-style:dashed}

.tabs button{font:inherit;font-size:15px;font-weight:700;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 14px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.panel{margin:0 0 18px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px;min-width:0}
h2{margin:0;font-size:20px}
h3{margin:0;font-size:16.5px}
.hint{color:var(--muted);font-size:14px;margin:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
select,input{font:inherit;font-size:15.5px;padding:9px 11px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);min-width:0}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn{font:inherit;font-size:15px;font-weight:700;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:9px 14px;cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.sm{font-size:13.5px;padding:5px 10px}
.btn:disabled{opacity:.45;cursor:default}
.step{display:flex;gap:10px;align-items:baseline}
.step b.n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--surface);display:inline-grid;place-items:center;font-size:14px}
.mem{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--sunk)}
.kind{font-size:12.5px;font-weight:700;border-radius:999px;padding:2px 9px;white-space:nowrap;background:var(--soft);color:var(--accentD)}
.kind.p{background:var(--warnbg);color:var(--warn)}
.who{min-width:0}.who b{display:block}.who small{color:var(--muted);font-size:13px}
.pill{font-size:12.5px;font-weight:700;border-radius:999px;padding:2px 9px;white-space:nowrap}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.wait{background:var(--warnbg);color:var(--warn)}
.found{border:1.5px solid var(--accent);border-radius:12px;padding:10px 12px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;background:var(--soft)}
.none{border:1.5px dashed var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:8px}
.seg2{display:inline-flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;justify-self:start}.seg2 button{font:inherit;font-size:15px;font-weight:700;border:0;background:var(--surface);color:var(--ink);padding:9px 18px;cursor:pointer}.seg2 button[aria-pressed="true"]{background:var(--accent);color:var(--surface)}
.drow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.drow #an{flex:1;min-width:120px}
.grid3{display:grid;grid-template-columns:2fr auto 1.3fr auto;gap:8px;align-items:center}
@media (max-width:560px){.grid3{grid-template-columns:1fr 1fr}.grid3 .btn{grid-column:1/-1}}
.sw{display:flex;align-items:center;gap:10px;font-weight:700}
.sw input{width:20px;height:20px;accent-color:var(--accent)}
table{width:100%;border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:center}
td.l,th.l{text-align:left}
tfoot td{font-weight:700;border-top:2px solid var(--line);background:var(--sunk)}
.tbl{overflow-x:auto}
.mock{font-size:12.5px;color:var(--muted);text-align:center}
.note{border-radius:12px;padding:10px 12px;background:var(--soft);font-size:14.5px}
.flow{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:stretch}
.flow .card{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface);display:grid;gap:4px}
/* 2단계 */
.kchips{display:flex;gap:6px;flex-wrap:wrap}.kchips button{font:inherit;font-size:14px;font-weight:700;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer}.kchips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.res{display:grid;gap:6px}.res .it{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;border:1px solid var(--line);border-radius:12px;padding:8px 12px;background:var(--sunk)}
.ros{display:grid;gap:0}.ros label{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 4px;border-bottom:1px solid var(--line);cursor:pointer}.ros input{width:18px;height:18px;accent-color:var(--accent)}
.picked{display:flex;gap:6px;flex-wrap:wrap}.chipP{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 10px;background:var(--sunk);font-size:14.5px}.chipP button{border:0;background:none;color:var(--muted);font:inherit;cursor:pointer;padding:0 4px}
.flow .arr{display:grid;place-items:center;color:var(--accent);font-weight:700;font-size:20px}
.home{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}@media (max-width:560px){.home{grid-template-columns:1fr}}
.hbox{display:grid;gap:8px;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:22px 22px 18px;cursor:pointer;font:inherit;color:var(--ink);min-height:150px;align-content:start}
.hbox:hover{border-color:var(--accent);box-shadow:0 6px 20px rgba(15,138,134,.12)}.hbox .no{font-size:13px;font-weight:700;color:var(--accent);letter-spacing:.5px}.hbox b{font-size:21px}.hbox p{margin:0;color:var(--muted);font-size:14.5px;line-height:1.5}.hbox .st{margin-top:auto;font-size:14px;font-weight:700;color:var(--accentD)}
.login{max-width:420px;margin:30px auto;display:grid;gap:12px}.login input{width:100%}
@media (max-width:560px){.flow{grid-template-columns:1fr}.flow .arr{transform:rotate(90deg)}}
</style>

<div class="band"><div class="in"><h1>2027 스즈키 겨울 음악제 접수</h1><p id="who">미리보기 (가상 데이터)</p></div></div>
<main class="wrap">
  <div class="tabs" id="nav" role="group" aria-label="메뉴" hidden>
    <button type="button" data-tab="home" aria-pressed="false">홈</button>
    <button type="button" data-tab="pick" aria-pressed="false">캠프 신청하기</button>
    <button type="button" data-tab="mine" aria-pressed="false">내 신청 내역</button>
    <button type="button" data-tab="new" aria-pressed="false">가족방 신청</button>
    <button type="button" data-tab="ens" aria-pressed="false">앙상블 신청</button>
  </div>
  <div id="view"></div>
  <p class="mock">미리보기 화면이에요. 이름 · 학원은 모두 가상이고, 가족방 빈자리 금액은 STG 설정 기준이에요.</p>
</main>

<script>
const FEE={'보호자':1,'동반가족':1,'15개월 미만':1};const ROOM_EMPTY=140000,CAP=4;
const MY=[{n:'이하나',y:2016,i:'바이올린',a:'미사스즈키'},{n:'박두리',y:2014,i:'바이올린',a:'미사스즈키'},{n:'최세찬',y:2017,i:'첼로',a:'미사스즈키'},{n:'정다온',y:2015,i:'바이올린',a:'미사스즈키'}];
const ALL=[...MY,{n:'이두리',y:2013,i:'첼로',a:'마포스즈키',t:'박선생',k:'학생'},{n:'이세나',y:2019,i:'바이올린',a:'수지스즈키',t:'한선생',k:'학생'},{n:'김엄마',y:1984,i:'악기 안 함',a:'미사스즈키',k:'보호자'},{n:'이막내',y:2025,i:'악기 안 함',a:'미사스즈키',k:'15개월 미만'}];
const ACADS=['미사스즈키','마포스즈키','수지스즈키','춘천바이첼스즈키','분당스즈키','대구스즈키'];
const won=n=>n.toLocaleString('ko-KR')+'원';const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let WHO='김스즈',LIVE=false;const REGL=()=>{try{return P.picked.map(x=>({n:x.n,k:x.k,i:NOPLAY(x.k)?'':instOf(x)}))}catch(e){return []}};const OTH=[{n:'이두리',k:'학생',i:'첼로',y:2013,a:'마포스즈키',t:'박선생'},{n:'김하나',k:'학생',i:'바이올린',y:2015,a:'마포스즈키',t:'박선생'},{n:'이엄마',k:'첫번째 보호자',a:'마포스즈키',t:'박선생'},{n:'최하늘',k:'학생',i:'플루트',y:2016,a:'수지스즈키',t:'정선생'}];const REGA=()=>REGL().map(m=>({...m,a:'미사스즈키'})).concat(OTH);const REPOK=k=>k==='학생'||k==='교사';
let S={tab:'login',ens:{on:'',name:'',mates:[],song:'',comp:'',n:'',aq:'',team:''},rep:'이하나',mem:[],q:{a:'미사스즈키',n:''},res:null,manual:false,room:false,done:false,list:[{rep:'박두리',names:['박두리','박아빠','박막내','정다온'],n:4,room:true,amt:0,st:'입금 전'}]};
function reset(){S.mem=[];S.rep='';S.res=null;S.manual=false;S.done=false}
reset();
function total(){let t=0;const empty=S.room?Math.max(0,CAP-S.mem.length):0;return {p:t,empty,room:empty*ROOM_EMPTY,all:t+empty*ROOM_EMPTY}}
function vFlow(){return `<div class="panel"><h2>접수를 둘로 나눠요</h2>
 <div class="flow"><div class="card"><b>① 개별 접수</b><span class="hint">교사 · 학생 · 보호자 · 동반가족을 모두 여기서 접수해요. 3단계에 가족 칸이 없어요.</span></div><div class="arr" aria-hidden="true">→</div><div class="card"><b>② 가족 신청</b><span class="hint">접수된 사람을 찾아 가족 · 가족방으로 묶기만 해요. 선생님이 해요.</span></div></div>
 <div class="note">다른 학원 · 다른 선생님이 접수한 형제도 <b>학원 → 정확한 이름</b>으로 찾아 한 가족으로 묶어요. 직접 입력은 없어요. 캠프에 먼저 접수된 사람만 골라요.</div></div>`}
function vNew(){const T=total();
 if(S.done)return `<div class="panel"><h2>가족 신청을 받았어요</h2><p class="hint">${S.mem.map(m=>esc(m.n)).join(' · ')} · ${S.mem.length}명${S.room?' · 가족방':''} · 입금하실 금액 <b>${won(T.all)}</b></p><p class="hint">「내 접수 › 입금 신고」에서 함께 신고해요.</p><div class="row"><button class="btn pri" type="button" data-act="toList">내 가족 목록</button><button class="btn" type="button" data-act="again">가족 하나 더</button></div></div>`;
 const sw=`<div class="panel"><label class="sw" for="room" style="font-size:17px;font-weight:700"><input type="checkbox" id="room" ${S.room?'checked':''}> ${S.list.length?'가족방 하나 더 신청합니다':'가족방 신청합니다'}</label><p class="hint" style="margin:6px 0 0 28px">${S.room?`가족방은 ${CAP}인 기준이에요. 빈자리 1자리마다 ${won(ROOM_EMPTY)}.`:'체크하면 접수한 사람 목록이 펼쳐져요.'}</p></div>`;
 if(!S.room)return sw;
 const inMem=n=>S.mem.some(m=>m.n===n),qa=S.q.a||'미사스즈키',qn=S.q.n||'',cand=REGA().filter(m=>m.a===qa&&!inMem(m.n)&&qn&&m.n.includes(qn));
 return sw+`<div class="panel"><div class="step"><b class="n">1</b><div><h3>함께 갈 가족 찾기</h3><p class="hint">캠프에 접수한 사람 중에서 이름으로 찾아요. 우리 학원 사람도, 다른 학원 형제도 여기서 넣어요. 다른 학원이면 학원을 바꿔서 찾아요.</p></div></div>
 <div class="row"><select id="qa" aria-label="학원">${ACADS.map(a=>`<option ${a===qa?'selected':''}>${a}</option>`).join('')}</select><input id="qn" placeholder="이름으로 찾기" value="${esc(qn)}" style="flex:1;min-width:140px"></div>
 ${cand.length?cand.map(m=>`<div class="mem"><span class="kind ${FEE[m.k]?'p':''}">${esc(m.k)}</span><span class="who"><b>${esc(m.n)}</b><small>${esc(m.a)}${m.i?' · '+esc(m.i):''}${m.y?' · '+m.y+'년생':''}${m.t?' · '+esc(m.t)+' 선생님 접수':''}</small></span><button class="btn sm" type="button" data-radd="${esc(m.n)}" data-ra="${esc(m.a)}">+ 추가</button></div>`).join(''):`<div class="none"><b>${qn?`「${esc(qa)} · ${esc(qn)}」은 캠프 접수에 없어요`:'이름을 넣어 찾아요'}</b>${qn?'<span class="hint">먼저 캠프에 접수해 주세요. 다른 선생님 학생이면 그 선생님께 접수를 부탁해 주세요.</span>':''}</div>`}

 </div>
 <div class="panel"><div class="step"><b class="n">2</b><div><h3>대표 고르기 · 가족 ${S.mem.length}명</h3><p class="hint">대표는 꼭 <b>학생</b> 또는 <b>교사</b>여야 해요. 「대표로」를 눌러요.</p></div></div>${S.mem.length?'':'<p class="hint">위에서 가족을 찾아 넣어요.</p>'}
 ${S.mem.map((m,i)=>`<div class="mem"><span class="kind ${FEE[m.k]?'p':''}">${esc(m.k)}</span><span class="who"><b>${esc(m.n)}</b><small>${esc(m.sub)}</small></span><span class="row" style="gap:6px">${m.n===S.rep?'<span class="pill ok">대표</span>':REPOK(m.k)?`<button class="btn sm" type="button" data-mkrep="${esc(m.n)}">대표로</button>`:''}<button class="btn sm" type="button" data-rm="${i}">빼기</button></span></div>`).join('')}${S.mem.length&&!S.mem.some(m=>m.n===S.rep)?'<p class="hint" style="color:var(--warn);font-weight:700;margin:0">대표를 골라 주세요.</p>':''}
 <div class="tbl"><table><thead><tr><th class="l">내역</th><th>인원</th><th>금액</th></tr></thead><tbody>
 <tr><td class="l">가족방 빈자리 (${CAP}인 기준)</td><td>${T.empty}</td><td>${won(T.room)}</td></tr>
 <tr><td class="l">참가비 (각자 접수에서)</td><td>${S.mem.length}</td><td class="hint">-</td></tr>

function loadLive(r){if(!r)return;LIVE=true;WHO=r.head||WHO;const A='미사스즈키';

function vLogin(){return `<div class="panel login"><h2 style="margin:0">캠프 접수 미리보기</h2><p class="hint" style="margin:0">미사스즈키 원장님으로 들어가요. STG 명단(선생님 · 학생 · 교수진)을 불러와요. 여기서 고른 것은 저장되지 않아요.</p>

function vHome(){let sum=0;P.picked.forEach(x=>sum+=feeOf(x));const rm=S.list.filter(x=>x.room).length,E=S.ens;
 const box=(t,no,b,d,st)=>`<button type="button" class="hbox" data-tab="${t}"><span class="no">${no}</span><b>${b}</b><p>${d}</p><span class="st">${st}</span></button>`;
 return `<div class="panel" style="margin-bottom:14px"><h2 style="margin:0">${esc(WHO)} 원장님, 안녕하세요</h2><p class="hint" style="margin:4px 0 0">미사스즈키 · 1차 접수 12월 1일 ~ 7일 · 하고 싶은 일을 골라요.</p></div>
 <div class="home">${box('pick','1','캠프 신청하기','우리 학원 학생 · 선생님 · 가족을 찾아서 신청해요.',P.picked.length?`${P.picked.length}명 신청 중 →`:'시작하기 →')}
 ${box('mine','2','내 신청 내역','신청한 사람 · 금액을 보고, 고치기 · 입금 신고 · 취소 요청을 해요.',`입금 전 · ${won(sum)} →`)}
 ${box('new','3','가족방 신청','캠프에 신청한 사람끼리 가족으로 묶어 한 방을 써요.',rm?`${rm}가족 신청됨 →`:'신청 안 함 →')}
 ${box('ens','4','앙상블 신청','여러 학원이 한 팀이 돼요. 대표 학원 한 곳에서만 신청해요.',E.on==='rep'&&E.done?`「${esc(E.name)}」 대표 →`:E.on==='mem'&&E.team?`「${esc(E.team)}」 팀에 함께 →`:'신청 안 함 →')}</div>`}

function vEns(){const E=S.ens,seg=(v,t)=>`<button type="button" data-eon="${v}" aria-pressed="${E.on===v}">${t}</button>`;
 const cands=E.aq?ACADS.filter(a=>a!=='미사스즈키'&&!E.mates.includes(a)&&a.includes(E.aq)):[];
 return `<div class="panel"><h2 style="margin:0">앙상블 신청</h2><p class="hint">앙상블은 여러 학원이 모여 한 팀이 돼요. 팀의 대표 학원 한 곳에서만 신청해요.</p>

 ${E.on==='rep'?`<div class="panel"><div class="grid3"><input data-en="name" placeholder="팀 이름 *" value="${esc(E.name)}" style="grid-column:span 2"><input data-en="n" placeholder="인원 *" inputmode="numeric" value="${esc(E.n)}"></div>

  <input id="enAq" placeholder="학원 이름으로 찾아서 추가" value="${esc(E.aq)}" style="width:100%;margin-top:8px">
  ${cands.map(a=>`<div class="mem"><span class="who"><b>${esc(a)}</b></span><button class="btn sm" type="button" data-eadd="${esc(a)}">+ 추가</button></div>`).join('')}

 :E.on==='mem'?`<div class="panel"><p class="hint" style="margin-top:0">우리 학원이 들어갈 팀을 골라요. 곡 · 인원은 대표 학원이 넣어요.</p>${TEAMS.map(t=>`<div class="mem"><span class="who"><b>${esc(t.name)}</b><small>대표 ${esc(t.rep)}${t.mates.length?' · '+t.mates.map(esc).join(' · '):''}</small></span>${E.team===t.name?'<span class="pill ok">함께해요</span>':`<button class="btn sm" type="button" data-eteam="${esc(t.name)}">이 팀에 함께</button>`}</div>`).join('')}<p class="hint">찾는 팀이 없으면 대표 학원이 먼저 신청해야 해요.</p></div>`
 :'<div class="panel"><p class="hint" style="margin:0">앙상블에 나가지 않아요.</p></div>'}`}

document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;

 if(d.eon!==undefined){S.ens.on=d.eon;render();return}

 if(d.act==='ensSave'){const E=S.ens;E.err=!E.name.trim()?'팀 이름을 넣어 주세요.':!E.n.trim()?'인원을 넣어 주세요.':!E.song.trim()||!E.comp.trim()?'곡명 · 작곡가를 넣어 주세요.':'';if(!E.err)E.done=true;render();return}
 if(d.act==='payRep'){S.paid=true;render();return}
 if(d.mf){S.mf=d.mf;render();return}
 if(d.scope){S.scope=d.scope;S.mck={};render();return}

 if(d.mv){S.mv=d.mv;S.ms='';S.mf2='전체';render();return}

 if(d.act==='mckAll'){const LS=(S.scope==='all'?P.picked.concat(othersOf()):P.picked),ce=x=>(S.role||'head')==='head'||!x.owner||x.owner===WHO;const on=!(LS.length&&LS.every((x,i)=>!ce(x)||(S.mck&&S.mck[i])));S.mck={};if(on)LS.forEach((x,i)=>{if(ce(x))S.mck[i]=true});render();return}

 if(d.rm){const x=S.mem.splice(+d.rm,1)[0];if(x&&x.n===S.rep)S.rep='';render();return}

 if(d.act==='manual'){S.manual=true;render();return}
 if(d.act==='addManual'){const n=v('mn').trim();if(!n)return;S.mem.push({k:'학생',n,sub:`${v('my')||'출생연도 -'} · ${v('mi')} · 직접 입력`,st:'wait'});S.res=null;S.manual=false;S.q.n='';render();return}
 if(d.act==='addP'){const n=v('pn').trim();if(!n)return;S.mem.push({k:v('pk'),n,sub:v('ps')+' · 캠프 같이 와요'});render();return}
