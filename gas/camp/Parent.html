const UI_DOMAINS=['naver.com','gmail.com','daum.net','hanmail.net','kakao.com','nate.com','icloud.com','hotmail.com'];
function uiEsplit(el){if(el.dataset.esdone)return;el.dataset.esdone='1';const D=UI_DOMAINS,w=document.createElement('span');w.className='esplit';
  w.style.cssText='display:flex;flex-wrap:wrap;gap:6px;align-items:center;width:100%';
  w.innerHTML='<input type="text" class="esU" placeholder="아이디" autocomplete="username" autocapitalize="off" spellcheck="false" aria-label="이메일 아이디" style="flex:1 1 40%;min-width:90px;width:auto"><span style="color:inherit;opacity:.6">@</span><select class="esD" aria-label="이메일 주소" style="flex:1 1 40%;min-width:110px;width:auto"><option value="-">선택하기</option>'+D.map(x=>'<option>'+x+'</option>').join('')+'<option value="">직접 입력</option></select><input type="text" class="esX" placeholder="예: school.ac.kr" autocapitalize="off" spellcheck="false" aria-label="이메일 주소 직접 입력" hidden style="flex:1 1 100%;width:auto">';
  el.after(w);el.hidden=true;el.style.display='none';const U=w.querySelector('.esU'),S=w.querySelector('.esD'),X=w.querySelector('.esX');
  const proto=Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,'value');
  const show=v=>{v=String(v||'');const at=v.indexOf('@'),u=at>=0?v.slice(0,at):v,d=at>=0?v.slice(at+1):'',k=D.includes(d);U.value=u;S.value=!d?'-':k?d:'';X.value=k?'':d;X.hidden=!(d&&!k)&&S.value!==''};
  const pull=()=>{const u=U.value.trim(),dv=S.value,d=dv==='-'?'':(dv||X.value.trim());const v=u.includes('@')?u:(u&&d?u+'@'+d.replace(/^@/,''):u);proto.set.call(el,v.toLowerCase());el.dispatchEvent(new Event('input',{bubbles:true}))};
  Object.defineProperty(el,'value',{configurable:true,get(){return proto.get.call(el)},set(v){proto.set.call(el,v);show(v)}});
  show(proto.get.call(el));U.addEventListener('input',pull);X.addEventListener('input',pull);S.addEventListener('change',()=>{X.hidden=S.value!=='';if(S.value==='')X.focus();pull()});
  U.addEventListener('keydown',e=>{if(e.key==='Enter'){pull();el.dispatchEvent(new KeyboardEvent('keydown',{key:'Enter',bubbles:true}))}})}
function uiEsplitAll(){document.querySelectorAll('input[data-esplit]:not([data-esdone])').forEach(uiEsplit)}
new MutationObserver(()=>{clearTimeout(uiEsplitAll.t);uiEsplitAll.t=setTimeout(uiEsplitAll,20)}).observe(document.documentElement,{childList:true,subtree:true});
