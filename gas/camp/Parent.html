var PGUIDE="<p>학원에 다니는 학생의 학부모가 <b>회원가입 없이</b> 캠프 참가를 학원에 알리는 화면이에요. 캠프 접수 첫 화면의 「학부모」 카드나 학원이 보내 준 주소로 들어와요. 궁금한 건 학원 선생님께 여쭤 주세요. <b>이번 캠프는 일부 학원만</b> 학부모 신청을 받아요. 학원 목록에 다니는 학원이 없으면 지금처럼 학원 선생님께 신청해 주세요.</p><h4>1. 보호자 확인</h4><ul><li><b>이름 · 휴대전화(010 뒤 8자리) · 이메일 · 비밀번호 숫자 4자리</b>를 넣고 「확인」을 눌러요. 입력하는 사람이 <b>첫 번째 보호자</b>예요.</li><li>처음이면 비밀번호를 지금 정하고, 전에 보냈으면 그때 정한 번호를 넣어요. 이메일은 아이디를 쓰고 @ 뒤 주소를 골라요(목록에 없으면 「직접 입력」).</li><li>「이 기기에 저장」을 켜면 다음에 바로 들어가요. 내 휴대폰에서만 켜 주세요.</li><li>전에 보낸 신청이 있으면 맨 위 <b>「내 신청」</b> 표에 학원 · 학생 · 상태 · 마지막으로 보낸 때(연월일 시각)가 나와요.</li></ul><h4>2. 신청 내용</h4><ul><li><b>학원</b>을 고르고, <b>캠프 참가 학생</b>의 이름(꼭) · 전공 · 만 나이를 넣어요. 나이를 넣으면 출생연도가 나오고, 생일이 지났는지에 따라 고를 수 있어요.</li><li><b>보호자(나)도</b> 같이 가는지 고르고, 같이 가는 가족은 이름만 넣어요(동반가족 · 15개월 미만).</li><li><b>가족방</b>: 4명 이상 기준이에요. 4명보다 적으면 비는 자리 하나에 추가 금액이 있어요(숙소 1실은 5~6인). 체크하면 옆에 <b>「지금 3명 → 가족방 3인 사용 +140,000원」</b>처럼 지금 인원의 정확한 금액과 1인 · 2인 · 3인 · 4인 금액이 나와요. 4명을 넘으면 빨갛게 알려 줘요.</li><li><b>추가 개인레슨 · 마스터클래스</b>: 학생마다 고를 수 있어요. 추가 개인레슨은 <b>횟수</b>(30분에 60,000원, 한 사람 5회까지 가능), 마스터클래스는 그 악기의 <b>교수님</b>을 골라요(교수마다 시간 · 금액이 달라요 · 여러 개 가능). 고르면 「이 학생 추가 비용」과 예상 참가비에 바로 더해져요. 전공(악기)을 먼저 골라야 마스터클래스가 나와요. 학원 선생님이 확인해서 접수해요.</li><li>방 요청 · 선생님께 한마디는 선택이에요.</li></ul><h4>3. 예상 참가비</h4><ul><li>넣은 사람으로 <b>1 · 2 · 3차 합계</b>가 나오고 지금 차수가 칠해져요. <b>입금한 날짜</b>로 차수가 정해져요. 줄마다 「금액 복사」가 있어요.</li><li>학생 회비를 아직 안 냈으면 회비가 더해져요. 학생 칸에서 고른 <b>추가 개인레슨 · 마스터클래스</b> 금액도 더해져요. 학원이 확인하며 바꾸면 확정 금액이 달라질 수 있어요.</li><li>동의를 체크하고 아래 <b>「학원 선생님께 보내기」</b>를 눌러요. 보낸 뒤에도 고쳐서 다시 보낼 수 있어요.</li></ul><h4>4. 입금 · 입금 신고</h4><ul><li>보낸 뒤에 <b>학원 통장</b>(「계좌 복사」)과 금액이 나와요. 참가비는 <b>학원 통장</b>으로 보내요. 학원이 모아서 협회에 내요.</li><li>학원이 접수하면 <b>「학원이 접수했어요」</b> 표에 사람마다 확정 금액(레슨 · 마스터클래스 · 회비 · 가족방 포함)과 <b>더 낼 금액</b>이 나와요.</li><li>보낸 뒤 입금자명 · 입금일 · 금액을 넣고 <b>「입금 신고」</b>를 눌러요. 학원이 확인하면 「학원이 확인」으로 바뀌어요.</li><li><b>고치기 · 지우기</b>: 학원이 확인하기 전(확인 중 · 반려)인 신고는 줄마다 「고치기」 · 「지우기」가 있어요. 고치면 학원이 다시 확인해요. <b>학원이 확인한 신고는 고칠 수 없어요</b> — 학원 선생님께 말씀해 주세요.</li><li>반려되면 반려 사유가 보여요. 고쳐서 다시 신고해요.</li></ul><h4>5. 취소 · 환불</h4><ul><li>「취소 · 환불」 칸에 <b>오늘 취소하면 환불받는 금액</b>과 <b>취소하는 날별 환불 금액 표</b>(진단서를 낼 때 금액 포함)가 계산되어 나와요. 입금 신고 뒤에는 낸 돈, 그 전에는 예상 금액 기준이에요. 회비는 규정에 따라 빠져요.</li><li><b>입금 전</b>이면 계좌 없이 「신청 취소하기」로 바로 취소돼요.</li><li><b>입금 신고 뒤</b>에는 취소 사유와 <b>환불 받을 계좌(은행 · 예금주 · 계좌번호)</b>를 넣고 「취소 · 환불 요청 보내기」를 눌러요. 학원이 처리하면 환불 금액이 보여요. 처리 전이면 「요청 거두기」로 되돌릴 수 있어요.</li><li>신청 · 금액 바뀜 · 입금 확인 · 취소 소식은 넣은 이메일로 가요.</li></ul><h4>자주 묻는 것</h4><ul><li><b>학원 목록에 우리 학원이 없어요</b> → 이번 캠프는 일부 학원만 학부모 신청을 받아요. 학원 선생님께 신청해 주세요.</li><li><b>비밀번호 4자리를 잊었어요</b> → 학원 선생님께 말씀하면 운영진이 지워 드려요. 그 뒤 들어올 때 새로 정해요.</li><li><b>다른 휴대폰 · 다른 보호자가 들어가요</b> → 처음 보낸 보호자 이름 · 휴대전화 · 비밀번호로 들어가요.</li><li><b>학원이 접수했는데 금액이 바뀌었어요</b> → 학원이 추가레슨 · 마스터클래스를 넣거나 뺀 거예요. 「학원이 접수했어요」 표의 <b>더 낼 금액</b>만큼 학원 통장으로 보내고 입금 신고해요.</li><li><b>추가레슨 · 마스터클래스는 어디서 골라요?</b> → 학생 칸 아래에서 골라요. 추가레슨은 횟수, 마스터클래스는 교수님을 골라요. 나중에 바꾸려면 다시 보내거나, 학원이 접수한 뒤에는 학원 선생님께 말씀해 주세요.</li><li><b>입금 신고를 잘못했어요</b> → 학원 확인 전이면 「고치기 · 지우기」, 확인 뒤면 학원 선생님께 말씀해 주세요.</li><li><b>캠프 참가비는 협회에 내나요?</b> → 아니요, <b>학원 통장</b>으로 내요. 학원이 모아서 협회에 내요.</li></ul>";
document.addEventListener('click',function(e){var t=e.target;if(t.id==='pgHelp'){document.getElementById('pgGb').innerHTML=PGUIDE;document.getElementById('pgG').hidden=false;return}if(t.id==='pgGx'||t.id==='pgG'){document.getElementById('pgG').hidden=true}});
document.addEventListener('keydown',function(e){if(e.key==='Escape'){var g=document.getElementById('pgG');if(g)g.hidden=true}});
</script></body></html>
