<script>

  google.script.run.withSuccessHandler(function(r){res(r||{ok:false,msg:'응답이 없어요.'})}).withFailureHandler(function(e){res({ok:false,msg:'연결이 끊겼어요. 잠시 뒤 다시 해 주세요.'})}).api(name,args||[])})}

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

  S.D.dues={};S.D.duesRows.forEach(function(d){var k=d['대상']+'|'+d.ID;(S.D.dues[k]=S.D.dues[k]||[]).push(d)})}

  var due=+d['부과']||0,paid=+d['납부']||0;return due&&paid>=due?'<span class="pill ok">납부</span>':paid?'<span class="pill due">일부 '+won(paid)+'</span>':'<span class="pill due">미납</span>'}

/* ---------- 한눈에 ---------- */
function issues(){
  var acad=S.D.acad,tch=S.D.tch,stu=S.D.stu.filter(function(s){return s['상태']==='재원'});

  var acad=S.D.acad,tch=S.D.tch,stu=S.D.stu.filter(function(s){return s['상태']==='재원'});

  function tile(k,v,s,p,w){return '<div class="tile'+(w?' warn':'')+'"><span class="k">'+k+'</span><span class="v">'+v+'</span><span class="s">'+s+'</span>'+(p!=null?'<div class="bar"><i style="width:'+p+'%"></i></div>':'')+'</div>'}
  return '<div class="sec-h"><div><h2>한눈에</h2><p>겨울 캠프 접수 전에 학원 · 교사 · 학생 명단을 정리해요. 한 줄씩 열어 고치고 「확인」으로 표시해요.</p></div></div>'+
  '<div class="tiles">'+tile('학원',acad.filter(function(a){return a['상태']==='운영'}).length,'확인 '+pa.n+' / '+acad.length+' ('+pa.p+'%)',pa.p)+

    '<p class="cap">원본 연회비 명단에서 불러올 때 이름 끝 A·B 글자와 괄호 표기는 「구분 글자」 칸으로 옮겼어요. 화면과 명찰에는 이름만 쓰여요.</p></div>'}

  return '<div class="pager"><span>'+total+'개'+(pages>1?' 중 '+(S.page*per+1)+'–'+Math.min(total,(S.page+1)*per):'')+'</span>'+(pages>1?'<button class="btn small" type="button" data-pg="-1" '+(S.page===0?'disabled':'')+'>이전</button><button class="btn small" type="button" data-pg="1" '+(S.page>=pages-1?'disabled':'')+'>다음</button>':'')+'</div>'}

function sel(id,opts,v,label){return '<select id="'+id+'" aria-label="'+esc(label)+'">'+opts.map(function(o){var k=Array.isArray(o)?o[0]:o,l=Array.isArray(o)?o[1]:o;return '<option value="'+esc(k)+'" '+(String(k)===String(v||'')?'selected':'')+'>'+esc(l)+'</option>'}).join('')+'</select>'}
function bulkBar(kind){var n=Object.keys(S.sel).length;return n?'<div class="row note info"><b>'+n+'개 선택</b><button class="btn small primary" type="button" data-bulk="확인">확인으로</button><button class="btn small" type="button" data-bulk="확인 필요">확인 필요로</button><button class="btn small ghost" type="button" data-bulk="확인 전">확인 전으로</button><button class="btn small ghost" type="button" id="selClr">선택 풀기</button></div>':''}

  return S.D.acad.filter(function(a){

    if(qq&&!((a['학원명']+' '+a['원장명']+' '+a['주소']+' '+a['교실대표번호']).indexOf(qq)>=0))return false;

function fld(id,label,v,o){o=o||{};return '<label class="f'+(o.wide?' wide':'')+'" for="'+id+'"><span>'+label+(o.req?' <span class="req">*</span>':'')+(o.hint?' <span class="cap">'+o.hint+'</span>':'')+'</span>'+

function tchList(){var qq=q(),f=S.f,is=S.issue,dn=dupNames(S.D.tch);

    if(is==='t_need'&&t['확인']!=='확인 필요')return false; if(is==='t_tag'&&!t['구분글자'])return false; if(is==='t_dup'&&!(dn[t['이름']]>1))return false;
    if(is==='t_nophone'&&t['휴대전화'])return false; if(is==='t_noacad'&&tAcads(t).length)return false;
    if(qq&&!((t['이름']+' '+t['원래이름']+' '+t['휴대전화']+' '+tAcadTxt(t)).indexOf(qq.replace(/-/g,''))>=0||(t['이름']+' '+tAcadTxt(t)).indexOf(qq)>=0))return false;
    if(f.ac&&tAcads(t).indexOf(f.ac)<0)return false; if(f.ins&&t['전공']!==f.ins)return false; if(f.ck&&t['확인']!==f.ck)return false;
    if(f.du){var d=duesOf('교사',t['교사ID'],'2026'),paid=d&&+d['부과']>0&&+d['납부']>=+d['부과'];if(f.du==='면제'?t['회비구분']!=='면제':f.du==='납부'?t['회비구분']==='면제'||!paid:t['회비구분']==='면제'||paid)return false}

function duesBox(kind,id,defDue){var H=(duesOf(kind,id)||[]).slice().sort(function(a,b){return String(b['년도']).localeCompare(String(a['년도']))});

function readEd(table){var o={};document.querySelectorAll('[id^="e_"]').forEach(function(el){o[el.id.slice(2)]=el.value.trim()});return o}
function saveEd(ok){var table=kindOf(),k=keyOf(table),id=S.edit.id,o=readEd(table);if(ok)o['확인']='확인';
  if(id!=='new')o[k]=id;var cur=id!=='new'?(table==='학원'?A:table==='교사'?T:ST)[id]:null;
  var err=document.getElementById('edErr');err.textContent='';
  if(table==='교사'&&o['학원1']&&(o['학원1']===o['학원2']||o['학원1']===o['학원3'])||(o['학원2']&&o['학원2']===o['학원3'])){err.textContent='같은 학원을 두 번 골랐어요.';return}
  if(table==='학생'&&!o['학원ID']){err.textContent='학원을 골라 주세요.';return}
  if(S.busy)return;S.busy=true;
  callS('saveRow',table,o,cur?cur['수정일']:'').then(function(r){S.busy=false;if(!r.ok){err.textContent=r.msg;return}
    var row={};var src=table==='학원'?S.D.acad:table==='교사'?S.D.tch:S.D.stu;var h=Object.keys(src[0]||{});
    if(!h.length){load();return}
    h.forEach(function(c,i){row[c]=r.row[i]==null?'':r.row[i]});
    var i=src.findIndex(function(x){return x[k]===row[k]});if(i<0)src.unshift(row);else src[i]=row;index();
    S.edit=ok?null:{kind:S.tab,id:row[k]};render();toast(r.same?'바뀐 것이 없어요':(ok?'저장하고 확인으로 표시했어요':'저장했어요'))})}

document.addEventListener('submit',function(e){if(e.target.id!=='loginF')return;e.preventDefault();var b=document.getElementById('lgo');b.disabled=true;b.textContent='확인 중…';
  call('login',[document.getElementById('lid').value,document.getElementById('lpw').value,false]).then(function(r){b.disabled=false;b.textContent='들어가기';
    if(!r.ok){document.getElementById('lerr').textContent=r.msg;return}S.sess=r.sess;try{sessionStorage.setItem('mm-sess',r.sess)}catch(x){}document.getElementById('app').innerHTML='<div class="panel"><span><span class="spin"></span> 명단을 불러오는 중…</span></div>';load()})});
document.addEventListener('click',function(e){
  var ck=e.target.closest('input[data-ck]');if(ck){e.stopPropagation();if(ck.checked)S.sel[ck.dataset.ck]=1;else delete S.sel[ck.dataset.ck];render();return}
  if(e.target.id==='ckAll'){var per=50,l=listOf().slice(S.page*per,(S.page+1)*per),k=keyOf(kindOf());l.forEach(function(o){if(e.target.checked)S.sel[o[k]]=1;else delete S.sel[o[k]]});render();return}
  var b=e.target.closest('button,tr[data-edit]');if(!b)return;var d=b.dataset;
  if(d.tab){go(d.tab);return}
  if(b.id==='prevBtn'){var i=TABS.map(function(t){return t[0]}).indexOf(S.tab);if(i>0)go(TABS[i-1][0]);return}
  if(b.id==='nextBtn'){var j=TABS.map(function(t){return t[0]}).indexOf(S.tab);if(j<TABS.length-1)go(TABS[j+1][0]);return}
  if(b.id==='logout'){S.sess='';S.D=null;try{sessionStorage.removeItem('mm-sess')}catch(x){}render();return}
  if(b.id==='reload'){toast('새로 불러오는 중…');load();return}
  if(d.issue){var p=d.issue.split('|');go(p[0]);S.issue=p[1];render();return}
  if(b.id==='clrIssue'){S.issue='';S.page=0;render();return}
  if(d.pg){S.page+=+d.pg;render();window.scrollTo(0,0);return}
  if(d.edit){var q2=d.edit.split('|');S.dEdit=null;S.edAcad=null;S.edit=S.edit&&S.edit.id===q2[1]?null:{kind:q2[0],id:q2[1]};render();window.scrollTo({top:0,behavior:'smooth'});return}
  if(d.new){S.edit={kind:d.new,id:'new'};S.edAcad=null;render();window.scrollTo(0,0);return}
  if(b.id==='closeEd'){S.edit=null;render();return}
  if(b.id==='saveEd'){saveEd(false);return}
  if(b.id==='saveOk'){saveEd(true);return}
  if(b.id==='selClr'){S.sel={};render();return}
  if(d.bulk){var ids=Object.keys(S.sel),table=kindOf();if(S.busy)return;S.busy=true;
    callS('setCheck',table,ids,d.bulk).then(function(r){S.busy=false;if(!r.ok){toast(r.msg);return}
      var M=table==='학원'?A:table==='교사'?T:ST;ids.forEach(function(id){if(M[id]){M[id]['확인']=d.bulk;M[id]['수정일']=r.stamp;M[id]['수정자']='관리자'}});S.sel={};render();toast(r.n+'개를 「'+d.bulk+'」로 표시했어요')});return}
  if(d.dsave){var pp=d.dsave.split('|'),g=function(id){return document.getElementById(id).value.trim()};
    var rec={'대상':pp[0],ID:pp[1],'년도':g('d_y'),'부과':g('d_due'),'납부':g('d_paid'),'납부일':g('d_date'),'방식':g('d_m'),'메모':g('d_memo')};
    if(+rec['납부']>0&&!rec['납부일']){toast('납부일을 골라 주세요');return}
    callS('saveDues',rec).then(function(r){if(!r.ok){toast(r.msg);return}S.D.duesRows=r.rows.map(function(x){return {'대상':x[0],ID:x[1],'년도':x[2],'부과':x[3],'납부':x[4],'납부일':x[5],'방식':x[6],'메모':x[7]}});S.dEdit=null;index();render();toast(rec['년도']+'년 연회비를 기록했어요')});return}
  if(d.dedit){var p3=d.dedit.split('|');S.dEdit=Object.assign({},duesOf(p3[0],p3[1],p3[2]));render();return}
  if(d.ddel){var p4=d.ddel.split('|');if(!confirm(p4[2]+'년 기록을 지울까요?'))return;
    callS('delDues',p4[0],p4[1],p4[2]).then(function(r){if(!r.ok){toast(r.msg);return}S.D.duesRows=r.rows.map(function(x){return {'대상':x[0],ID:x[1],'년도':x[2],'부과':x[3],'납부':x[4],'납부일':x[5],'방식':x[6],'메모':x[7]}});index();render();toast('지웠어요')});return}
  if(b.id==='logRe'){loadLogs();render();return}
  if(d.rs){S.f.rs=d.rs;render();return}
  if(b.id==='reqRe'){loadReqs();render();return}
  if(d.opent){go('tch');S.edit={kind:'tch',id:d.opent};render();return}
  if(d.rq){var rp=d.rq.split('|'),memo=(document.getElementById('why_'+rp[0])||{}).value||'';if(rp[1]==='반려'&&!memo.trim()){toast('반려 사유를 적어 주세요');return}
    if(rp[2]&&!confirm('이 신청을 명단의 그 선생님 계정으로 연결할까요?'))return;if(S.busy)return;S.busy=true;
    callS('reqDo',rp[0],rp[1],memo,rp[2]).then(function(r){S.busy=false;if(!r.ok){toast(r.msg);return}S.reqs=objs(r);S.D.reqN=S.reqs.filter(function(q){return q['상태']==='대기'}).length;toast(rp[1]+' · 메일을 보냈어요');load()});return}
  if(b.id==='imp'||b.id==='impRe'){if(b.id==='impRe'&&!confirm('STG 명단을 모두 지우고 원본에서 다시 불러올까요?'))return;b.disabled=true;b.innerHTML='<span class="spin"></span> 불러오는 중… (1분쯤)';
    callS('importRoster',b.id==='impRe').then(function(r){if(!r.ok){b.disabled=false;b.textContent='다시 해 보기';toast(r.msg);return}toast(r.msg);S.tab='home';load()});return}
});
document.addEventListener('input',function(e){var el=e.target;
  if(el.id==='q'){S.q=el.value;if(e.isComposing)return;S.page=0;render();keepFocus('q');return}
  if(el.id==='e_출생연도'||el.id==='e_우편번호'){el.value=el.value.replace(/\D/g,'')}});
document.addEventListener('compositionend',function(e){if(e.target.id==='q'){S.q=e.target.value;S.page=0;render();keepFocus('q')}});
document.addEventListener('change',function(e){var el=e.target,m={fst:'st',fck:'ck',fsd:'sd',fac:'ac',fins:'ins',fdu:'du'}[el.id];
  if(m){S.f[m]=el.value;S.page=0;S.sel={};render();return}
  if(el.id==='e_학원ID'&&S.tab==='stu'){var keep=readEd();S.edAcad=el.value;render();Object.keys(keep).forEach(function(k){var n=document.getElementById('e_'+k);if(n&&k!=='담당교사ID')n.value=keep[k]})}});

(function start(){
  try{S.sess=sessionStorage.getItem('mm-sess')||''}catch(x){}
  call('hello').then(function(h){S.test=!!h.test;
    if(S.sess){load().then(function(){if(!S.D){S.sess='';render()}});return}
    if(h.auto){call('login',['','',true]).then(function(r){if(r.ok){S.sess=r.sess;load()}else render()});return}
    render()});
})();
</script>
</body></html>
