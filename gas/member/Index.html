<script>
var INSTS=['바이올린','첼로','비올라','플루트','피아노'];

var S={sess:'',tab:'home',q:'',f:{},page:0,edit:null,sel:{},issue:'',D:null,test:false,busy:false,hist:[]};

function call(name,args){return new Promise(function(res){
  google.script.run.withSuccessHandler(function(r){res(r||{ok:false,msg:'응답이 없어요.'})}).withFailureHandler(function(e){res({ok:false,msg:'연결이 끊겼어요. 잠시 뒤 다시 해 주세요.'})}).api(name,args||[])})}
function callS(name){var a=[S.sess].concat([].slice.call(arguments,1));return call(name,a).then(function(r){
  if(!r.ok&&/^LOGIN/.test(r.msg||'')){S.sess='';try{sessionStorage.removeItem('mm-sess')}catch(e){}render();toast('로그인 시간이 지났어요. 다시 로그인해 주세요.')}
  if(!r.ok)r.msg=String(r.msg||'').replace(/^LOGIN /,'');return r})}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function fmt(p){p=String(p||'').replace(/\D/g,'');if(!p)return '';if(p.indexOf('02')===0)return p.replace(/^(02)(\d{3,4})(\d{4})$/,'$1-$2-$3');return p.replace(/^(0\d{2})(\d{3,4})(\d{4})$/,'$1-$2-$3')}
function won(n){return (+n||0).toLocaleString('ko-KR')+'원'}
function toast(m){var e=document.getElementById('toast');e.textContent=m;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){e.hidden=true},2600)}
function kindLabel(k){return {'정식 교사':'교사회원','중급 연수':'연수교사 · 중급','초급 연수':'연수교사 · 초급'}[k]||k}
function objs(t){var h=t.h;return t.rows.map(function(r){var o={};h.forEach(function(k,i){o[k]=r[i]==null?'':r[i]});return o})}
function index(){A={};T={};ST={};S.D.acad.forEach(function(a){A[a['학원ID']]=a});S.D.tch.forEach(function(t){T[t['교사ID']]=t});S.D.stu.forEach(function(s){ST[s['학생ID']]=s});
  S.D.dues={};S.D.duesRows.forEach(function(d){var k=d['대상']+'|'+d.ID;(S.D.dues[k]=S.D.dues[k]||[]).push(d)})}
function aName(id){return id&&A[id]?A[id]['학원명']:''}
function tAcads(t){return [t['학원1'],t['학원2'],t['학원3']].filter(Boolean)}
function tAcadTxt(t){return tAcads(t).map(aName).join(', ')||'소속 없음'}
function nm(o){return esc(o['이름'])+(o['구분글자']?'<span class="tag">('+esc(o['구분글자'])+')</span>':'')}

function duesPill(kind,id,o){if(kind==='교사'&&o['회비구분']==='면제')return '<span class="pill mute">면제</span>';var d=duesOf(kind,id,'2026');if(!d)return '<span class="pill due">기록 없음</span>';
  var due=+d['부과']||0,paid=+d['납부']||0,dt=d['납부일']?' <span class="cap num">'+esc(String(d['납부일']).slice(5).replace('-','/'))+'</span>':'';return (due&&paid>=due?'<span class="pill ok">납부</span>':paid?'<span class="pill due">일부 '+won(paid)+'</span>':'<span class="pill due">미납</span>')+dt}
function dupNames(list){var c={};list.forEach(function(o){var k=o['이름'];c[k]=(c[k]||0)+1});return c}

  '<p class="err" id="lerr"></p><button class="btn primary" type="submit" id="lgo">들어가기</button></form></div>'}

/* ---------- 한눈에 ---------- */
function issues(){
  var acad=S.D.acad,tch=S.D.tch,stu=S.D.stu.filter(function(s){return s['상태']==='재원'});
  var tn=dupNames(tch);
  return [
    ['acad','a_need','확인 필요 학원',acad.filter(function(a){return a['확인']==='확인 필요'}).length,'열 밀림 의심 · 명단에만 있는 학원 · 원장 못 찾음'],
    ['acad','a_nophone','교실 대표번호 없는 학원',acad.filter(function(a){return a['상태']!=='탈퇴'&&!a['교실대표번호']}).length,'학원 로그인 아이디가 돼요'],
    ['tch','t_need','확인 필요 교사',tch.filter(function(t){return t['확인']==='확인 필요'}).length,'이름 말고 다른 칸이 빈 줄 등'],

    ['tch','t_nophone','휴대전화 없는 교사',tch.filter(function(t){return !t['휴대전화']}).length,'로그인 · 본인 확인에 필요'],

    ['stu','s_guess','출생연도를 나이로 계산한 학생',stu.filter(function(s){return s['출생연도추정']}).length,'원본에 「10세」처럼 적힌 것'],
    ['stu','s_tag','이름에 구분 글자를 뗀 학생',stu.filter(function(s){return s['구분글자']}).length,'김건우(남A) → 김건우 (남A)'],
    ['stu','s_inst','전공이 목록에 없는 학생',stu.filter(function(s){return INSTS.indexOf(s['전공'])<0}).length,'Vn·vc 같은 표기는 자동으로 바꿨어요']
  ]}
function vHome(){
  if(S.D.empty)return '<div class="panel"><h3>아직 명단이 없어요</h3><p class="cap">「설정」 탭에서 원본 연회비 명단을 불러와 주세요.</p><div><button class="btn primary" type="button" data-tab="set">설정으로</button></div></div>';
  var acad=S.D.acad,tch=S.D.tch,stu=S.D.stu.filter(function(s){return s['상태']==='재원'});
  function prog(list){var n=list.filter(function(o){return o['확인']==='확인'}).length;return {n:n,p:list.length?Math.round(n*100/list.length):0}}
  var pa=prog(acad),pt=prog(tch),ps=prog(stu);
  var tdue=tch.filter(function(t){return t['회비구분']!=='면제'}), tpaid=tdue.filter(function(t){var d=duesOf('교사',t['교사ID'],'2026');return d&&+d['납부']>=+d['부과']&&+d['부과']>0});
  var spaid=stu.filter(function(s){var d=duesOf('학생',s['학생ID'],'2026');return d&&+d['납부']>0});
  function tile(k,v,s,p,w){return '<div class="tile'+(w?' warn':'')+'"><span class="k">'+k+'</span><span class="v">'+v+'</span><span class="s">'+s+'</span>'+(p!=null?'<div class="bar"><i style="width:'+p+'%"></i></div>':'')+'</div>'}

function isAcadSel(el){if(el.tagName!=='SELECT'||el.dataset.acsOn)return false;for(var i=0;i<el.options.length;i++)if(/^A\d{4}$/.test(el.options[i].value))return true;return false}

function acsEnhance(root){(root||document).querySelectorAll('select').forEach(function(sl){if(!isAcadSel(sl))return;sl.dataset.acsOn='1';
  var w=document.createElement('span');w.className='acs';var inp=document.createElement('input');inp.type='search';inp.autocomplete='off';inp.placeholder='학원 찾기';inp.setAttribute('aria-label',(sl.getAttribute('aria-label')||'학원')+' 찾기');
  if(sl.getAttribute('aria-invalid'))inp.setAttribute('aria-invalid',sl.getAttribute('aria-invalid'));
  var ul=document.createElement('ul');ul.hidden=true;ul.setAttribute('role','listbox');sl.parentNode.insertBefore(w,sl);w.appendChild(inp);w.appendChild(ul);w.appendChild(sl);sl.hidden=true;sl.style.display='none';
  var first=sl.options[0]&&sl.options[0].value===''?sl.options[0]:null,hi=0,items=[];
  inp.value=sl.value?acsLabel(sl):'';inp.placeholder=first?first.text+' · 학원 찾기':'학원 찾기';
  function draw(){var q=inp.value.replace(/\s+/g,'');if(q===acsLabel(sl).replace(/\s+/g,''))q='';items=[];for(var i=0;i<sl.options.length;i++){var o=sl.options[i];if(!q||o.text.replace(/\s+/g,'').indexOf(q)>=0||(!o.value&&!q))items.push(o)}
    if(q&&first)items.unshift(first);hi=Math.max(0,Math.min(hi,items.length-1));
    ul.innerHTML=items.length?items.map(function(o,i){return '<li role="option" data-i="'+i+'" class="'+(i===hi?'on ':'')+(o.value===sl.value?'cur':'')+'">'+esc(o.text)+'</li>'}).join(''):'<li class="none">찾는 학원이 없어요</li>';ul.hidden=false}
  function pick(o){if(!o)return;sl.value=o.value;inp.value=o.value?o.text:'';ul.hidden=true;sl.dispatchEvent(new Event('change',{bubbles:true}))}
  inp.addEventListener('focus',function(){hi=0;draw();inp.select()});
  inp.addEventListener('input',function(e){e.stopPropagation();hi=0;draw()});
  inp.addEventListener('keydown',function(e){if(ul.hidden&&e.key!=='Escape')draw();if(e.key==='ArrowDown'){hi=Math.min(hi+1,items.length-1);draw();e.preventDefault()}else if(e.key==='ArrowUp'){hi=Math.max(hi-1,0);draw();e.preventDefault()}else if(e.key==='Enter'){e.preventDefault();e.stopPropagation();pick(items[hi])}else if(e.key==='Escape'){ul.hidden=true;inp.value=sl.value?acsLabel(sl):''}});

  if(d.bulk){var ids=Object.keys(S.sel),table=kindOf();if(S.busy)return;S.busy=true;
    callS('setCheck',table,ids,d.bulk).then(function(r){S.busy=false;if(!r.ok){toast(r.msg);return}
      var M=table==='학원'?A:table==='교사'?T:ST;ids.forEach(function(id){if(M[id]){M[id]['확인']=d.bulk;M[id]['수정일']=r.stamp;M[id]['수정자']='관리자'}});S.sel={};render();toast(r.n+'개를 「'+d.bulk+'」로 표시했어요')});return}
  if(d.dsave){var pp=d.dsave.split('|'),g=function(id){return document.getElementById(id).value.trim()};
    var rec={'대상':pp[0],ID:pp[1],'년도':g('d_y'),'부과':g('d_due'),'납부':g('d_paid'),'납부일':g('d_date'),'방식':g('d_m'),'메모':g('d_memo')};
    if(+rec['납부']>0&&!rec['납부일']){toast('납부일을 골라 주세요');return}
    callS('saveDues',rec).then(function(r){if(!r.ok){toast(r.msg);return}S.D.duesRows=r.rows.map(function(x){return {'대상':x[0],ID:x[1],'년도':x[2],'부과':x[3],'납부':x[4],'납부일':x[5],'방식':x[6],'메모':x[7]}});S.dEdit=null;index();render();toast(rec['년도']+'년 연회비를 기록했어요')});return}
  if(d.dedit){var p3=d.dedit.split('|');S.dEdit=Object.assign({},duesOf(p3[0],p3[1],p3[2]));render();return}
  if(d.ddel){var p4=d.ddel.split('|');if(!confirm(p4[2]+'년 기록을 지울까요?'))return;
    callS('delDues',p4[0],p4[1],p4[2]).then(function(r){if(!r.ok){toast(r.msg);return}S.D.duesRows=r.rows.map(function(x){return {'대상':x[0],ID:x[1],'년도':x[2],'부과':x[3],'납부':x[4],'납부일':x[5],'방식':x[6],'메모':x[7]}});index();render();toast('지웠어요')});return}
  if(b.id==='logRe'){loadLogs();render();return}
  if(d.rs){S.f.rs=d.rs;render();return}
  if(b.id==='reqRe'){loadReqs();render();return}
  if(d.opent){go('tch');S.edit={kind:'tch',id:d.opent};render();return}
  if(d.rq){var rp=d.rq.split('|'),memo=(document.getElementById('why_'+rp[0])||{}).value||'';if(rp[1]==='반려'&&!memo.trim()){toast('반려 사유를 적어 주세요');return}
    if(rp[2]&&!confirm('이 신청을 명단의 그 선생님 계정으로 연결할까요?'))return;if(S.busy)return;S.busy=true;
    callS('reqDo',rp[0],rp[1],memo,rp[2]).then(function(r){S.busy=false;if(!r.ok){toast(r.msg);return}S.reqs=objs(r);S.D.reqN=S.reqs.filter(function(q){return q['상태']==='대기'}).length;toast(rp[1]+' · 메일을 보냈어요');load()});return}
  if(d.ast){S.askSt=d.ast;render();return}
  if(b.id==='askRe'){loadAsk();render();return}
  if(d.bst){var p2=d.bst.split('|');if(S.busy)return;S.busy=true;callS('bSet',p2[0],p2[1]).then(function(r){S.busy=false;if(!r.ok){toast(r.msg);return}setAsks(r.list);render();toast(p2[1]+'(으)로 바꿨어요')});return}
  if(d.bcm){var ta=document.getElementById('cm_'+d.bcm),tx=ta?ta.value.trim():'';if(!tx){toast('댓글을 넣어 주세요');return}if(S.busy)return;S.busy=true;b.disabled=true;
    callS('bComment',d.bcm,tx).then(function(r){S.busy=false;if(!r.ok){b.disabled=false;toast(r.msg);return}setAsks(r.list);render();toast('댓글을 남겼어요')});return}
  if(b.id==='pdGo'){var src=document.getElementById('pdSrc').value.trim(),yr=document.getElementById('pdYear').value;S.pdYear=yr;S.D.pdSrc=src;if(!src){toast('시트 주소를 넣어 주세요');return}
    b.disabled=true;b.innerHTML='<span class="spin"></span> 불러오는 중…';
    callS('importPastDues',src,yr).then(function(r){if(!r.ok){b.disabled=false;b.textContent='불러오기';toast(r.msg);return}S.pdRes=r;S.D.duesRows=objs(r.dues);index();render();toast(r.year+'년 회비를 넣었어요')});return}
  if(b.id==='imp'||b.id==='impRe'){if(b.id==='impRe'&&!confirm('STG 명단을 모두 지우고 원본에서 다시 불러올까요?'))return;b.disabled=true;b.innerHTML='<span class="spin"></span> 불러오는 중… (1분쯤)';
    callS('importRoster',b.id==='impRe').then(function(r){if(!r.ok){b.disabled=false;b.textContent='다시 해 보기';toast(r.msg);return}toast(r.msg);S.tab='home';load()});return}
});
/* 찾기 칸은 그대로 두고 표·쪽 번호만 새로 그림 (한글 입력이 깨지지 않게, 10-28) */
function softList(){var live=document.getElementById('q');if(!live){render();return}
  var html=({acad:vAcads,tch:vTeachers,stu:vStudents})[S.tab];if(!html){render();return}
  var tmp=document.createElement('div');tmp.innerHTML=html();var tq=tmp.querySelector('#q');if(!tq){render();return}
  var lp=live.closest('.panel'),tp=tq.closest('.panel'),lf=live.closest('.filters'),tf=tq.closest('.filters');
  Array.prototype.slice.call(lp.childNodes).forEach(function(n){if(n!==lf)lp.removeChild(n)});
  Array.prototype.slice.call(tp.childNodes).forEach(function(n){if(n!==tf)lp.appendChild(n)})}
var qTimer=0;
document.addEventListener('input',function(e){var el=e.target;
  if(el.id==='q'){S.q=el.value;S.page=0;clearTimeout(qTimer);qTimer=setTimeout(softList,120);return}
  if(el.id==='e_출생연도'||el.id==='e_우편번호'){el.value=el.value.replace(/\D/g,'')}});
document.addEventListener('compositionend',function(e){if(e.target.id==='q'){S.q=e.target.value;S.page=0;clearTimeout(qTimer);qTimer=setTimeout(softList,120)}});
document.addEventListener('change',function(e){var el=e.target,m={fst:'st',fck:'ck',fsd:'sd',fac:'ac',fins:'ins',fdu:'du',fpw:'pw',frl:'rl',fcp:'cp',ffr:'fr',fkd:'kd',fct:'ct'}[el.id];
  if(m){S.f[m]=el.value;S.page=0;S.sel={};render();return}
  if(el.id==='e_학원ID'&&S.tab==='stu'){var keep=readEd();S.edAcad=el.value;render();Object.keys(keep).forEach(function(k){var n=document.getElementById('e_'+k);if(n&&k!=='담당교사ID')n.value=keep[k]})}});

(function start(){
  try{S.sess=sessionStorage.getItem('mm-sess')||''}catch(x){}
  call('hello').then(function(h){S.test=!!h.test;
    if(S.sess){load().then(function(){if(!S.D){S.sess='';render()}});return}
    if(h.auto){call('login',['','',true]).then(function(r){if(r.ok){S.sess=r.sess;load()}else render()});return}
    render()});
})();
