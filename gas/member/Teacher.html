function shrinkPhoto(file){return new Promise(function(res,rej){var fr=new FileReader();fr.onerror=function(){rej('읽지 못했어요')};fr.onload=function(){var im=new Image();im.onerror=function(){rej('사진 파일이 아니에요')};im.onload=function(){
  var W=360,H=480,r=W/H,sw=im.width,sh=im.height,cw=sw,ch=sh;if(sw/sh>r)cw=sh*r;else ch=sw/r;var sx=(sw-cw)/2,sy=(sh-ch)/2;
  var cv=document.createElement('canvas');cv.width=W;cv.height=H;var cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,W,H);cx.drawImage(im,sx,sy,cw,ch,0,0,W,H);
  var q=0.85,u=cv.toDataURL('image/jpeg',q);while(u.length>46000&&q>0.3){q-=0.1;u=cv.toDataURL('image/jpeg',q)}
  if(u.length>46000){cv.width=270;cv.height=360;cx=cv.getContext('2d');cx.drawImage(im,sx,sy,cw,ch,0,0,270,360);u=cv.toDataURL('image/jpeg',0.7)}
  res(u)};im.src=fr.result};fr.readAsDataURL(file)})}

function phClamp(el){if(!el||el.id!=='iPh'||el.disabled)return;var n=el.value.length,a=el.selectionStart,b=el.selectionEnd;
