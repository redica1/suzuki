<html lang="ko">
<head>
<meta charset="utf-8">

<!--
  스즈키 시스템 홈 (2026-10-31 · 11-26 MAIN / STG 두 칸으로 나눔) — 회원관리 · 캠프 · 교사연수 · 졸업연주로 가는 첫 화면
  · https://app.suzukimusickorea.org/home/        → 메인
  · https://app.suzukimusickorea.org/home/?test   → 테스트(STG): 모든 링크 뒤에 ?test 가 붙음
  · 로그인은 모두 회원관리(선생님 회원)의 이메일 · 비밀번호 하나로 (캠프 · 캠프 담당자 화면도 같은 계정)
  · 이 페이지는 링크만 있음. 명단 · 접수 내용은 깃허브에 없음.
-->
<meta name="description" content="스즈키 협회 선생님 회원 · 캠프 접수 · 교사연수 · 졸업연주">
<meta property="og:type" content="website">
<meta property="og:title" content="사단법인 한국스즈키음악협회">
<meta property="og:description" content="선생님 회원 · 캠프 접수 · 교사연수 · 졸업연주를 한곳에서">
<meta property="og:url" content="https://app.suzukimusickorea.org/home/">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- 글꼴: 모두 Pretendard (CDN) -->
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--bg:#f4f8ff;--surface:#fff;--line:#dbe6fa;--ink:#16233a;--muted:#55657f;--band:#4285f4;--mem:#4285f4;--memI:#1a5fd0;--camp:#0f9d9a;--campI:#0b7a78;--par:#e8833a;--parI:#b85d15;--stg:#c2410c;--stgS:#fff1e6;--main:#1967d2;--mainS:#e6f0ff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1626;--surface:#162236;--line:#26364f;--ink:#e8effa;--muted:#a3b3cc;--band:#2b5fc0;--memI:#8ab4f8;--campI:#5fd4cf;--parI:#f4b27a;--stg:#fb923c;--stgS:#3a2414;--main:#8ab4f8;--mainS:#1c2c47;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1626;--surface:#162236;--line:#26364f;--ink:#e8effa;--muted:#a3b3cc;--band:#2b5fc0;--memI:#8ab4f8;--campI:#5fd4cf;--parI:#f4b27a;--stg:#fb923c;--stgS:#3a2414;--main:#8ab4f8;--mainS:#1c2c47;color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 "Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;word-break:keep-all}
header{background:var(--band);color:#fff;padding:14px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.in{max-width:1000px;margin:0 auto}header small{opacity:.85;letter-spacing:.08em}header h1{margin:4px 0 2px;font-size:28px;line-height:1.25}header p{margin:0;opacity:.9;font-size:15px}
main{max-width:1000px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-right,0px)) 32px max(16px,env(safe-area-inset-left,0px))}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:760px){.cols{grid-template-columns:1fr}}
.env{border-radius:14px;border:2px solid var(--line);background:var(--surface);overflow:hidden;min-width:0}
.env.main{border-color:var(--main)}.env.stg{border-color:var(--stg)}
.env.here{box-shadow:0 0 0 4px rgba(127,127,127,.15)}
.eh{padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.env.main .eh{background:var(--mainS)}.env.stg .eh{background:var(--stgS)}
.eh b{font-size:19px}.env.main .eh b{color:var(--main)}.env.stg .eh b{color:var(--stg)}
.eh span{font-size:13px;color:var(--muted)}
.grp{padding:10px 14px;border-top:1px solid var(--line)}
.gl{font-size:12.5px;font-weight:800;letter-spacing:.04em;color:var(--muted);margin-bottom:6px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
a.c{display:block;border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-decoration:none;color:inherit;background:var(--surface);transition:transform .15s,border-color .15s;min-width:0}
a.c:hover{transform:translateY(-1px)}
a.c b{display:block;font-size:16px}a.c small{color:var(--muted);font-size:12.5px;line-height:1.5;display:block}
a.c.mem{border-left:4px solid var(--mem)}a.c.mem b{color:var(--memI)}
a.c.camp{border-left:4px solid var(--camp)}a.c.camp b{color:var(--campI)}
a.c.par{border-left:4px solid var(--par)}a.c.par b{color:var(--parI)}
a.c.adm{background:repeating-linear-gradient(135deg,transparent 0 10px,rgba(127,127,127,.06) 10px 20px)}
.tag{display:inline-block;font-size:11px;font-weight:800;border-radius:999px;padding:0 7px;background:var(--ink);color:var(--surface);margin-left:4px;vertical-align:middle}
.etc{padding:10px 14px;border-top:1px solid var(--line);font-size:13.5px;color:var(--muted)}.etc a{color:inherit;margin-right:12px}
.etc a.now{color:var(--stg);font-weight:700}
footer{color:var(--muted);font-size:13px;text-align:center;padding:4px 16px 28px}
</style>
</head>
<body>
<header><div class="in"><small>Korea Suzuki Music Association</small><h1>사단법인 한국스즈키음악협회</h1><p>선생님 회원 계정 하나로 회원 정보 · 캠프 접수를 함께 써요.</p></div></header>
<main><div class="cols" id="cols"></div></main>
<footer>MAIN = 선생님 · 학부모가 지금 쓰는 실제 화면 · STG = 고친 것을 먼저 시험하는 화면 (주소 끝 ?test · 실제 접수에 안 들어가요)</footer>
<script>
(function () {
  var STG_NOW = 'https://script.google.com/a/macros/redica.kr/s/AKfycbxr3zevlPHQhyExSQlHknsMF2whbvWIvuvWbzK0sfF6mlRNxXKOLbY9HDIJl3VhJB--rw/exec';   /* 캠프 도우미 웹 앱 (액세스: 나만) */
  var base = location.pathname.replace(/home\/(index\.html)?$/, ''), test = /[?&]test\b/i.test(location.search);
  var G = [['교사 회원', 'mem', [['교사 회원', '가입 · 로그인 · 내 정보 · 우리 학원 · 학생', 'member/'], ['교사 회원 관리자', '학원 · 교사 · 학생 · 연회비 · 승인', 'member/admin.html']]],
           ['캠프 접수', 'camp', [['캠프 접수', '캠프 신청 · 내 신청 내역 · 가족방 · 앙상블', 'camp/new.html'], ['캠프 접수 관리자', '접수 확인 · 스케줄 · 방배정 · 정산', 'camp/admin.html']]],
           ['학부모 접수', 'par', [['학부모 접수', '학원 고르고 신청 · 회원가입 없이', 'camp/parent.html'], ['학원별 주소', '캠프 관리자 › 학부모 신청 학원 (예: /camp/p/misa.html)', 'camp/admin.html']]]];
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function u(p, stg) { return base + p + (stg ? '?test' : ''); }
  function env(stg) {
    return '<section class="env ' + (stg ? 'stg' : 'main') + (stg === test ? ' here' : '') + '"><div class="eh"><b>' + (stg ? 'STG · 테스트' : 'MAIN · 실제') + '</b><span>' + (stg ? '주소 끝 ?test · 실제 접수에 안 들어가요' : '선생님 · 학부모가 지금 쓰는 화면') + '</span></div>' +
      G.map(function (g) { return '<div class="grp"><div class="gl">' + g[0] + '</div><div class="pair">' + g[2].map(function (x, i) {
        return '<a class="c ' + g[1] + (i ? ' adm' : '') + '" href="' + u(x[2], stg) + '" target="_blank" rel="noopener"><b>' + esc(x[0]) + (i && g[1] !== 'par' ? '<span class="tag">관리자</span>' : '') + '</b><small>' + esc(x[1]) + '</small></a>'; }).join('') + '</div></div>'; }).join('') +
      '<div class="etc">그 밖에: <a href="' + u('camp/intl.html', stg) + '" target="_blank" rel="noopener">해외 접수</a><a href="' + u('camp/', stg) + '" target="_blank" rel="noopener">기존 캠프 접수</a><a href="' + u('camp/find.html', stg) + '" target="_blank" rel="noopener">캠프 일정 찾기</a><a href="' + base + '" target="_blank" rel="noopener">교사연수</a>' +
      (stg && STG_NOW ? '<br><a class="now" href="' + STG_NOW + '" target="_blank" rel="noopener">STG 지금 적용 · 메인 반영 ↗</a> <span>(도우미 · 나만)</span>' : '') + '</div></section>';
  }
  document.getElementById('cols').innerHTML = env(false) + env(true);
})();
</script>
</body>
</html>
