<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>26가을 스즈키 교사연수 신청</title>
<!--
  스즈키 교사연수 신청 — 공유용 페이지 (2026-10-23)
  · 깃허브 redica1/suzuki 저장소(GitHub Pages)에 이 파일과 og.png 를 함께 올림 → https://redica1.github.io/suzuki/
  · 올린 주소가 다르면 아래 og:url · og:image 두 줄의 주소만 바꿔 주세요 (카톡 미리보기는 전체 주소여야 함).
  · 주소에 따라 앱이 정해짐 (10/23, 깃허브는 다시 고칠 필요 없음)
      https://redica1.github.io/suzuki/       → 운영 앱 (선생님께 보내는 주소)
      https://redica1.github.io/suzuki/?test  → 테스트(STG) 앱 (운영진 시험용)
  · 운영 앱은 예약 반영(RELEASE_AT) 뒤부터 이 페이지 안에서 열림. 그 전에는 ?test 주소로만 시험.
  · 카카오톡·라인·네이버·인스타 등 앱 안 브라우저에서는 구글이 신청 화면을 안에 넣는 것을 막아
    "현재 파일을 열 수 없습니다"가 뜸 (10/23 확인) → 앱 안에서 열면 크롬(기본 브라우저)으로 자동으로 넘김.
-->
<meta name="description" content="11월 20일(금) 서울 첼로·스즈키 이론, 11월 21일(토) 대전 바이올린 교사연수. 연수 신청 · 입금 신고 · 출석 체크">
<meta property="og:type" content="website">
<meta property="og:site_name" content="스즈키 교사연수">
<meta property="og:title" content="26가을 스즈키 교사연수 신청">
<meta property="og:description" content="11/20(금) 서울 첼로·스즈키 이론 · 11/21(토) 대전 바이올린 | 연수 신청 · 입금 신고 · 출석 체크">
<meta property="og:url" content="https://redica1.github.io/suzuki/">
<meta property="og:image" content="https://redica1.github.io/suzuki/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="26가을 스즈키 교사연수 신청 — 11월 20일 서울, 11월 21일 대전">
<meta property="og:locale" content="ko_KR">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#eef0f4">
<meta name="robots" content="noindex">
<style>
  html, body { margin: 0; height: 100%; background: #eef0f4; }
  [hidden] { display: none !important; }
  body { font: 600 17px/1.55 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; color: #18203a; }
  /* 신청 화면을 화면 가득 (주소창이 줄었다 늘었다 해도 맞게) */
  #app { position: fixed; inset: 0; width: 100%; height: 100%; height: 100dvh; border: 0; display: block; }
  /* 신청 화면이 뜨기 전 잠깐 보이는 안내 */
  .msg { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 24px; color: #5d6680; }
  .msg b { color: #18203a; font-size: 21px; }
  .msg a.btn { display: inline-block; background: #2c46c9; color: #fff; text-decoration: none; border-radius: 12px; padding: 14px 22px; font-size: 18px; font-weight: 700; }
  .msg a.sub { color: #5d6680; font-size: 15px; }
  .spin { width: 26px; height: 26px; border-radius: 50%; border: 3px solid #2c46c9; border-right-color: transparent; animation: s .8s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<!-- 보통 브라우저: 신청 화면을 불러오는 동안 -->
<div class="msg" id="wait" hidden><span class="spin"></span>신청 화면을 여는 중이에요…<small id="slow" hidden>오래 걸리면 <a id="direct" target="_top">여기를 눌러 바로 열어 주세요</a></small></div>
<!-- 카톡 등 앱 안 브라우저: 크롬·기본 브라우저로 넘김 -->
<div class="msg" id="inapp" hidden>
  <b>크롬(기본 브라우저)에서 열어 주세요</b>
  <span>카카오톡 같은 앱 안에서는 신청 화면이 열리지 않아요.<br>아래 버튼을 누르면 브라우저에서 열려요.</span>
  <a class="btn" id="openOut">브라우저에서 열기</a>
  <a class="sub" id="copyUrl" href="#">버튼이 안 되면: 주소 복사하기</a>
</div>
<iframe id="app" title="26가을 스즈키 교사연수 신청" allow="clipboard-write; screen-wake-lock" hidden></iframe>
<script>
(function () {
  var PROD = 'https://script.google.com/macros/s/AKfycbyQRUumuRkMZGVvwmRXT6p73qiSYmHkIm8jpavTltA-EPU9CoP8mHr3KmEHS3Mq6Hma9Q/exec';   // 운영
  var STG  = 'https://script.google.com/macros/s/AKfycbwEe8lmP7_TWFb_hxtEyapxUDNrKGg-8AlFX9XxISQRp73L863sE7BHGK-u6OJFLUH_FQ/exec';   // 테스트
  var APP = /[?&]test\b/i.test(location.search) ? STG : PROD;
  var ua = navigator.userAgent || '', here = location.href.split('#')[0];
  var android = /Android/i.test(ua);
  var kakao = /KAKAOTALK/i.test(ua), line = / Line\//i.test(ua);
  var otherApp = /NAVER\(inapp|Instagram|FBAN|FBAV|BAND\/|DaumApps|everytimeApp|SamsungBrowser\/[\d.]+ .*wv|; wv\)/i.test(ua);
  var out = '';
  if (kakao) out = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(here);
  else if (line) out = here + (here.indexOf('?') < 0 ? '?' : '&') + 'openExternalBrowser=1';
  else if (otherApp && android) out = 'intent://' + here.replace(/^https?:\/\//, '') + '#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=' + encodeURIComponent(here) + ';end';

  if (kakao || line || otherApp) {
    // 앱 안 브라우저: 신청 화면은 넣지 않고 바로 바깥 브라우저로 넘김 (안 넘어가면 버튼·주소 복사)
    document.getElementById('inapp').hidden = false;
    var b = document.getElementById('openOut');
    if (out) { b.href = out; setTimeout(function () { location.href = out; }, 50); }
    else b.style.display = 'none';   // 아이폰의 일부 앱은 자동으로 못 넘김 → 주소 복사 안내
    document.getElementById('copyUrl').onclick = function (e) {
      e.preventDefault();
      var done = function () { alert('주소를 복사했어요. 크롬이나 사파리 주소창에 붙여 넣어 주세요.'); };
      try { navigator.clipboard.writeText(here).then(done, function () { prompt('이 주소를 복사해 브라우저에 붙여 넣어 주세요', here); }); }
      catch (x) { prompt('이 주소를 복사해 브라우저에 붙여 넣어 주세요', here); }
    };
    return;
  }
  // 보통 브라우저: 신청 화면을 화면 가득
  var app = document.getElementById('app');
  document.getElementById('wait').hidden = false;
  document.getElementById('direct').href = APP;
  app.src = APP; app.hidden = false;
  // 10초가 지나도 안 뜨면 앱 주소로 바로 여는 링크 (회사·학교 와이파이가 막는 경우 대비)
  setTimeout(function () { document.getElementById('slow').hidden = false; }, 10000);
})();
</script>
</body>
</html>
