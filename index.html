<style>
  html, body { margin: 0; height: 100%; background: #eef0f4; }
  /* 신청 화면을 화면 가득 (주소창이 줄었다 늘었다 해도 맞게) */
  #app { position: fixed; inset: 0; width: 100%; height: 100%; height: 100dvh; border: 0; display: block; }
  /* 신청 화면이 뜨기 전 잠깐 보이는 안내 */
  #wait { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
          font: 600 17px/1.5 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; color: #5d6680; text-align: center; padding: 24px; }
  #wait a { color: #2c46c9; }
  .spin { width: 26px; height: 26px; border-radius: 50%; border: 3px solid #2c46c9; border-right-color: transparent; animation: s .8s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="wait"><span class="spin"></span>신청 화면을 여는 중이에요…<small id="slow" hidden>오래 걸리면 <a id="direct" target="_top">여기를 눌러 바로 열어 주세요</a></small></div>
<iframe id="app" title="26가을 스즈키 교사연수 신청" allow="clipboard-write; screen-wake-lock"
  src="https://script.google.com/macros/s/AKfycbwEe8lmP7_TWFb_hxtEyapxUDNrKGg-8AlFX9XxISQRp73L863sE7BHGK-u6OJFLUH_FQ/exec"></iframe>
<script>
  // 10초가 지나도 신청 화면이 안 뜨면 앱 주소로 바로 여는 링크를 보여 줌 (회사·학교 와이파이가 막는 경우 대비)
  var app = document.getElementById('app');
  document.getElementById('direct').href = app.src;
  setTimeout(function () { document.getElementById('slow').hidden = false; }, 10000);
</script>
</body>
