<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>스즈키 선생님 회원</title>
<!--
  스즈키 선생님 회원 (계정 만들기 · 로그인 · 내 정보) — 공유용 페이지 (2026-10-28)
  · https://app.suzukimusickorea.org/member/       → 메인 (선생님께 보내는 주소)
  · https://app.suzukimusickorea.org/member/?test  → 테스트(STG)
  · 관리자: https://app.suzukimusickorea.org/member/admin.html
  · 이 페이지는 액자일 뿐, 명단·계정은 깃허브에 없음 (회원관리 구글 시트에만 있음). 카톡 등 앱 안 브라우저는 크롬으로 넘김.
  · 앱 주소가 바뀌면 아래 PROD · STG 줄만 바꾸면 됨.
-->
<meta name="description" content="한국스즈키음악협회 선생님 회원 계정 · 캠프·졸업연주 신청과 내 정보">
<meta property="og:type" content="website">
<meta property="og:site_name" content="한국스즈키음악협회">
<meta property="og:title" content="스즈키 선생님 회원">
<meta property="og:description" content="계정 만들기 · 로그인 · 내 정보">
<meta property="og:url" content="https://app.suzukimusickorea.org/member/">
<meta property="og:locale" content="ko_KR">
<meta name="theme-color" content="#16303a">
<meta name="robots" content="noindex">
<style>
  html, body { margin: 0; height: 100%; background: #eef0f4; }
  [hidden] { display: none !important; }
  body { font: 600 17px/1.55 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; color: #18203a; }
  /* 회원 화면을 화면 가득 (주소창이 줄었다 늘었다 해도 맞게) */
  #app { position: fixed; inset: 0; width: 100%; height: 100%; height: 100dvh; border: 0; display: block; }
  /* 회원 화면이 뜨기 전 잠깐 보이는 안내 */
  .msg { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 24px; color: #5d6680; }
  .msg b { color: #18203a; font-size: 21px; }
  .msg a.btn { display: inline-block; background: #2c46c9; color: #fff; text-decoration: none; border-radius: 12px; padding: 14px 22px; font-size: 18px; font-weight: 700; }
  .msg a.sub { color: #5d6680; font-size: 15px; }
  .spin { width: 26px; height: 26px; border-radius: 50%; border: 3px solid #2c46c9; border-right-color: transparent; animation: s .8s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
  /* 화면 대신 「현재 파일을 열 수 없습니다」가 뜰 때(구글 계정 여러 개 로그인) 아래에 뜨는 안내 */
  #help { position: fixed; left: 12px; right: 12px; bottom: 12px; z-index: 5; max-width: 560px; margin: 0 auto; background: #fff8e6; border: 1px solid #f0c36d; border-radius: 14px; padding: 14px 44px 14px 16px; box-shadow: 0 6px 24px rgba(0,0,0,.18); font-size: 15px; line-height: 1.5; color: #4a3b10; }
  #help b { display: block; font-size: 16px; color: #2b2208; margin-bottom: 4px; }
  #help a.btn2 { display: inline-block; margin-top: 8px; background: #2c46c9; color: #fff; text-decoration: none; border-radius: 10px; padding: 9px 16px; font-weight: 700; }
  #help button { position: absolute; top: 8px; right: 8px; border: 0; background: none; font-size: 22px; line-height: 1; color: #8a7a4a; cursor: pointer; padding: 6px; }
</style>
</head>
<body>
<!-- 보통 브라우저: 회원 화면을 불러오는 동안 -->
<div class="msg" id="wait" hidden><span class="spin"></span>회원 화면을 여는 중이에요…<small id="slow" hidden>오래 걸리면 <a id="direct" target="_top">여기를 눌러 바로 열어 주세요</a></small></div>
<!-- 카톡 등 앱 안 브라우저: 크롬·기본 브라우저로 넘김 -->
<div class="msg" id="inapp" hidden>
  <b>크롬(기본 브라우저)에서 열어 주세요</b>
  <span>카카오톡 같은 앱 안에서는 회원 화면이 열리지 않아요.<br>아래 버튼을 누르면 브라우저에서 열려요.</span>
  <a class="btn" id="openOut">브라우저에서 열기</a>
  <a class="sub" id="copyUrl" href="#">버튼이 안 되면: 주소 복사하기</a>
</div>
<div id="help" hidden role="alert"><button type="button" id="helpX" aria-label="닫기">×</button><b>화면에 「현재 파일을 열 수 없습니다」가 보이나요?</b>크롬에 구글 계정이 여러 개 로그인되어 있으면 생기는 문제예요. 아래 버튼을 누르면 바로 열려요. 그래도 안 되면 시크릿 창(Ctrl+Shift+N)에서 열어 주세요.<br><a class="btn2" id="helpGo" target="_top">회원 화면 바로 열기</a></div>
<iframe id="app" title="스즈키 선생님 회원" allow="clipboard-write; screen-wake-lock" hidden></iframe>
<script>
(function () {
  var PROD = 'https://script.google.com/macros/s/AKfycbwL8TpfpY6MOOZI9_W8RCWj4V3B7rXsg4C2TqewDEcYrRYNBWGbJipsE3bU1GKQQzi6Jw/exec';   // 메인 앱 주소 (10-31 releaseNow)
  var STG  = 'https://script.google.com/macros/s/AKfycbyRLvWsahJeeLRQcKeURHCiGn05cWAgiPkctokAUgbr5D0IrtqKYaKGj6zUsnwmqHiE/exec';   // 테스트(STG) 2026-10-27
  var isTest = /[?&]test\b/i.test(location.search);
  var APP = isTest ? STG : PROD;
  if (!APP) { var w = document.getElementById('wait'); w.hidden = false; w.innerHTML = '<b>선생님 회원 화면은 준비 중이에요</b><span>곧 이 주소에서 열려요.</span>'; return; }
  var ua = navigator.userAgent || '', here = location.href.split('#')[0];
  var android = /Android/i.test(ua);
  var kakao = /KAKAOTALK/i.test(ua), line = / Line\//i.test(ua);
  var otherApp = /NAVER\(inapp|Instagram|FBAN|FBAV|BAND\/|DaumApps|everytimeApp|SamsungBrowser\/[\d.]+ .*wv|; wv\)/i.test(ua);
  var out = '';
  if (kakao) out = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(here);
  else if (line) out = here + (here.indexOf('?') < 0 ? '?' : '&') + 'openExternalBrowser=1';
  else if (otherApp && android) out = 'intent://' + here.replace(/^https?:\/\//, '') + '#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=' + encodeURIComponent(here) + ';end';

  if (kakao || line || otherApp) {
    // 앱 안 브라우저: 회원 화면은 넣지 않고 바로 바깥 브라우저로 넘김 (안 넘어가면 버튼·주소 복사)
    document.getElementById('inapp').hidden = false;
    var b = document.getElementById('openOut');
    if (out) { b.href = out; setTimeout(function () { location.href = out; }, 50); }
    else b.style.display = 'none';   // 아이폰의 일부 앱은 자동으로 못 넘김 → 주소 복사 안내
    document.getElementById('copyUrl').onclick = function (e) {
      e.preventDefault();
      var done = function () { alert('주소를 복사했어요. 크롬이나 사파리 주소창에 붙여 넣어 주세요.'); };
      try { navigator.clipboard.writeText(here).then(done, function () { prompt('이 주소를 복사해 브라우저에 붙여 넣어 주세요', here); }); }
      catch (x) { prompt('이 주소를 복사해 브라우저에 붙여 넣어 주세요', here); }
    };
    return;
  }
  // 보통 브라우저: 회원 화면을 화면 가득
  var app = document.getElementById('app');
  document.getElementById('wait').hidden = false;
  document.getElementById('direct').href = APP;
  app.src = APP; app.hidden = false;
  // 10초가 지나도 안 뜨면 앱 주소로 바로 여는 링크 (회사·학교 와이파이가 막는 경우 대비)
  setTimeout(function () { document.getElementById('slow').hidden = false; }, 10000);
  // 앱이 뜨면 앱 안에서 'suzuki-ready' 를 보내 줌 → 8초 안에 안 오면(드라이브 오류 화면 등) 아래 안내
  var ready = false;
  window.addEventListener('message', function (e) { if (e.data === 'suzuki-ready') { ready = true; document.getElementById('help').hidden = true; } });
  document.getElementById('helpGo').href = APP;
  document.getElementById('helpX').onclick = function () { document.getElementById('help').hidden = true; };
  setTimeout(function () { if (!ready) document.getElementById('help').hidden = false; }, 8000);
})();
</script>
</body>
</html>
