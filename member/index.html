<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>스즈키 회원관리</title>
<!--
  스즈키 회원관리 (학원 · 교사 · 학생 · 연회비) — 관리자 페이지 (2026-10-27)
      https://redica1.github.io/suzuki/member/       → 메인 앱
      https://redica1.github.io/suzuki/member/?test  → 테스트(STG) 앱
  · 아이디·비밀번호는 회원관리 DB 시트 「설정」 탭 (이 페이지는 액자일 뿐, 명단·비밀번호는 깃허브에 없음).
  · 코드 원본: gas/member/ (자동 반영 도우미가 STG 에 올림, 메인은 releaseNow)
  · 앱 주소가 생기거나 바뀌면 아래 PROD · STG 두 줄만 바꾸면 됨.
-->
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta property="og:title" content="스즈키 회원관리 (운영진 전용)">
<meta property="og:description" content="운영진만 사용하는 관리자 화면입니다.">
<meta name="theme-color" content="#1b2340">
<style>
  html, body { margin: 0; height: 100%; background: #eef0f4; }
  [hidden] { display: none !important; }
  body { font: 600 17px/1.55 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; color: #18203a; }
  #app { position: fixed; inset: 0; width: 100%; height: 100%; height: 100dvh; border: 0; display: block; }
  .msg { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 24px; color: #5d6680; }
  .msg b { color: #18203a; font-size: 21px; }
  .msg a.btn { display: inline-block; background: #2c46c9; color: #fff; text-decoration: none; border-radius: 12px; padding: 14px 22px; font-size: 18px; font-weight: 700; }
  .msg a.sub { color: #5d6680; font-size: 15px; }
  .spin { width: 26px; height: 26px; border-radius: 50%; border: 3px solid #2c46c9; border-right-color: transparent; animation: s .8s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="msg" id="wait" hidden><span class="spin"></span>회원관리 화면을 여는 중이에요…<small id="slow" hidden>오래 걸리면 <a id="direct" target="_top">여기를 눌러 바로 열어 주세요</a></small></div>
<div class="msg" id="inapp" hidden>
  <b>크롬(기본 브라우저)에서 열어 주세요</b>
  <span>카카오톡 같은 앱 안에서는 회원관리 화면이 열리지 않아요.</span>
  <a class="btn" id="openOut">브라우저에서 열기</a>
  <a class="sub" id="copyUrl" href="#">버튼이 안 되면: 주소 복사하기</a>
</div>
<iframe id="app" title="스즈키 회원관리" allow="camera; clipboard-write; clipboard-read; screen-wake-lock" hidden></iframe>
<script>
(function () {
  var PROD = '';   // 메인 앱 주소 (…/exec) — 배포 후 채움
  var STG  = '';   // 테스트(STG) 앱 주소 (…/exec) — 배포 후 채움
  var isTest = /[?&]test\b/i.test(location.search);
  var APP = isTest ? STG : PROD;
  if (!APP) {   // 아직 배포 전
    var w = document.getElementById('wait'); w.hidden = false;
    w.innerHTML = '<b>' + (isTest ? '테스트(STG)' : '메인') + ' 회원관리는 준비 중이에요</b><span>앱스크립트 배포가 끝나면 이 주소에서 바로 열려요.</span>' + (isTest ? '' : '<a class="sub" href="?test">테스트(STG) 열기</a>');
    return;
  }
  var ua = navigator.userAgent || '', here = location.href.split('#')[0];
  var android = /Android/i.test(ua);
  var kakao = /KAKAOTALK/i.test(ua), line = / Line\//i.test(ua);
  var otherApp = /NAVER\(inapp|Instagram|FBAN|FBAV|BAND\/|DaumApps|everytimeApp|; wv\)/i.test(ua);
  var out = '';
  if (kakao) out = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(here);
  else if (line) out = here + (here.indexOf('?') < 0 ? '?' : '&') + 'openExternalBrowser=1';
  else if (otherApp && android) out = 'intent://' + here.replace(/^https?:\/\//, '') + '#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=' + encodeURIComponent(here) + ';end';

  if (kakao || line || otherApp) {
    document.getElementById('inapp').hidden = false;
    var b = document.getElementById('openOut');
    if (out) { b.href = out; setTimeout(function () { location.href = out; }, 50); }
    else b.style.display = 'none';
    document.getElementById('copyUrl').onclick = function (e) {
      e.preventDefault();
      var done = function () { alert('주소를 복사했어요. 크롬이나 사파리 주소창에 붙여 넣어 주세요.'); };
      try { navigator.clipboard.writeText(here).then(done, function () { prompt('이 주소를 복사해 브라우저에 붙여 넣어 주세요', here); }); }
      catch (x) { prompt('이 주소를 복사해 브라우저에 붙여 넣어 주세요', here); }
    };
    return;
  }
  var app = document.getElementById('app');
  document.getElementById('wait').hidden = false;
  document.getElementById('direct').href = APP;
  app.src = APP; app.hidden = false;
  setTimeout(function () { document.getElementById('slow').hidden = false; }, 10000);
})();
</script>
</body>
</html>
